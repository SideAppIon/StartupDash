<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Админ-панель — LaunchPad</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .admin-header {
      background: linear-gradient(135deg, rgba(255,71,87,.1) 0%, rgba(255,71,87,.03) 100%);
      border-bottom: 1px solid rgba(255,71,87,.2);
      padding: 32px 0;
      margin-bottom: 32px;
    }
    .admin-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,71,87,.15); border: 1px solid rgba(255,71,87,.3);
      color: var(--danger); font-size: 12px; font-weight: 700;
      padding: 4px 12px; border-radius: 20px; letter-spacing: .5px;
      margin-bottom: 12px;
    }
    .stat-cards { display: grid; grid-template-columns: repeat(4,1fr); gap: 16px; margin-bottom: 32px; }
    @media(max-width:768px){.stat-cards{grid-template-columns:repeat(2,1fr);}}
    .stat-card {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 20px;
    }
    .stat-card__num { font-family: var(--font-head); font-size: 36px; font-weight: 800; }
    .stat-card__label { font-size: 12px; color: var(--text2); margin-top: 4px; }
    .user-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 0; border-bottom: 1px solid var(--border);
    }
    .user-row:last-child { border-bottom: none; }
    .user-row__info { flex: 1; }
    .user-row__name { font-size: 14px; font-weight: 500; }
    .user-row__email { font-size: 12px; color: var(--text2); }
    .user-row__actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .tabs-admin { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .tab-a {
      font-size: 14px; font-weight: 500; padding: 10px 20px;
      color: var(--text2); cursor: pointer; border: none; background: none;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: all .2s;
    }
    .tab-a.active { color: var(--danger); border-bottom-color: var(--danger); }
    .tab-a:hover:not(.active) { color: var(--text); }
    .search-bar {
      background: var(--bg3); border: 1px solid var(--border2);
      border-radius: var(--radius); color: var(--text);
      font-family: var(--font-body); font-size: 14px;
      padding: 10px 16px; outline: none; width: 100%;
      margin-bottom: 20px; transition: border-color .2s;
    }
    .search-bar:focus { border-color: var(--danger); }
    .search-bar::placeholder { color: var(--text3); }
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav__logo">Launch<span>Pad</span></a>
  <div class="nav__user">
    <a href="dashboard.html" class="btn btn--ghost btn--sm">← Дашборд</a>
    <img class="nav__avatar" id="navAvatar" src="https://ui-avatars.com/api/?background=181c24&color=00e676&name=A"/>
    <button class="btn btn--ghost btn--sm" onclick="auth.signOut().then(()=>window.location.href='index.html')">Выйти</button>
  </div>
</nav>

<div class="page">
  <div class="container">
    <div class="admin-header" style="margin:-32px -0 32px;padding:32px 0;">
      <div class="container">
        <div class="admin-badge">🛡️ ADMIN PANEL</div>
        <h1 class="page-title">Панель администратора</h1>
        <p class="page-subtitle">Полный контроль над платформой</p>
      </div>
    </div>

    <!-- Stats -->
    <div class="stat-cards" id="statCards">
      <div class="stat-card"><div class="stat-card__num" id="statUsers">—</div><div class="stat-card__label">Пользователей</div></div>
      <div class="stat-card"><div class="stat-card__num" id="statStartups">—</div><div class="stat-card__label">Стартапов</div></div>
      <div class="stat-card"><div class="stat-card__num" id="statInvestors">—</div><div class="stat-card__label">Инвесторов</div></div>
      <div class="stat-card"><div class="stat-card__num" id="statConvs">—</div><div class="stat-card__label">Диалогов</div></div>
    </div>

    <!-- Tabs -->
    <div class="tabs-admin">
      <button class="tab-a active" onclick="showTab('users',this)">👥 Пользователи</button>
      <button class="tab-a" onclick="showTab('startups',this)">🚀 Стартапы</button>
    </div>

    <!-- Users tab -->
    <div id="tab-users">
      <input type="text" class="search-bar" id="userSearch" placeholder="🔍 Поиск по имени или email..." oninput="filterUsers()"/>
      <div id="usersList"><div class="spinner"></div></div>
    </div>

    <!-- Startups tab -->
    <div id="tab-startups" style="display:none;">
      <input type="text" class="search-bar" id="startupSearch" placeholder="🔍 Поиск стартапов..." oninput="filterStartups()"/>
      <div id="startupsList"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<!-- Role change modal -->
<div class="modal-overlay" id="roleModal">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title">Изменить роль</div>
      <button class="modal__close" onclick="closeModal()">×</button>
    </div>
    <p id="roleModalName" style="color:var(--text2);margin-bottom:20px;font-size:14px;"></p>
    <div class="form-group">
      <label class="form-label">Новая роль</label>
      <select class="form-select" id="newRoleSelect">
        <option value="user">Специалист</option>
        <option value="startup">Стартапер</option>
        <option value="investor">Инвестор</option>
        <option value="admin">Администратор</option>
      </select>
    </div>
    <button class="btn btn--primary" style="width:100%;justify-content:center;" onclick="applyRoleChange()">Сохранить</button>
  </div>
</div>

<!-- Reset password modal -->
<div class="modal-overlay" id="pwdModal">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title">Сброс пароля</div>
      <button class="modal__close" onclick="closePwdModal()">×</button>
    </div>
    <p style="color:var(--text2);font-size:14px;margin-bottom:20px;">Письмо для сброса пароля будет отправлено на: <strong id="pwdEmail"></strong></p>
    <button class="btn btn--danger" style="width:100%;justify-content:center;" onclick="confirmResetPwd()">Отправить письмо</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  requireAuth('login.html');

  const ROLE_LABELS = {startup:'Стартапер',investor:'Инвестор',user:'Специалист',admin:'Администратор'};
  const ROLE_CLASSES = {startup:'badge--green',investor:'badge--purple',user:'badge--blue',admin:'badge--red'};

  let allUsers = [];
  let allStartupsAdmin = [];
  let selectedUid = null;
  let resetEmail = null;

  onAuthReady(async (user, userData) => {
    if (!user) return;
    if (userData?.role !== 'admin') { window.location.href = 'dashboard.html'; return; }

    const av = userData.avatar || `https://ui-avatars.com/api/?background=181c24&color=ff4757&name=A`;
    document.getElementById('navAvatar').src = av;

    await Promise.all([loadStats(), loadUsers(), loadStartupsAdmin()]);
  });

  async function loadStats() {
    const [users, startups, convs] = await Promise.all([
      db.collection('users').get(),
      db.collection('startups').get(),
      db.collection('conversations').get()
    ]);
    document.getElementById('statUsers').textContent = users.size;
    document.getElementById('statStartups').textContent = startups.size;
    document.getElementById('statInvestors').textContent = users.docs.filter(d=>d.data().role==='investor').length;
    document.getElementById('statConvs').textContent = convs.size;
  }

  async function loadUsers() {
    const snap = await db.collection('users').orderBy('createdAt','desc').get();
    allUsers = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderUsers(allUsers);
  }

  async function loadStartupsAdmin() {
    const snap = await db.collection('startups').orderBy('createdAt','desc').get();
    allStartupsAdmin = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderStartups(allStartupsAdmin);
  }

  function filterUsers() {
    const q = document.getElementById('userSearch').value.toLowerCase();
    renderUsers(allUsers.filter(u => u.name?.toLowerCase().includes(q) || u.email?.toLowerCase().includes(q)));
  }

  function filterStartups() {
    const q = document.getElementById('startupSearch').value.toLowerCase();
    renderStartups(allStartupsAdmin.filter(s => s.name?.toLowerCase().includes(q)));
  }

  function renderUsers(users) {
    const el = document.getElementById('usersList');
    if (!users.length) { el.innerHTML = '<p style="color:var(--text2);font-size:14px;">Нет пользователей</p>'; return; }
    el.innerHTML = '<div class="card" style="padding:0;overflow:hidden;">' +
      users.map(u => {
        const av = u.avatar || `https://ui-avatars.com/api/?background=181c24&color=00e676&name=${encodeURIComponent(u.name||'U')}`;
        return `
          <div class="user-row" style="padding:14px 24px;">
            <img src="${av}" class="avatar avatar--sm"/>
            <div class="user-row__info">
              <div class="user-row__name">${u.name || '—'}</div>
              <div class="user-row__email">${u.email || '—'} &nbsp;·&nbsp; UID: ${u.uid?.substring(0,8)}...</div>
            </div>
            <span class="badge ${ROLE_CLASSES[u.role]||'badge--gray'}">${ROLE_LABELS[u.role]||u.role}</span>
            <div class="user-row__actions">
              <a href="member.html?uid=${u.uid}" class="btn btn--ghost btn--sm">👁</a>
              <button class="btn btn--outline btn--sm" onclick="openRoleModal('${u.uid}','${u.name}','${u.role}')">Роль</button>
              <button class="btn btn--ghost btn--sm" onclick="openPwdModal('${u.email}')">🔑 Пароль</button>
              <button class="btn btn--danger btn--sm" onclick="deleteUser('${u.uid}','${u.name}')">✕</button>
            </div>
          </div>`;
      }).join('') + '</div>';
  }

  function renderStartups(startups) {
    const el = document.getElementById('startupsList');
    if (!startups.length) { el.innerHTML = '<p style="color:var(--text2);font-size:14px;">Нет стартапов</p>'; return; }
    el.innerHTML = '<div class="card" style="padding:0;overflow:hidden;">' +
      startups.map(s => `
        <div class="user-row" style="padding:14px 24px;">
          <span style="font-size:28px;">${s.emoji||'🚀'}</span>
          <div class="user-row__info">
            <div class="user-row__name">${s.name}</div>
            <div class="user-row__email">${s.ownerName||'?'} · ${s.category||''} · ${formatDate(s.createdAt)}</div>
          </div>
          <span class="badge badge--green">${s.stage||'Идея'}</span>
          <div class="user-row__actions">
            <a href="startup.html?id=${s.id}" class="btn btn--outline btn--sm" target="_blank">Открыть</a>
            <button class="btn btn--danger btn--sm" onclick="deleteStartup('${s.id}','${s.name}')">✕ Удалить</button>
          </div>
        </div>`).join('') + '</div>';
  }

  function showTab(name, btn) {
    document.querySelectorAll('.tab-a').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-users').style.display = name === 'users' ? 'block' : 'none';
    document.getElementById('tab-startups').style.display = name === 'startups' ? 'block' : 'none';
  }

  // Role modal
  function openRoleModal(uid, name, currentRole) {
    selectedUid = uid;
    document.getElementById('roleModalName').textContent = `Пользователь: ${name}`;
    document.getElementById('newRoleSelect').value = currentRole;
    document.getElementById('roleModal').classList.add('open');
  }
  function closeModal() { document.getElementById('roleModal').classList.remove('open'); }

  async function applyRoleChange() {
    const newRole = document.getElementById('newRoleSelect').value;
    await db.collection('users').doc(selectedUid).update({ role: newRole });
    closeModal();
    showToast('Роль обновлена', 'success');
    await loadUsers();
  }

  // Password reset
  function openPwdModal(email) {
    resetEmail = email;
    document.getElementById('pwdEmail').textContent = email;
    document.getElementById('pwdModal').classList.add('open');
  }
  function closePwdModal() { document.getElementById('pwdModal').classList.remove('open'); }
  async function confirmResetPwd() {
    try {
      await auth.sendPasswordResetEmail(resetEmail);
      closePwdModal();
      showToast('Письмо отправлено', 'success');
    } catch(e) { showToast('Ошибка: ' + e.message, 'error'); }
  }

  // Delete user
  async function deleteUser(uid, name) {
    if (!confirm(`Удалить пользователя "${name}"? Это действие нельзя отменить.`)) return;
    await db.collection('users').doc(uid).delete();
    showToast('Пользователь удалён', 'success');
    await loadUsers();
    await loadStats();
  }

  // Delete startup
  async function deleteStartup(id, name) {
    if (!confirm(`Удалить стартап "${name}"?`)) return;
    await db.collection('startups').doc(id).delete();
    showToast('Стартап удалён', 'success');
    await loadStartupsAdmin();
    await loadStats();
  }
</script>
</body>
</html>
