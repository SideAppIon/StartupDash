<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Сообщения — LaunchPad</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body { overflow: hidden; }
    .chat-header {
      padding:16px 24px;border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:12px;
      background:var(--bg2);
    }
    .chat-header__name { font-family:var(--font-head);font-size:16px;font-weight:700; }
    .chat-header__role { font-size:12px;color:var(--text2); }
    .sidebar-header { padding:16px;border-bottom:1px solid var(--border); }
    .sidebar-header h3 { font-family:var(--font-head);font-size:16px;font-weight:700; }
    .empty-chat { flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text2); }
    .empty-chat__icon { font-size:48px;opacity:.3; }
    .chat-input { flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:var(--font-body);font-size:14px;padding:10px 16px;outline:none;resize:none; }
    .chat-input:focus { border-color:var(--accent); }
    .nav-chat { position:fixed;top:0;left:0;right:0;height:var(--nav-h);background:rgba(10,12,15,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 24px;gap:16px;z-index:100; }
    .nav-chat__logo { font-family:var(--font-head);font-size:20px;font-weight:800;color:var(--accent);text-decoration:none; }
    .nav-chat__logo span{color:var(--text);}
  </style>
</head>
<body>

<nav class="nav-chat">
  <a href="index.html" class="nav-chat__logo">Launch<span>Pad</span></a>
  <a href="dashboard.html" class="btn btn--ghost btn--sm" style="margin-left:auto;">← Дашборд</a>
  <img class="nav__avatar" id="navAvatar" src="https://ui-avatars.com/api/?background=181c24&color=00e676&name=U"/>
</nav>

<div class="chat-layout">
  <!-- Sidebar -->
  <div class="chat-sidebar">
    <div class="sidebar-header">
      <h3>Сообщения</h3>
    </div>
    <div id="convList">
      <div class="spinner" style="margin:32px auto;width:24px;height:24px;border-width:2px;"></div>
    </div>
  </div>

  <!-- Chat main -->
  <div class="chat-main" id="chatMain">
    <div class="empty-chat">
      <div class="empty-chat__icon">💬</div>
      <p>Выбери диалог слева</p>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase-config.js"></script>
<script>
  requireAuth('login.html');

  let activeConvId = null;
  let msgUnsubscribe = null;

  onAuthReady(async (user, userData) => {
    if (!user) return;

    const avatar = userData?.avatar || `https://ui-avatars.com/api/?background=181c24&color=00e676&name=${encodeURIComponent(userData?.name||'U')}`;
    document.getElementById('navAvatar').src = avatar;
    document.getElementById('navAvatar').onclick = () => window.location.href = 'profile.html';

    // Check if coming from startup page (to=uid)
    const toUid = getUrlParam('to');
    if (toUid && toUid !== user.uid) {
      await ensureConversation(user.uid, toUid);
    }

    loadConversations(user.uid);
  });

  async function ensureConversation(myUid, otherUid) {
    // Find existing
    const convSnap = await db.collection('conversations')
      .where('participants','array-contains', myUid).get();

    let found = null;
    convSnap.forEach(doc => {
      const p = doc.data().participants;
      if (p.includes(otherUid)) found = doc.id;
    });

    if (!found) {
      const otherUser = await db.collection('users').doc(otherUid).get();
      const ref = await db.collection('conversations').add({
        participants: [myUid, otherUid],
        participantNames: {
          [myUid]: currentUserData.name,
          [otherUid]: otherUser.exists ? otherUser.data().name : 'Unknown'
        },
        participantAvatars: {
          [myUid]: currentUserData.avatar || '',
          [otherUid]: otherUser.exists ? otherUser.data().avatar || '' : ''
        },
        lastMessage: '',
        lastAt: firebase.firestore.FieldValue.serverTimestamp(),
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      found = ref.id;
    }
    activeConvId = found;
    return found;
  }

  function loadConversations(uid) {
    db.collection('conversations')
      .where('participants','array-contains', uid)
      .orderBy('lastAt','desc')
      .onSnapshot(snap => {
        const convs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderConvList(convs, uid);
        if (activeConvId) openConversation(activeConvId, uid);
      });
  }

  function renderConvList(convs, myUid) {
    const el = document.getElementById('convList');
    if (convs.length === 0) {
      el.innerHTML = '<p style="font-size:13px;color:var(--text2);padding:16px;">Нет диалогов</p>';
      return;
    }
    el.innerHTML = convs.map(c => {
      const otherUid = c.participants.find(p => p !== myUid);
      const name = c.participantNames?.[otherUid] || 'Неизвестно';
      const av = c.participantAvatars?.[otherUid] || `https://ui-avatars.com/api/?background=181c24&color=00e676&name=${encodeURIComponent(name)}`;
      return `
        <div class="conv-item ${activeConvId === c.id ? 'active' : ''}" onclick="openConversation('${c.id}','${myUid}')">
          <img src="${av}" class="avatar avatar--sm"/>
          <div style="flex:1;min-width:0;">
            <div class="conv-item__name">${name}</div>
            <div class="conv-item__preview" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${c.lastMessage||'...'}</div>
          </div>
        </div>`;
    }).join('');
  }

  async function openConversation(convId, myUid) {
    activeConvId = convId;
    if (msgUnsubscribe) msgUnsubscribe();

    // Get other user info
    const convSnap = await db.collection('conversations').doc(convId).get();
    const conv = convSnap.data();
    const otherUid = conv.participants.find(p => p !== myUid);
    const otherName = conv.participantNames?.[otherUid] || 'Неизвестно';
    const otherAvatar = conv.participantAvatars?.[otherUid] || `https://ui-avatars.com/api/?background=181c24&color=00e676&name=${encodeURIComponent(otherName)}`;

    document.getElementById('chatMain').innerHTML = `
      <div class="chat-header">
        <img src="${otherAvatar}" class="avatar avatar--sm"/>
        <div>
          <div class="chat-header__name">${otherName}</div>
          <div class="chat-header__role">
            <a href="member.html?uid=${otherUid}" style="color:var(--accent);font-size:12px;text-decoration:none;">Посмотреть профиль →</a>
          </div>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-area">
        <textarea class="chat-input" id="msgInput" placeholder="Напиши сообщение..." rows="1"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage('${convId}','${myUid}')}"
          oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
        <button class="btn btn--primary" onclick="sendMessage('${convId}','${myUid}')">→</button>
      </div>
    `;

    // Listen to messages
    msgUnsubscribe = db.collection('conversations').doc(convId).collection('messages')
      .orderBy('createdAt','asc')
      .onSnapshot(snap => {
        const msgsEl = document.getElementById('chatMessages');
        if (!msgsEl) return;
        msgsEl.innerHTML = snap.docs.map(d => {
          const m = d.data();
          const isMine = m.senderUid === myUid;
          return `
            <div class="msg ${isMine ? 'msg--mine' : 'msg--theirs'}">
              <div class="msg__bubble">${escapeHtml(m.text)}</div>
              <div class="msg__time">${m.createdAt ? formatDate(m.createdAt) : ''}</div>
            </div>`;
        }).join('');
        msgsEl.scrollTop = msgsEl.scrollHeight;
      });

    // Highlight in sidebar
    document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
    document.querySelector(`.conv-item[onclick*="${convId}"]`)?.classList.add('active');
  }

  async function sendMessage(convId, myUid) {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text) return;

    input.value = ''; input.style.height = 'auto';

    await db.collection('conversations').doc(convId).collection('messages').add({
      text, senderUid: myUid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    await db.collection('conversations').doc(convId).update({
      lastMessage: text.substring(0, 80),
      lastAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  }
</script>
</body>
</html>
