<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Сообщения — LaunchPad</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    html,body{height:100%;overflow:hidden}
    .chat-layout{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - var(--nav-h));margin-top:var(--nav-h)}
    .chat-sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
    .chat-main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

    /* sidebar */
    .sidebar-head{padding:16px;border-bottom:1px solid var(--border);flex-shrink:0}
    .sidebar-head h3{font-family:var(--font-head);font-size:15px;font-weight:700;margin-bottom:10px}
    .sidebar-search{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:13px;padding:8px 12px;outline:none;transition:border-color .2s}
    .sidebar-search:focus{border-color:var(--accent)}
    .sidebar-search::placeholder{color:var(--text3)}
    .conv-list{flex:1;overflow-y:auto}
    .conv-item{display:flex;align-items:center;gap:11px;padding:13px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s;position:relative}
    .conv-item:hover{background:var(--bg3)}
    .conv-item.active{background:var(--accent-dim);border-left:2px solid var(--accent)}
    .conv-item__info{flex:1;min-width:0}
    .conv-item__name{font-size:13px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .conv-item__preview{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .conv-item__time{font-size:11px;color:var(--text3);flex-shrink:0;align-self:flex-start;margin-top:1px}
    .conv-item__unread{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#000;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}

    /* system message badge */
    .conv-item--system .conv-item__preview{color:var(--accent);font-style:italic}

    /* new conv button */
    .new-conv-btn{margin:12px;border:1px dashed var(--border2);border-radius:var(--radius);padding:10px;text-align:center;font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s}
    .new-conv-btn:hover{border-color:var(--accent);color:var(--accent)}

    /* empty sidebar */
    .sidebar-empty{padding:24px 16px;text-align:center;color:var(--text2);font-size:13px;line-height:1.6}

    /* chat header */
    .chat-header{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:12px;flex-shrink:0}
    .chat-header__info{flex:1;min-width:0}
    .chat-header__name{font-family:var(--font-head);font-size:15px;font-weight:700}
    .chat-header__sub{font-size:12px;color:var(--text2);margin-top:1px}

    /* messages area */
    .chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
    .chat-date-sep{text-align:center;font-size:11px;color:var(--text3);margin:8px 0;position:relative}
    .chat-date-sep::before,.chat-date-sep::after{content:'';position:absolute;top:50%;width:calc(50% - 60px);height:1px;background:var(--border)}
    .chat-date-sep::before{left:0}.chat-date-sep::after{right:0}

    /* messages */
    .msg{max-width:72%;display:flex;flex-direction:column}
    .msg--mine{align-self:flex-end}
    .msg--theirs{align-self:flex-start}
    .msg__bubble{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
    .msg--theirs .msg__bubble{background:var(--bg2);border:1px solid var(--border);border-radius:4px 14px 14px 14px}
    .msg--mine .msg__bubble{background:var(--accent-dim);border:1px solid rgba(0,230,118,.25);border-radius:14px 4px 14px 14px}
    .msg__time{font-size:11px;color:var(--text3);margin-top:3px;padding:0 2px}
    .msg--mine .msg__time{text-align:right}

    /* system message */
    .msg--system{align-self:center;max-width:80%}
    .msg--system .msg__bubble{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;font-size:12px;color:var(--text2);text-align:center;padding:8px 16px;font-style:italic}

    /* input */
    .chat-input-area{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;flex-shrink:0;background:var(--bg2)}
    .chat-textarea{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:var(--font-body);font-size:14px;padding:10px 14px;outline:none;resize:none;transition:border-color .2s;line-height:1.5;max-height:120px}
    .chat-textarea:focus{border-color:var(--accent)}
    .send-btn{width:40px;height:40px;border-radius:var(--radius);background:var(--accent);border:none;color:#000;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
    .send-btn:hover{background:var(--accent2)}
    .send-btn:disabled{opacity:.4;cursor:not-allowed}

    /* empty state */
    .empty-chat{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text2)}
    .empty-chat__icon{font-size:52px;opacity:.25}
    .empty-chat p{font-size:14px;text-align:center;max-width:280px;line-height:1.6}

    /* new conv modal */
    .user-pick-list{max-height:320px;overflow-y:auto;margin-top:12px}
    .user-pick-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;transition:background .15s}
    .user-pick-item:hover{background:var(--bg3)}
    .user-pick-item__name{font-size:14px;font-weight:500}
    .user-pick-item__role{font-size:12px;color:var(--text2)}

    @media(max-width:640px){
      .chat-layout{grid-template-columns:1fr}
      .chat-sidebar{display:none}
    }
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav__logo">Launch<span>Pad</span></a>
  <div class="nav__user">
    <a href="dashboard.html" class="btn btn--ghost btn--sm">← Дашборд</a>
    <span class="nav__role" id="navRole"></span>
    <img class="nav__avatar" id="navAvatar"
      src="https://ui-avatars.com/api/?background=181c24&color=00e676&name=U"
      onclick="window.location.href='profile.html'"/>
  </div>
</nav>

<div class="chat-layout">
  <!-- SIDEBAR -->
  <div class="chat-sidebar">
    <div class="sidebar-head">
      <h3>Сообщения</h3>
      <input class="sidebar-search" id="convSearch" placeholder="Поиск диалогов..."
        oninput="filterConvs(this.value)"/>
    </div>
    <div class="new-conv-btn" onclick="openNewConvModal()">✏️ Новый диалог</div>
    <div class="conv-list" id="convList">
      <div style="padding:24px;text-align:center">
        <div class="spinner" style="width:22px;height:22px;border-width:2px;margin:0 auto 8px"></div>
        <div style="font-size:12px;color:var(--text2)">Загрузка...</div>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="chat-main" id="chatMain">
    <div class="empty-chat">
      <div class="empty-chat__icon">💬</div>
      <p>Выбери диалог слева или начни новый</p>
    </div>
  </div>
</div>

<!-- NEW CONV MODAL -->
<div class="modal-overlay" id="newConvModal">
  <div class="modal" style="max-width:480px">
    <div class="modal__header">
      <div class="modal__title">Новый диалог</div>
      <button class="modal__close" onclick="document.getElementById('newConvModal').classList.remove('open')">×</button>
    </div>
    <input class="form-input" id="userPickSearch" placeholder="Поиск по имени..."
      oninput="filterUserPick(this.value)" style="margin-bottom:4px"/>
    <div class="user-pick-list" id="userPickList">
      <div style="text-align:center;padding:20px">
        <div class="spinner" style="width:20px;height:20px;border-width:2px;margin:0 auto"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
requireAuth('login.html');

var myUid      = null;
var myData     = null;
var activeId   = null;
var msgUnsub   = null;
var convUnsub  = null;
var allConvs   = [];   // кэш для поиска
var allUsers   = [];   // кэш для нового диалога

// ─── INIT ────────────────────────────────────────────
onAuthReady(async function(user, userData) {
  if (!user) return;
  myUid  = user.uid;
  myData = userData;
  renderNav(userData);

  // Если пришли с ?to=uid (из страницы стартапа — инвестор пишет основателю)
  var toUid = getUrlParam('to');
  if (toUid && toUid !== myUid) {
    try {
      activeId = await ensureConv(toUid);
    } catch(e) { console.warn('ensureConv:', e.message); }
  }

  // Если пришли с ?invite=inviteId — создаём системное сообщение об заявке
  var inviteId = getUrlParam('invite');
  if (inviteId) {
    await handleInviteMessage(inviteId);
  }

  startConvListener();
  loadUsersForPicker();
});

// ─── CONV LISTENER ───────────────────────────────────
function startConvListener() {
  if (convUnsub) convUnsub();

  var query = db.collection('conversations')
    .where('participants', 'array-contains', myUid)
    .orderBy('lastAt', 'desc');

  convUnsub = query.onSnapshot(function(snap) {
    allConvs = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
    renderConvList(allConvs);
    if (activeId) {
      // подсветить активный
      highlightActive(activeId);
      if (!document.getElementById('chatMessages')) openConv(activeId);
    }
  }, function(err) {
    // нет индекса — грузим без orderBy
    db.collection('conversations')
      .where('participants', 'array-contains', myUid)
      .get().then(function(snap) {
        allConvs = snap.docs.map(function(d) { return Object.assign({ id: d.id }, d.data()); });
        allConvs.sort(function(a,b){
          var ta = a.lastAt && a.lastAt.seconds ? a.lastAt.seconds : 0;
          var tb = b.lastAt && b.lastAt.seconds ? b.lastAt.seconds : 0;
          return tb - ta;
        });
        renderConvList(allConvs);
        if (activeId) openConv(activeId);
      }).catch(function(e2) {
        document.getElementById('convList').innerHTML =
          '<div class="sidebar-empty">Ошибка загрузки:<br>' + e2.message + '</div>';
      });
  });
}

// ─── RENDER CONV LIST ────────────────────────────────
function renderConvList(convs) {
  filterConvs(document.getElementById('convSearch').value);
}

function filterConvs(q) {
  q = (q || '').toLowerCase();
  var filtered = q ? allConvs.filter(function(c) {
    var name = getOtherName(c);
    return name.toLowerCase().includes(q);
  }) : allConvs;

  var el = document.getElementById('convList');
  if (!filtered.length) {
    el.innerHTML = '<div class="sidebar-empty">' +
      (q ? 'Ничего не найдено' : 'Нет диалогов.<br>Нажми «Новый диалог»') + '</div>';
    return;
  }

  el.innerHTML = filtered.map(function(c) {
    var other = getOtherUid(c);
    var name  = getOtherName(c);
    var av    = (c.participantAvatars && c.participantAvatars[other]) ||
      'https://ui-avatars.com/api/?background=181c24&color=00e676&name=' + encodeURIComponent(name);
    var isActive  = activeId === c.id;
    var isSystem  = c.lastMessage && c.lastMessage.startsWith('📋');
    var timeStr   = c.lastAt ? shortTime(c.lastAt) : '';
    var preview   = c.lastMessage || '...';

    return '<div class="conv-item' + (isActive?' active':'') + (isSystem?' conv-item--system':'') +
      '" onclick="openConv(\'' + c.id + '\')">' +
      '<img src="' + esc(av) + '" class="avatar avatar--sm" style="flex-shrink:0"/>' +
      '<div class="conv-item__info">' +
        '<div class="conv-item__name">' + esc(name) + '</div>' +
        '<div class="conv-item__preview">' + esc(preview) + '</div>' +
      '</div>' +
      '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0">' +
        '<div class="conv-item__time">' + timeStr + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

function getOtherUid(conv) {
  var parts = conv.participants || [];
  return parts.find(function(p) { return p !== myUid; }) || '';
}
function getOtherName(conv) {
  var other = getOtherUid(conv);
  return (conv.participantNames && conv.participantNames[other]) || 'Неизвестно';
}
function shortTime(ts) {
  if (!ts) return '';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  var now = new Date();
  if (d.toDateString() === now.toDateString()) {
    return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
}

// ─── OPEN CONV ───────────────────────────────────────
async function openConv(convId) {
  activeId = convId;
  highlightActive(convId);
  if (msgUnsub) { msgUnsub(); msgUnsub = null; }

  // Показать скелетон
  document.getElementById('chatMain').innerHTML =
    '<div style="flex:1;display:flex;align-items:center;justify-content:center">' +
    '<div class="spinner"></div></div>';

  var snap = await db.collection('conversations').doc(convId).get();
  if (!snap.exists) return;
  var conv  = snap.data();
  var other = getOtherUid(conv);
  var name  = (conv.participantNames && conv.participantNames[other]) || 'Неизвестно';
  var av    = (conv.participantAvatars && conv.participantAvatars[other]) ||
    'https://ui-avatars.com/api/?background=181c24&color=00e676&name=' + encodeURIComponent(name);
  var role  = conv.participantRoles && conv.participantRoles[other]
    ? (ROLE_LABELS[conv.participantRoles[other]] || '') : '';

  document.getElementById('chatMain').innerHTML =
    '<div class="chat-header">' +
      '<img src="' + esc(av) + '" class="avatar avatar--md" onclick="window.location.href=\'member.html?uid=' + esc(other) + '\'" style="cursor:pointer"/>' +
      '<div class="chat-header__info">' +
        '<div class="chat-header__name">' + esc(name) + '</div>' +
        '<div class="chat-header__sub">' +
          (role ? '<span class="badge badge--gray" style="font-size:11px">' + role + '</span> · ' : '') +
          '<a href="member.html?uid=' + esc(other) + '" style="color:var(--accent);text-decoration:none;font-size:12px">Профиль →</a>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="chat-messages" id="chatMessages"></div>' +
    '<div class="chat-input-area">' +
      '<textarea class="chat-textarea" id="msgInput" placeholder="Напиши сообщение..." rows="1"' +
        ' onkeydown="if(event.key===\'Enter\'&&!event.shiftKey){event.preventDefault();send()}"' +
        ' oninput="autoResize(this)"></textarea>' +
      '<button class="send-btn" id="sendBtn" onclick="send()">→</button>' +
    '</div>';

  // Слушаем сообщения
  msgUnsub = db.collection('conversations').doc(convId)
    .collection('messages').orderBy('createdAt', 'asc')
    .onSnapshot(function(snap) {
      var el = document.getElementById('chatMessages');
      if (!el) return;
      var html = '';
      var lastDate = '';
      snap.docs.forEach(function(d) {
        var m    = d.data();
        var mine = m.senderUid === myUid;
        var sys  = m.type === 'system';
        var dateStr = m.createdAt ? dayStr(m.createdAt) : '';
        if (dateStr && dateStr !== lastDate) {
          html += '<div class="chat-date-sep">' + dateStr + '</div>';
          lastDate = dateStr;
        }
        if (sys) {
          html += '<div class="msg msg--system"><div class="msg__bubble">' +
            esc(m.text).replace(/\n/g,'<br>') + '</div></div>';
        } else {
          html += '<div class="msg ' + (mine?'msg--mine':'msg--theirs') + '">' +
            '<div class="msg__bubble">' + esc(m.text||'').replace(/\n/g,'<br>') + '</div>' +
            '<div class="msg__time">' + timeStr(m.createdAt) + '</div>' +
          '</div>';
        }
      });
      el.innerHTML = html || '<div style="text-align:center;color:var(--text3);font-size:13px;margin-top:40px">Напиши первое сообщение</div>';
      el.scrollTop = el.scrollHeight;
    }, function(err) {
      console.warn('msg listener:', err.message);
    });
}

function highlightActive(convId) {
  document.querySelectorAll('.conv-item').forEach(function(el) {
    var onclick = el.getAttribute('onclick') || '';
    el.classList.toggle('active', onclick.includes(convId));
  });
}

function dayStr(ts) {
  if (!ts) return '';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  var now = new Date();
  if (d.toDateString() === now.toDateString()) return 'Сегодня';
  var y = new Date(); y.setDate(y.getDate()-1);
  if (d.toDateString() === y.toDateString()) return 'Вчера';
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
}
function timeStr(ts) {
  if (!ts) return '';
  var d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
}

// ─── SEND ─────────────────────────────────────────────
async function send() {
  if (!activeId || !myUid) return;
  var inp  = document.getElementById('msgInput');
  var btn  = document.getElementById('sendBtn');
  var text = inp ? inp.value.trim() : '';
  if (!text) return;

  inp.value = ''; inp.style.height = 'auto';
  btn.disabled = true;

  try {
    await db.collection('conversations').doc(activeId).collection('messages').add({
      text:      text,
      senderUid: myUid,
      type:      'user',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('conversations').doc(activeId).update({
      lastMessage: text.substring(0, 80),
      lastAt:      firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) {
    showToast('Ошибка: ' + e.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ─── ENSURE CONV (создать или найти диалог) ───────────
async function ensureConv(otherUid) {
  // Ищем существующий
  var snap = await db.collection('conversations')
    .where('participants', 'array-contains', myUid).get();
  for (var i = 0; i < snap.docs.length; i++) {
    var parts = snap.docs[i].data().participants || [];
    if (parts.indexOf(otherUid) !== -1) return snap.docs[i].id;
  }
  // Создаём новый
  return await createConv(otherUid);
}

async function createConv(otherUid) {
  var otherSnap = await db.collection('users').doc(otherUid).get();
  var other = otherSnap.exists ? otherSnap.data() : { name: 'Unknown', avatar: '', role: 'user' };

  var names   = {}; names[myUid]   = (myData&&myData.name)   || ''; names[otherUid]   = other.name   || '';
  var avatars = {}; avatars[myUid] = (myData&&myData.avatar) || ''; avatars[otherUid] = other.avatar || '';
  var roles   = {}; roles[myUid]   = (myData&&myData.role)   || ''; roles[otherUid]   = other.role   || '';

  var ref = await db.collection('conversations').add({
    participants:      [myUid, otherUid],
    participantNames:  names,
    participantAvatars:avatars,
    participantRoles:  roles,
    lastMessage:       '',
    lastAt:            firebase.firestore.FieldValue.serverTimestamp(),
    createdAt:         firebase.firestore.FieldValue.serverTimestamp()
  });
  return ref.id;
}

// ─── INVITE → SYSTEM MESSAGE ──────────────────────────
// Когда стартапер принял/отклонил заявку — автоматически создаётся
// системное сообщение в чате между участником и основателем
async function handleInviteMessage(inviteId) {
  try {
    var invSnap = await db.collection('invites').doc(inviteId).get();
    if (!invSnap.exists) return;
    var inv = invSnap.data();

    // Определяем с кем создать диалог
    var otherUid = inv.fromUid === myUid ? inv.startupOwner : inv.fromUid;
    var convId   = await ensureConv(otherUid);
    activeId     = convId;

    // Добавляем системное сообщение
    var statusText = inv.status === 'accepted'
      ? '✅ Заявка в стартап «' + (inv.startupName||'') + '» принята!'
      : inv.status === 'rejected'
      ? '❌ Заявка в стартап «' + (inv.startupName||'') + '» отклонена'
      : '📋 Заявка в стартап «' + (inv.startupName||'') + '»\n' + (inv.message||'');

    await db.collection('conversations').doc(convId).collection('messages').add({
      text:      statusText,
      senderUid: 'system',
      type:      'system',
      inviteId:  inviteId,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('conversations').doc(convId).update({
      lastMessage: statusText.substring(0, 80),
      lastAt:      firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) {
    console.warn('handleInviteMessage:', e.message);
  }
}

// ─── NEW CONV MODAL ───────────────────────────────────
async function loadUsersForPicker() {
  try {
    var snap = await db.collection('users').get();
    allUsers = snap.docs
      .map(function(d) { return d.data(); })
      .filter(function(u) { return u.uid && u.uid !== myUid; });
    // Если модалка уже открыта — обновляем список
    if (document.getElementById('newConvModal').classList.contains('open')) {
      renderUserPick(allUsers);
    }
  } catch(e) { console.warn('loadUsers:', e.message); }
}

function openNewConvModal() {
  document.getElementById('userPickSearch').value = '';
  document.getElementById('newConvModal').classList.add('open');
  if (allUsers.length) renderUserPick(allUsers);
  else loadUsersForPicker().then(function() { renderUserPick(allUsers); });
}

function filterUserPick(q) {
  q = q.toLowerCase();
  var filtered = q ? allUsers.filter(function(u) {
    return (u.name||'').toLowerCase().includes(q) || (u.email||'').toLowerCase().includes(q);
  }) : allUsers;
  renderUserPick(filtered);
}

function renderUserPick(users) {
  var el = document.getElementById('userPickList');
  if (!users.length) { el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text2);font-size:13px">Никого не найдено</div>'; return; }
  el.innerHTML = users.map(function(u) {
    var av = u.avatar || 'https://ui-avatars.com/api/?background=181c24&color=00e676&name=' + encodeURIComponent(u.name||'U');
    return '<div class="user-pick-item" onclick="startConvWith(\'' + u.uid + '\')">' +
      '<img src="' + esc(av) + '" class="avatar avatar--sm"/>' +
      '<div>' +
        '<div class="user-pick-item__name">' + esc(u.name||'—') + '</div>' +
        '<div class="user-pick-item__role">' + (ROLE_LABELS[u.role]||u.role||'') + '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function startConvWith(otherUid) {
  document.getElementById('newConvModal').classList.remove('open');
  try {
    var convId = await ensureConv(otherUid);
    activeId = convId;
    startConvListener(); // обновит список и откроет диалог
    setTimeout(function() { openConv(convId); }, 400);
  } catch(e) {
    showToast('Ошибка: ' + e.message, 'error');
  }
}

// ─── HELPERS ──────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
