<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Сообщения — LaunchPad</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    html,body{height:100%;overflow:hidden}
    .chat-layout{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - var(--nav-h));margin-top:var(--nav-h)}
    .chat-sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
    .chat-main{display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
    .sidebar-head{padding:16px;border-bottom:1px solid var(--border);flex-shrink:0}
    .sidebar-head h3{font-family:var(--font-head);font-size:15px;font-weight:700;margin-bottom:10px}
    .sidebar-search{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-size:13px;padding:8px 12px;outline:none;transition:border-color .2s}
    .sidebar-search:focus{border-color:var(--accent)}
    .sidebar-search::placeholder{color:var(--text3)}
    .conv-list{flex:1;overflow-y:auto}
    .new-conv-btn{margin:10px 12px;border:1px dashed var(--border2);border-radius:var(--radius);padding:9px;text-align:center;font-size:13px;color:var(--text2);cursor:pointer;transition:all .2s}
    .new-conv-btn:hover{border-color:var(--accent);color:var(--accent)}
    .new-conv-btn.hidden{display:none}
    .conv-item{display:flex;align-items:center;gap:11px;padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
    .conv-item:hover{background:var(--bg3)}
    .conv-item.active{background:var(--accent-dim);border-left:2px solid var(--accent)}
    .conv-item__info{flex:1;min-width:0}
    .conv-item__name{font-size:13px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .conv-item__preview{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .conv-item__time{font-size:11px;color:var(--text3);flex-shrink:0}
    .sidebar-empty{padding:24px 16px;text-align:center;color:var(--text2);font-size:13px;line-height:1.6}
    .chat-header{padding:14px 20px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;align-items:center;gap:12px;flex-shrink:0}
    .chat-header__name{font-family:var(--font-head);font-size:15px;font-weight:700}
    .chat-header__sub{font-size:12px;color:var(--text2);margin-top:1px}
    .chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px}
    .chat-date-sep{text-align:center;font-size:11px;color:var(--text3);margin:6px 0}
    .msg{max-width:72%;display:flex;flex-direction:column}
    .msg--mine{align-self:flex-end}
    .msg--theirs{align-self:flex-start}
    .msg__bubble{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.55;word-break:break-word;white-space:pre-wrap}
    .msg--theirs .msg__bubble{background:var(--bg2);border:1px solid var(--border);border-radius:4px 14px 14px 14px}
    .msg--mine .msg__bubble{background:var(--accent-dim);border:1px solid rgba(0,230,118,.25);border-radius:14px 4px 14px 14px}
    .msg__time{font-size:11px;color:var(--text3);margin-top:3px;padding:0 2px}
    .msg--mine .msg__time{text-align:right}
    .msg--system{align-self:center;max-width:80%}
    .msg--system .msg__bubble{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;font-size:12px;color:var(--text2);text-align:center;padding:8px 16px;font-style:italic}
    .chat-input-area{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:flex-end;flex-shrink:0;background:var(--bg2)}
    .chat-textarea{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:var(--font-body);font-size:14px;padding:10px 14px;outline:none;resize:none;transition:border-color .2s;line-height:1.5;max-height:120px}
    .chat-textarea:focus{border-color:var(--accent)}
    .send-btn{width:40px;height:40px;border-radius:var(--radius);background:var(--accent);border:none;color:#000;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
    .send-btn:hover{background:var(--accent2)}
    .send-btn:disabled{opacity:.4;cursor:not-allowed}
    .empty-chat{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--text2)}
    .empty-chat__icon{font-size:52px;opacity:.25}
    .no-access-note{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 16px;font-size:13px;color:var(--text2);text-align:center;margin:10px 16px}
    .user-pick-list{max-height:320px;overflow-y:auto;margin-top:12px}
    .user-pick-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius);cursor:pointer;transition:background .15s}
    .user-pick-item:hover{background:var(--bg3)}
    .user-pick-item__name{font-size:14px;font-weight:500}
    .user-pick-item__role{font-size:12px;color:var(--text2)}
    @media(max-width:640px){.chat-layout{grid-template-columns:1fr}.chat-sidebar{display:none}}
  </style>
</head>
<body>
<nav class="nav">
  <a href="dashboard.html" class="nav__logo">Launch<span>Pad</span></a>
  <a href="startups.html">Стартапы</a>
  <a href="feed.html">Лента</a>
  <a href="forum.html">Форум</a>
  <a href="members.html">Участники</a>
  <div class="nav__user">
    <a href="messages.html" class="btn btn--ghost btn--sm active">💬 Сообщения</a>
    <span class="nav__role" id="navRole"></span>
    <img class="nav__avatar" id="navAvatar" src="https://ui-avatars.com/api/?background=181c24&color=00e676&name=U" onclick="goProfile()"/>
    <button class="btn btn--ghost btn--sm" onclick="auth.signOut().then(function(){window.location.href='index.html'})">Выйти</button>
  </div>
</nav>

<div class="chat-layout">
  <div class="chat-sidebar">
    <div class="sidebar-head">
      <h3>Сообщения</h3>
      <input class="sidebar-search" id="convSearch" placeholder="Поиск..."
        oninput="filterConvs(this.value)"/>
    </div>
    <div class="new-conv-btn hidden" id="newConvBtn" onclick="openNewConvModal()">✏️ Новый диалог</div>
    <div class="conv-list" id="convList">
      <div class="sidebar-empty">Загрузка...</div>
    </div>
  </div>

  <div class="chat-main">
    <div class="empty-chat" id="emptyState">
      <div class="empty-chat__icon">💬</div>
      <p style="font-size:14px;text-align:center">Выбери диалог слева<br>или начни новый</p>
    </div>
    <div id="chatHeader" class="chat-header" style="display:none">
      <img id="chatAvatar" class="avatar avatar--md" style="cursor:pointer"
        onclick="if(currentOtherUid)window.location.href='member.html?uid='+currentOtherUid"/>
      <div class="chat-header__info">
        <div class="chat-header__name" id="chatName"></div>
        <div class="chat-header__sub" id="chatSub"></div>
      </div>
    </div>
    <div class="chat-messages" id="chatMessages" style="display:none"></div>
    <div class="chat-input-area" id="chatInputArea" style="display:none">
      <input type="file" id="photoFileInput" accept="image/jpeg,image/png,image/gif,image/webp" style="display:none" onchange="sendPhoto(this)"/>
      <button class="send-btn" style="background:var(--bg3);color:var(--text2);font-size:20px" title="Прикрепить фото" onclick="document.getElementById('photoFileInput').click()">📎</button>
      <textarea class="chat-textarea" id="msgInput" placeholder="Напиши сообщение..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">→</button>
    </div>
  </div>
</div>

<!-- New conv modal -->
<div class="modal-overlay" id="newConvModal">
  <div class="modal" style="max-width:480px">
    <div class="modal__header">
      <div class="modal__title">Новый диалог</div>
      <button class="modal__close" onclick="document.getElementById('newConvModal').classList.remove('open')">×</button>
    </div>
    <div id="msgRestrictionNote" style="display:none" class="no-access-note" style="margin:0 0 12px"></div>
    <input class="form-input" id="userPickSearch" placeholder="Поиск по имени..."
      oninput="filterUserPick(this.value)"/>
    <div class="user-pick-list" id="userPickList">
      <div class="sidebar-empty">Загрузка...</div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="api-config.js"></script>
<script>
requireAuth('login.html');

var myUid           = null;
var myData          = null;
var myRole          = null;
var activeId        = null;
var currentOtherUid = null;
var msgUnsub        = null;
var convUnsub       = null;
var allConvs        = [];
var allUsers        = [];
// uid-ы людей которым специалист может писать
var allowedUids     = new Set();

onAuthReady(async function(user, userData) {
  if (!user) return;
  myUid  = user.uid;
  myData = userData;
  myRole = userData ? userData.role : 'user';
  renderNav(userData);

  // Права на новые диалоги по роли
  if (myRole === 'user') {
    // Специалист: другие специалисты + команда
    await computeAllowedUids();
    if (allowedUids.size > 0) {
      document.getElementById('newConvBtn').classList.remove('hidden');
    }
  } else if (myRole === 'expert') {
    // Эксперт: только стартаперы
    await computeExpertAllowedUids();
    if (allowedUids.size > 0) {
      document.getElementById('newConvBtn').classList.remove('hidden');
    }
  } else {
    // Стартапер, админ — могут писать всем (но фильтруем по роли ниже)
    document.getElementById('newConvBtn').classList.remove('hidden');
  }

  var toUid = getUrlParam('to');
  if (toUid && toUid !== myUid) {
    if (canMessageUser(toUid)) {
      try { activeId = await ensureConv(toUid); } catch(e) { console.warn(e.message); }
    } else {
      showToast('Вы не можете написать этому пользователю', 'warn');
    }
  }

  var inviteId = getUrlParam('invite');
  if (inviteId) { try { await handleInviteMsg(inviteId); } catch(e) { console.warn(e.message); } }

  // Открытие конкретного чата по ссылке из уведомления
  var convParam = getUrlParam('conv');
  if (convParam) activeId = convParam;

  startConvListener();
  loadUsersForPicker();
});

// ── ПРАВА НА ПЕРЕПИСКУ ────────────────────────────────
async function computeAllowedUids() {
  // Специалист: другие специалисты + члены команды
  allowedUids = new Set();
  try {
    var usersSnap = await db.collection('users').where('role','==','user').get();
    usersSnap.docs.forEach(function(d) {
      if (d.data().uid && d.data().uid !== myUid) allowedUids.add(d.data().uid);
    });
    var invSnap = await db.collection('invites')
      .where('fromUid','==', myUid)
      .where('status','==','accepted').get();
    for (var i = 0; i < invSnap.docs.length; i++) {
      var inv = invSnap.docs[i].data();
      if (inv.startupOwner) allowedUids.add(inv.startupOwner);
      var teamSnap = await db.collection('startups').doc(inv.startupId).collection('team').get();
      teamSnap.docs.forEach(function(d) {
        if (d.data().uid && d.data().uid !== myUid) allowedUids.add(d.data().uid);
      });
    }
  } catch(e) { console.warn('computeAllowedUids:', e.message); }
}

async function computeExpertAllowedUids() {
  // Эксперт: только стартаперы
  allowedUids = new Set();
  try {
    var snap = await db.collection('users').where('role','==','startup').get();
    snap.docs.forEach(function(d) {
      if (d.data().uid && d.data().uid !== myUid) allowedUids.add(d.data().uid);
    });
  } catch(e) { console.warn('computeExpertAllowedUids:', e.message); }
}

function getUserRole(uid) {
  var u = allUsers.find(function(u){ return u.uid === uid; });
  return u ? u.role : null;
}

function canMessageUser(uid) {
  if (!uid || uid === myUid) return false;
  if (myRole === 'admin') return true;
  if (myRole === 'startup') {
    // Стартапер: пишет специалистам и экспертам
    var role = getUserRole(uid);
    return role === 'user' || role === 'expert';
  }
  if (myRole === 'expert') {
    // Эксперт: пишет только стартаперам
    return allowedUids.has(uid);
  }
  // Специалист: проверяем allowedUids
  return allowedUids.has(uid);
}

// ── CONV LISTENER ─────────────────────────────────────
function startConvListener() {
  if (convUnsub) convUnsub();
  var q = db.collection('conversations')
    .where('participants','array-contains', myUid)
    .orderBy('lastAt','desc');

  convUnsub = q.onSnapshot(function(snap) {
    allConvs = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    filterConvs(document.getElementById('convSearch').value);
    if (activeId) { highlightActive(activeId); }
  }, function() {
    db.collection('conversations').where('participants','array-contains', myUid).get()
      .then(function(snap) {
        allConvs = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        allConvs.sort(function(a,b){
          return ((b.lastAt&&b.lastAt.seconds)||0) - ((a.lastAt&&a.lastAt.seconds)||0);
        });
        filterConvs('');
        if (activeId) openConv(activeId);
      });
  });
}

function filterConvs(q) {
  q = (q||'').toLowerCase();
  var list = q ? allConvs.filter(function(c){ return getOtherName(c).toLowerCase().includes(q); }) : allConvs;
  var el = document.getElementById('convList');
  if (!list.length) {
    el.innerHTML = '<div class="sidebar-empty">'+(q?'Ничего не найдено':'Нет диалогов')+'</div>';
    return;
  }
  el.innerHTML = list.map(function(c) {
    var t = c.lastAt ? shortTime(c.lastAt) : '';
    if (c.isGroup) {
      // Групповой чат стартапа
      var icon = c.startupIcon
        ? '<img src="'+esc(c.startupIcon)+'" class="avatar avatar--sm" style="border-radius:10px" onerror="this.style.display=\'none\'"/>'
        : '<span style="width:32px;height:32px;border-radius:10px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+esc(c.startupEmoji||'🚀')+'</span>';
      return '<div class="conv-item'+(activeId===c.id?' active':'')+'" data-cid="'+c.id+'" onclick="openConvById(this)" style="border-left:2px solid var(--accent-dim)">'+
        icon+
        '<div class="conv-item__info">'+
          '<div class="conv-item__name">'+esc(c.startupName||'Командный чат')+' <span style="font-size:10px;color:var(--text3);font-weight:400">команда</span></div>'+
          '<div class="conv-item__preview">'+esc(c.lastMessage||'...')+'</div>'+
        '</div>'+
        '<div class="conv-item__time">'+t+'</div>'+
      '</div>';
    }
    var other = getOtherUid(c);
    var name  = getOtherName(c);
    var av    = (c.participantAvatars&&c.participantAvatars[other])||
      'https://ui-avatars.com/api/?background=181c24&color=00e676&name='+encodeURIComponent(name);
    return '<div class="conv-item'+(activeId===c.id?' active':'')+'" data-cid="'+c.id+'" onclick="openConvById(this)">'+
      '<img src="'+esc(av)+'" class="avatar avatar--sm"/>'+
      '<div class="conv-item__info">'+
        '<div class="conv-item__name">'+esc(name)+'</div>'+
        '<div class="conv-item__preview">'+esc(c.lastMessage||'...')+'</div>'+
      '</div>'+
      '<div class="conv-item__time">'+t+'</div>'+
    '</div>';
  }).join('');
}

function getOtherUid(c) {
  // Новый бэкенд: participantNames — объект {uid: name}, нет массива participants
  var names = c.participantNames || c.participant_names || {};
  if (typeof names === 'string') { try { names = JSON.parse(names); } catch(e) { names = {}; } }
  return Object.keys(names).find(function(k){ return k !== myUid; }) || '';
}
function getOtherName(c) {
  var o=getOtherUid(c);
  return (c.participantNames&&c.participantNames[o])||'Неизвестно';
}
function shortTime(ts) {
  var d=ts.toDate?ts.toDate():new Date(ts), now=new Date();
  if (d.toDateString()===now.toDateString())
    return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
}

// ── OPEN CONV ─────────────────────────────────────────
var groupPollTimer = null;
var activeGroupStartupId = null;

async function openConv(convId) {
  if (msgUnsub) { msgUnsub(); msgUnsub=null; }
  if (groupPollTimer) { clearInterval(groupPollTimer); groupPollTimer=null; }
  activeId=convId;
  activeGroupStartupId=null;
  highlightActive(convId);

  document.getElementById('emptyState').style.display    = 'none';
  document.getElementById('chatHeader').style.display    = 'flex';
  document.getElementById('chatMessages').style.display  = 'flex';
  document.getElementById('chatInputArea').style.display = 'flex';
  document.getElementById('chatMessages').innerHTML =
    '<div style="text-align:center;padding:32px 0"><div class="spinner" style="width:22px;height:22px;border-width:2px;margin:0 auto"></div></div>';

  var conv = allConvs.find(function(c){ return c.id === convId; });
  if (!conv) {
    var snap = await db.collection('conversations').doc(convId).get();
    if (!snap.exists) return;
    conv = snap.data();
  }

  // ── ГРУППОВОЙ ЧАТ ─────────────────────────────────────
  if (conv.isGroup && conv.startup_id) {
    activeGroupStartupId = conv.startup_id;
    var members = Object.keys(conv.participantNames||{}).length;
    document.getElementById('chatAvatar').src =
      conv.startupIcon || 'https://ui-avatars.com/api/?background=181c24&color=00e676&name='+encodeURIComponent(conv.startupName||'Команда');
    document.getElementById('chatAvatar').style.borderRadius = '10px';
    document.getElementById('chatName').textContent = (conv.startupEmoji||'🚀')+' '+(conv.startupName||'Командный чат');
    document.getElementById('chatSub').innerHTML =
      '<span style="font-size:12px;color:var(--text2)">'+members+' участник'+pluralRu(members)+'</span>';
    var inp=document.getElementById('msgInput');
    if (inp){inp.value='';inp.style.height='auto';inp.focus();}
    await loadGroupMessages(conv.startup_id, convId);
    groupPollTimer = setInterval(function(){ loadGroupMessages(conv.startup_id, convId); }, 5000);
    return;
  }

  // ── ЛИЧНЫЙ ЧАТ ────────────────────────────────────────
  document.getElementById('chatAvatar').style.borderRadius = '50%';
  var other = getOtherUid(conv);
  currentOtherUid = other;
  var name  = (conv.participantNames&&conv.participantNames[other])||'Неизвестно';
  var av    = (conv.participantAvatars&&conv.participantAvatars[other])||
    'https://ui-avatars.com/api/?background=181c24&color=00e676&name='+encodeURIComponent(name);
  var role  = conv.participantRoles&&conv.participantRoles[other]
    ? (ROLE_LABELS[conv.participantRoles[other]]||'') : '';

  document.getElementById('chatAvatar').src = av;
  document.getElementById('chatName').textContent = name;
  document.getElementById('chatSub').innerHTML =
    (role?'<span class="badge badge--gray" style="font-size:11px">'+role+'</span> · ':'')+
    '<a href="member.html?uid='+esc(other)+'" style="color:var(--accent);text-decoration:none;font-size:12px">Профиль →</a>';

  var inp=document.getElementById('msgInput');
  if (inp){inp.value='';inp.style.height='auto';inp.focus();}

  var listenConvId=convId;
  msgUnsub=db.collection('conversations').doc(listenConvId)
    .collection('messages').orderBy('createdAt','asc')
    .onSnapshot(function(snap) {
      if (activeId!==listenConvId) return;
      var el=document.getElementById('chatMessages');
      if (!el) return;
      if (!snap.docs.length) {
        el.innerHTML='<div style="text-align:center;color:var(--text3);font-size:13px;margin-top:40px">Напиши первое сообщение</div>';
        return;
      }
      var html='', lastDate='';
      snap.docs.forEach(function(d) {
        var m=d.data(), mine=m.senderUid===myUid, sys=m.type==='system';
        var ds=m.createdAt?dayStr(m.createdAt):'';
        if (ds&&ds!==lastDate){html+='<div class="chat-date-sep">'+ds+'</div>';lastDate=ds;}
        if (sys) {
          html+='<div class="msg msg--system"><div class="msg__bubble">'+esc(m.text||'').replace(/\n/g,'<br>')+'</div></div>';
        } else if (m.type==='image') {
          html+='<div class="msg '+(mine?'msg--mine':'msg--theirs')+'">'+
            '<div class="msg__bubble" style="padding:4px">'+
              '<img src="'+esc(m.text)+'" style="max-width:260px;max-height:320px;border-radius:8px;display:block;cursor:pointer" onclick="window.open(this.src,\'_blank\')"/>'+
            '</div>'+
            '<div class="msg__time">'+timeStr(m.createdAt)+'</div>'+
          '</div>';
        } else {
          html+='<div class="msg '+(mine?'msg--mine':'msg--theirs')+'">'+
            '<div class="msg__bubble">'+esc(m.text||'').replace(/\n/g,'<br>')+'</div>'+
            '<div class="msg__time">'+timeStr(m.createdAt)+'</div>'+
          '</div>';
        }
      });
      el.innerHTML=html;
      el.scrollTop=el.scrollHeight;
    }, function(err){console.warn('msg listener:',err.message);});
}

function highlightActive(convId) {
  document.querySelectorAll('.conv-item').forEach(function(el){
    el.classList.toggle('active',(el.getAttribute('onclick')||'').includes("'"+convId+"'"));
  });
}
function dayStr(ts) {
  var d=ts.toDate?ts.toDate():new Date(ts),now=new Date(),y=new Date();
  y.setDate(y.getDate()-1);
  if (d.toDateString()===now.toDateString()) return 'Сегодня';
  if (d.toDateString()===y.toDateString()) return 'Вчера';
  return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
}
function timeStr(ts){
  if(!ts) return '';
  var d=ts.toDate?ts.toDate():new Date(ts);
  return d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}

// ── GROUP CHAT MESSAGES ───────────────────────────────
var lastGroupMsgCount = 0;
async function loadGroupMessages(startupId, convId) {
  if (activeId !== convId) return;
  try {
    var res = await api.get('/team-chat/' + startupId + '/messages');
    var msgs = res.messages || [];
    if (msgs.length === lastGroupMsgCount) return;
    lastGroupMsgCount = msgs.length;
    var el = document.getElementById('chatMessages');
    if (!el) return;
    if (!msgs.length) {
      el.innerHTML = '<div style="text-align:center;color:var(--text3);font-size:13px;margin-top:40px">Напиши первое сообщение команде 👋</div>';
      return;
    }
    var html = '', lastDate = '';
    msgs.forEach(function(m) {
      var mine = m.sender_uid === myUid, sys = m.type === 'system';
      var ds = m.created_at ? dayStr({toDate:function(){return new Date(m.created_at);}}) : '';
      if (ds && ds !== lastDate) { html += '<div class="chat-date-sep">'+ds+'</div>'; lastDate = ds; }
      if (sys) {
        html += '<div class="msg msg--system"><div class="msg__bubble">'+esc(m.text||'')+'</div></div>';
      } else {
        var senderName = esc(m.sender_name || '?');
        var av = m.sender_avatar
          ? '<img src="'+esc(m.sender_avatar)+'" class="avatar avatar--sm" style="flex-shrink:0"/>'
          : '<div class="avatar avatar--sm" style="background:var(--bg3);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);flex-shrink:0">'+senderName.charAt(0)+'</div>';
        var roleLbl = m.sender_role ? ' <span style="font-size:10px;color:var(--text3)">('+esc(m.sender_role)+')</span>' : '';
        var bubble = m.type === 'image'
          ? '<div class="msg__bubble" style="padding:4px"><img src="'+esc(m.text)+'" style="max-width:260px;max-height:320px;border-radius:8px;display:block;cursor:pointer" onclick="window.open(this.src,\'_blank\')"/></div>'
          : '<div class="msg__bubble">'+esc(m.text||'').replace(/\n/g,'<br>')+'</div>';
        if (mine) {
          html += '<div class="msg msg--mine">'+bubble+'<div class="msg__time">'+timeStr({toDate:function(){return new Date(m.created_at);}})+'</div></div>';
        } else {
          html += '<div class="msg msg--theirs" style="align-items:flex-start;gap:8px;display:flex">'+
            av+'<div style="display:flex;flex-direction:column;gap:2px">'+
            '<div style="font-size:11px;color:var(--text2)">'+senderName+roleLbl+'</div>'+
            bubble+'<div class="msg__time">'+timeStr({toDate:function(){return new Date(m.created_at);}})+'</div>'+
            '</div></div>';
        }
      }
    });
    el.innerHTML = html;
    el.scrollTop = el.scrollHeight;
  } catch(e) {
    if (e.code === 403 || (e.message && e.message.includes('403'))) {
      // Нет доступа — исключен из стартапа
      if (groupPollTimer) { clearInterval(groupPollTimer); groupPollTimer = null; }
      var el2 = document.getElementById('chatMessages');
      if (el2) el2.innerHTML = '<div style="text-align:center;color:var(--text3);font-size:13px;margin-top:60px;padding:0 24px">Вы больше не участник этого стартапа 🚫<br><br>Доступ к чату закрыт</div>';
      // Прячем поле ввода
      var fi = document.getElementById('footerInput');
      if (fi) fi.style.display = 'none';
      // Убираем этот чат из сайдбара
      var item = document.querySelector('[data-conv="'+convId+'"]');
      if (item) item.closest('.conv-item') && item.closest('.conv-item').remove() || item.remove();
    }
    /* остальные ошибки — тихо, не ломаем интерфейс */
  }
}

// ── SEND ──────────────────────────────────────────────
async function send() {
  if (!activeId||!myUid) return;
  var inp=document.getElementById('msgInput');
  var btn=document.getElementById('sendBtn');
  var text=inp?inp.value.trim():'';
  if (!text) return;
  inp.value=''; inp.style.height='auto'; btn.disabled=true;
  try {
    if (activeGroupStartupId) {
      await api.post('/team-chat/' + activeGroupStartupId + '/messages', { text: text, type: 'user' });
      await loadGroupMessages(activeGroupStartupId, activeId);
    } else {
      await db.collection('conversations').doc(activeId).collection('messages').add({ text: text, type: 'user' });
    }
  } catch(e){showToast('Ошибка: '+e.message,'error');}
  finally{btn.disabled=false;}
}

async function sendPhoto(input) {
  var file = input.files[0];
  input.value = '';
  if (!file) return;
  if (file.size > 2 * 1024 * 1024) { showToast('Файл слишком большой (макс. 2 МБ)', 'error'); return; }
  if (!activeId || !myUid) return;
  showToast('Загружаю фото...', 'info');
  try {
    var base64 = await new Promise(function(resolve, reject) {
      var r = new FileReader();
      r.onload = function(e) { resolve(e.target.result.split(',')[1]); };
      r.onerror = reject;
      r.readAsDataURL(file);
    });
    var res = await api.post('/upload', { data: base64, contentType: file.type, folder: 'chat' });
    if (activeGroupStartupId) {
      await api.post('/team-chat/' + activeGroupStartupId + '/messages', { text: res.url, type: 'image' });
      await loadGroupMessages(activeGroupStartupId, activeId);
    } else {
      await db.collection('conversations').doc(activeId).collection('messages').add({ text: res.url, type: 'image' });
    }
  } catch(e) { showToast('Ошибка: ' + e.message, 'error'); }
}

function pluralRu(n) {
  if (n%10===1&&n%100!==11) return '';
  if (n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)) return 'а';
  return 'ов';
}

// ── ENSURE/CREATE CONV ────────────────────────────────
async function ensureConv(otherUid) {
  // Ищем в кэше уже загруженных диалогов
  for (var i = 0; i < allConvs.length; i++) {
    var names = allConvs[i].participantNames || {};
    if (Object.prototype.hasOwnProperty.call(names, otherUid)) return allConvs[i].id;
  }
  return createConv(otherUid);
}
async function createConv(otherUid) {
  // Бэкенд сам создает диалог и заполняет данные участников
  var data = await api.post('/messages/conversations', { other_uid: otherUid });
  var conv = data.conversation || data;
  // Добавляем в кэш чтобы сразу было доступно
  if (conv && conv.id && !allConvs.find(function(c){ return c.id === conv.id; })) {
    allConvs.unshift(Object.assign({}, conv));
  }
  return conv.id;
}

// ── INVITE → SYSTEM MSG ───────────────────────────────
async function handleInviteMsg(inviteId) {
  var s=await db.collection('invites').doc(inviteId).get();
  if (!s.exists) return;
  var inv=s.data();
  var otherUid=inv.fromUid===myUid?inv.startupOwner:inv.fromUid;
  var convId=await ensureConv(otherUid);
  activeId=convId;
  var txt=inv.status==='accepted'?'✅ Заявка в «'+(inv.startupName||'')+'» принята!'
    :inv.status==='rejected'?'❌ Заявка в «'+(inv.startupName||'')+'» отклонена'
    :'📋 Заявка в «'+(inv.startupName||'')+'»\n'+(inv.message||'');
  await db.collection('conversations').doc(convId).collection('messages').add({
    text: txt, type: 'system'
  });
}

// ── NEW CONV MODAL ────────────────────────────────────
async function loadUsersForPicker() {
  try {
    var snap=await db.collection('users').get();
    allUsers=snap.docs.map(function(d){return d.data();})
      .filter(function(u){return u.uid&&u.uid!==myUid;});
    if (document.getElementById('newConvModal').classList.contains('open')) renderUserPick(allUsers);
  } catch(e){console.warn(e.message);}
}
function openNewConvModal() {
  document.getElementById('userPickSearch').value='';
  document.getElementById('newConvModal').classList.add('open');

  var note=document.getElementById('msgRestrictionNote');
  if (myRole==='user') {
    note.style.display='block';
    note.textContent='Вы можете писать другим специалистам и участникам ваших команд';
  } else if (myRole==='expert') {
    note.style.display='block';
    note.textContent='Эксперты могут писать стартаперам';
  } else if (myRole==='startup') {
    note.style.display='block';
    note.textContent='Вы можете писать специалистам и экспертам';
  } else {
    note.style.display='none';
  }

  allUsers.length?renderUserPick(allUsers):loadUsersForPicker().then(function(){renderUserPick(allUsers);});
}
function filterUserPick(q) {
  q=q.toLowerCase();
  var filtered=q?allUsers.filter(function(u){return(u.name||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q);}):allUsers;
  renderUserPick(filtered);
}
function renderUserPick(users) {
  var el=document.getElementById('userPickList');
  // Фильтруем по правам
  var available=users.filter(function(u){ return canMessageUser(u.uid); });
  if (!available.length){
    el.innerHTML='<div class="sidebar-empty">'+(myRole==='user'?'Нет доступных собеседников.<br>Вступи в команду стартапа.':'Никого не найдено')+'</div>';
    return;
  }
  el.innerHTML=available.map(function(u){
    var av=u.avatar||'https://ui-avatars.com/api/?background=181c24&color=00e676&name='+encodeURIComponent(u.name||'U');
    return '<div class="user-pick-item" data-uid="'+u.uid+'" onclick="startConvByEl(this)">'+
      '<img src="'+esc(av)+'" class="avatar avatar--sm"/>'+
      '<div><div class="user-pick-item__name">'+esc(u.name||'—')+'</div>'+
      '<div class="user-pick-item__role">'+(ROLE_LABELS[u.role]||u.role||'')+'</div></div>'+
    '</div>';
  }).join('');
}
async function startConvWith(otherUid) {
  if (!canMessageUser(otherUid)) { showToast('Нет доступа','warn'); return; }
  document.getElementById('newConvModal').classList.remove('open');
  try {
    var convId=await ensureConv(otherUid);
    activeId=convId;
    filterConvs('');
    setTimeout(function(){openConv(convId);},300);
  } catch(e){showToast('Ошибка: '+e.message,'error');}
}

function openConvById(el) {
  openConv(el.getAttribute('data-cid'));
}
function startConvByEl(el) { startConvWith(el.getAttribute('data-uid')); }
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
