<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Профиль участника — LaunchPad</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .profile-cover{height:180px;background:linear-gradient(135deg,rgba(0,230,118,.15),rgba(180,139,255,.1) 50%,rgba(61,142,245,.1));border-bottom:1px solid var(--border)}
    .profile-main{max-width:860px;margin:0 auto;padding:0 24px}
    .profile-top{display:flex;gap:24px;align-items:flex-end;margin-top:-52px;padding-bottom:28px;border-bottom:1px solid var(--border);position:relative;z-index:1}
    .profile-top img{width:104px;height:104px;border-radius:50%;object-fit:cover;border:4px solid var(--bg);background:var(--bg3)}
    .profile-info{flex:1;padding-bottom:4px}
    .profile-name{font-family:var(--font-head);font-size:28px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
    .profile-body{display:grid;grid-template-columns:1fr 280px;gap:24px;padding:32px 0}
    @media(max-width:768px){.profile-body{grid-template-columns:1fr}.profile-top{flex-direction:column;align-items:center;text-align:center}}
    .contact-link{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px;text-decoration:none;color:inherit;word-break:break-all}
    .contact-link:last-child{border-bottom:none}
    .contact-link:hover{color:var(--accent)}
    .startup-item{display:flex;gap:12px;align-items:center;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;transition:border-color .2s}
    .startup-item--link{text-decoration:none;color:inherit;cursor:pointer}
    .startup-item--link:hover{border-color:var(--accent)}
    .startup-item--muted{opacity:.7;cursor:default}
  </style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav__logo">Launch<span>Pad</span></a>
  <a href="startups.html">Стартапы</a>
  <a href="feed.html">Лента</a>
  <a href="forum.html">Форум</a>
  <a href="members.html">Участники</a>
  <div class="nav__user" id="navUser">
    <a href="login.html" class="btn btn--outline btn--sm">Войти</a>
  </div>
</nav>

<div id="loadingState" style="padding:140px 0;text-align:center">
  <div class="spinner"></div>
  <p style="color:var(--text2);margin-top:14px;font-size:14px">Загрузка профиля...</p>
</div>

<div id="pageContent" style="display:none">
  <div class="profile-cover"></div>
  <div class="profile-main">

    <div class="profile-top">
      <div><img id="memberAvatar" src="https://ui-avatars.com/api/?background=181c24&color=00e676&name=U"/></div>
      <div class="profile-info">
        <h1 class="profile-name" id="memberName"></h1>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <span class="nav__role" id="memberRole"></span>
          <span id="memberSkillCount" style="font-size:13px;color:var(--text2)"></span>
          <span id="memberJoined" style="font-size:13px;color:var(--text2)"></span>
        </div>
      </div>
      <div id="profileActions" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    </div>

    <div class="profile-body">
      <!-- Left -->
      <div>
        <div class="card" style="margin-bottom:20px">
          <h3 style="font-family:var(--font-head);font-size:16px;font-weight:700;margin-bottom:14px">О себе</h3>
          <p id="memberBio" style="color:var(--text2);font-size:14px;line-height:1.8;white-space:pre-wrap"></p>
        </div>
        <div class="card" style="margin-bottom:20px">
          <h3 style="font-family:var(--font-head);font-size:16px;font-weight:700;margin-bottom:14px">Навыки</h3>
          <div id="memberSkills"></div>
        </div>
        <div id="portfolioCard" style="display:none" class="card" style="margin-bottom:20px">
          <h3 style="font-family:var(--font-head);font-size:16px;font-weight:700;margin-bottom:14px">Портфолио</h3>
          <div id="memberPortfolio"></div>
        </div>
        <div id="startupsSection" style="display:none">
          <h3 class="section-title" style="margin-bottom:14px">Проекты</h3>
          <div id="memberStartups"></div>
        </div>
      </div>

      <!-- Right -->
      <div>
        <div class="card" style="margin-bottom:20px">
          <h3 style="font-family:var(--font-head);font-size:16px;font-weight:700;margin-bottom:14px">Контакты</h3>
          <div id="memberContacts"></div>
        </div>
        <div id="teamOfCard" style="display:none" class="card">
          <h3 style="font-family:var(--font-head);font-size:16px;font-weight:700;margin-bottom:14px">Участник в</h3>
          <div id="teamOfList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Invite to startup modal -->
<div class="modal-overlay" id="inviteModal">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title" id="inviteModalTitle">Пригласить в команду</div>
      <button class="modal__close" onclick="document.getElementById('inviteModal').classList.remove('open')">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">Выбери стартап</label>
      <select class="form-select" id="invStartup"></select>
    </div>
    <div class="form-group">
      <label class="form-label">Роль в команде</label>
      <input type="text" class="form-input" id="invRole" placeholder="Разработчик, Дизайнер..."/>
    </div>
    <button class="btn btn--primary" style="width:100%;justify-content:center" onclick="sendInviteFromStartup()">Отправить приглашение</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="api-config.js"></script>
<script>
var profileUid = getUrlParam('uid');
if (!profileUid) window.location.href = 'members.html';

var pageViewer     = null;
var pageViewerData = null;
var profileData    = null;
var toInviteUid    = null;
var toInviteName   = null;

onAuthReady(async function(user, userData) {
  pageViewer     = user;
  pageViewerData = userData;

  // Обновляем nav
  var navUser = document.getElementById('navUser');
  if (user && userData) {
    var av = userData.avatar ||
      'https://ui-avatars.com/api/?background=181c24&color=00e676&name=' + encodeURIComponent(userData.name||'U');
    navUser.innerHTML =
      '<span class="nav__role nav__role--'+userData.role+'">' + (ROLE_LABELS[userData.role]||userData.role) + '</span>' +
      '<img class="nav__avatar" src="'+esc(av)+'" onclick="goProfile()"/>' +
      '<a href="dashboard.html" class="btn btn--ghost btn--sm">Дашборд</a>';
  }

  // Если смотрим свой профиль — редиректим
  if (user && user.uid === profileUid) {
    window.location.href = 'profile.html';
    return;
  }

  // Загружаем профиль
  var snap = await db.collection('users').doc(profileUid).get();
  if (!snap.exists) { window.location.href = 'members.html'; return; }
  profileData = snap.data();

  document.title = (profileData.name || 'Участник') + ' — LaunchPad';

  // Аватар
  var mav = profileData.avatar ||
    'https://ui-avatars.com/api/?background=181c24&color=00e676&name=' + encodeURIComponent(profileData.name||'U');
  document.getElementById('memberAvatar').src = mav;

  // Имя
  document.getElementById('memberName').textContent = profileData.name || 'Без имени';

  // Роль
  var roleEl = document.getElementById('memberRole');
  roleEl.textContent = ROLE_LABELS[profileData.role] || profileData.role || '';
  roleEl.className   = 'nav__role nav__role--' + (profileData.role||'user');

  // Навыки счётчик
  var skills = safeArray(profileData.skills);
  document.getElementById('memberSkillCount').textContent = skills.length ? skills.length + ' навыков' : '';

  // Дата
  if (profileData.createdAt) {
    document.getElementById('memberJoined').textContent = 'С ' + formatDate(profileData.createdAt);
  }

  // О себе
  document.getElementById('memberBio').textContent = profileData.bio || 'Пользователь пока ничего не написал.';

  // Навыки
  document.getElementById('memberSkills').innerHTML = skills.length
    ? skills.map(function(s) { return '<span class="badge badge--gray">' + esc(s) + '</span>'; }).join(' ')
    : '<span style="color:var(--text3);font-size:14px">Не указаны</span>';

  // Портфолио
  if (profileData.portfolio) {
    document.getElementById('portfolioCard').style.display = 'block';
    var links = profileData.portfolio.split('\n').map(function(l){return l.trim();}).filter(Boolean);
    document.getElementById('memberPortfolio').innerHTML = links.map(function(l) {
      if (l.startsWith('http')) {
        return '<a class="contact-link" href="' + esc(l) + '" target="_blank">🔗 ' + esc(l) + '</a>';
      }
      return '<div class="contact-link">• ' + esc(l) + '</div>';
    }).join('');
  }

  // Контакты
  if (profileData.contacts) {
    document.getElementById('memberContacts').innerHTML =
      '<p style="font-size:14px;color:var(--text2);white-space:pre-wrap;line-height:1.7">' + esc(profileData.contacts) + '</p>';
  } else {
    document.getElementById('memberContacts').innerHTML =
      '<span style="color:var(--text3);font-size:14px">Не указаны</span>';
  }

  // Проверяем уже отправлено ли приглашение
  var alreadyInvited = false;
  if (user && userData && userData.role === 'startup') {
    try {
      var myStartupsCheck = await db.collection('startups').where('ownerUid','==',user.uid).get();
      for (var si = 0; si < myStartupsCheck.docs.length; si++) {
        var sid = myStartupsCheck.docs[si].id;
        var invCheck = await db.collection('invites')
          .where('toUid','==', profileUid)
          .where('startupId','==', sid).get();
        if (!invCheck.empty) { alreadyInvited = true; break; }
      }
    } catch(e) {}
  }
  // Кнопки действий
  renderActions(user, userData, alreadyInvited);

  // Стартапы (если role=startup)
  if (profileData.role === 'startup') {
    await loadMemberStartups(user, userData);
  }

  // Команды через collectionGroup
  await loadTeamOf();

  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('pageContent').style.display  = 'block';
});

function renderActions(user, userData, alreadyInvited) {
  var el = document.getElementById('profileActions');
  if (!user) {
    el.innerHTML = '<a href="login.html" class="btn btn--outline btn--sm">Войти</a>';
    return;
  }
  var btns = '';
  // Написать сообщение
  btns += '<button class="btn btn--outline btn--sm" data-href="messages.html?to=' + profileUid + '" onclick="window.location.href=this.getAttribute(\"data-href\")">💬 Написать</button>';
  // Пригласить в команду (только стартаперы, и только если ещё не приглашён)
  if (userData && userData.role === 'startup') {
    if (alreadyInvited) {
      btns += '<span class="badge badge--gray" style="padding:7px 14px;font-size:13px">✓ Уже приглашён</span>';
    } else {
      btns += '<button class="btn btn--primary btn--sm" onclick="openInviteModal()">+ Пригласить</button>';
    }
  }
  el.innerHTML = btns;
}

async function loadMemberStartups(user, userData) {
  try {
    var sSnap = await db.collection('startups').where('ownerUid','==',profileUid).get();
    if (sSnap.empty) return;

    var viewerIsAdmin = userData && userData.role === 'admin';
    var items = '';

    sSnap.docs.forEach(function(d) {
      var s = d.data();
      // Фильтрация по приватности
      if (!viewerIsAdmin) {
        // closed — не показываем
        if (s.privacy === 'closed') return;
      }

      var isClickable = viewerIsAdmin || (!s.privacy || s.privacy === 'public');
      var logo = s.iconImage
        ? '<img src="' + esc(s.iconImage) + '" style="width:36px;height:36px;border-radius:8px;object-fit:cover" onerror="this.style.display=&quot;none&quot;"/>'
        : '<span style="font-size:26px">' + esc(s.emoji||'🚀') + '</span>';
      var privBadge = s.privacy === 'private'
        ? ' <span class="badge badge--gray" style="font-size:10px">🔒</span>'
        : s.privacy === 'closed'
        ? ' <span class="badge badge--gray" style="font-size:10px">🔐</span>'
        : '';
      var inner =
        logo +
        '<div style="flex:1">' +
          '<div style="font-family:var(--font-head);font-size:15px;font-weight:700">' + esc(s.name||'') + privBadge + '</div>' +
          '<div style="font-size:12px;color:var(--text2)">' + esc(s.tagline||'') + '</div>' +
        '</div>' +
        '<span class="badge badge--green">' + esc(s.stage||'Идея') + '</span>';

      if (isClickable) {
        items += '<a class="startup-item startup-item--link" href="startup.html?id=' + d.id + '">' + inner + '</a>';
      } else {
        items += '<div class="startup-item startup-item--muted">' + inner + '</div>';
      }
    });

    if (items) {
      document.getElementById('startupsSection').style.display = 'block';
      document.getElementById('memberStartups').innerHTML = items;
    }
  } catch(e) { console.warn('loadMemberStartups:', e.message); }
}

async function loadTeamOf() {
  try {
    var items = '';
    var shownStartups = {};

    // Через accepted invites
    var invData = await api.get('/invites?from_uid=' + profileUid + '&status=accepted');
    var invites = invData.invites || [];

    for (var j = 0; j < invites.length; j++) {
      var inv = invites[j];
      var sid = inv.startupId || inv.startup_id;
      if (!sid || shownStartups[sid]) continue;
      shownStartups[sid] = true;

      var invRole = inv.role || 'Участник';
      if (invRole === 'Специалист') invRole = 'Участник';

      try {
        var sSnap = await db.collection('startups').doc(sid).get();
        if (sSnap.exists) {
          var s = sSnap.data();
          var logo = s.iconImage
            ? '<img src="'+esc(s.iconImage)+'" style="width:28px;height:28px;border-radius:6px;object-fit:cover"/>'
            : '<span style="font-size:20px">'+(s.emoji||'🚀')+'</span>';
          items += '<a href="startup.html?id='+esc(sid)+'" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-bottom:10px">'+
            logo+
            '<div><div style="font-size:14px;font-weight:500">'+esc(s.name||'')+'</div>'+
            '<div style="font-size:12px;color:var(--accent);font-weight:500">'+esc(invRole)+'</div></div>'+
          '</a>';
        }
      } catch(e2) {}
    }

    if (items) {
      document.getElementById('teamOfCard').style.display = 'block';
      document.getElementById('teamOfList').innerHTML = items;
    }
  } catch(e) {
    console.log('loadTeamOf error:', e.message);
  }
}

// ── INVITE ────────────────────────────────────────────
async function openInviteModal() {
  if (!pageViewer) return;
  toInviteUid  = profileUid;
  toInviteName = profileData ? profileData.name : '';
  document.getElementById('inviteModalTitle').textContent = 'Пригласить ' + toInviteName;

  var myStartups = await db.collection('startups').where('ownerUid','==',pageViewer.uid).get();
  if (myStartups.empty) { showToast('У тебя нет стартапов','warn'); return; }

  // Находим стартапы куда человек уже приглашён (любой статус кроме rejected/removed)
  var existingInvites = await db.collection('invites')
    .where('toUid','==',profileUid).get();
  var alreadyIn = {};
  existingInvites.docs.forEach(function(d) {
    var st = d.data().status;
    if (st !== 'rejected' && st !== 'removed') alreadyIn[d.data().startupId] = st;
  });
  // Также проверяем заявки ОТ пользователя (он сам подавал)
  var selfInvites = await db.collection('invites')
    .where('fromUid','==',profileUid).get();
  selfInvites.docs.forEach(function(d) {
    var st = d.data().status;
    if (st === 'accepted') alreadyIn[d.data().startupId] = st;
  });

  var opts = myStartups.docs.map(function(d) {
    var sid = d.id; var sname = d.data().name||'';
    var status = alreadyIn[sid];
    var label = sname;
    if (status === 'accepted') label += ' ✅ (уже в команде)';
    else if (status === 'pending') label += ' ⏳ (заявка отправлена)';
    return '<option value="'+esc(sid)+'"'+(status==='accepted'?' disabled':'')+'>'+esc(label)+'</option>';
  }).join('');

  document.getElementById('invStartup').innerHTML = opts;
  document.getElementById('invRole').value = '';
  document.getElementById('inviteModal').classList.add('open');
}

async function sendInviteFromStartup() {
  var startupId = document.getElementById('invStartup').value;
  var role      = document.getElementById('invRole').value.trim() || 'Участник';
  if (!startupId || !toInviteUid) return;

  try {
    var sSnap = await db.collection('startups').doc(startupId).get();
    if (!sSnap.exists) { showToast('Стартап не найден', 'error'); return; }

    // Используем snake_case — именно это ждёт бэкенд
    await api.post('/invites', {
      type:          'from_startup',
      to_uid:        toInviteUid,
      startup_id:    startupId,
      startup_name:  sSnap.data().name || sSnap.data().Name || '',
      startup_owner: pageViewer.uid,
      role:          role,
      message:       'Приглашение в команду'
    });

    document.getElementById('inviteModal').classList.remove('open');
    showToast('✅ Приглашение отправлено!', 'success');
  } catch(e) {
    showToast('Ошибка: ' + e.message, 'error');
  }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
