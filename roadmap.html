<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Дорожная карта — LaunchPad</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .roadmap-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:32px 0}
    .roadmap-header__inner{display:flex;align-items:center;gap:20px}
    .startup-emoji{font-size:44px}
    .rm-title{font-family:var(--font-head);font-size:26px;font-weight:800;letter-spacing:-.5px}
    .rm-sub{font-size:14px;color:var(--text2);margin-top:4px}

    /* колонки */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px}
    @media(max-width:900px){.board{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:500px){.board{grid-template-columns:1fr}}

    .col{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;min-height:200px}
    .col__head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
    .col__title{font-family:var(--font-head);font-size:14px;font-weight:700}
    .col__count{font-size:12px;color:var(--text3);margin-left:auto;background:var(--bg3);border-radius:10px;padding:1px 8px}
    .col__body{padding:10px;flex:1;display:flex;flex-direction:column;gap:8px}
    .col__add{margin:8px 10px 10px;border:1px dashed var(--border2);border-radius:var(--radius);padding:8px;text-align:center;font-size:12px;color:var(--text3);cursor:pointer;transition:all .2s;display:none}
    .col__add:hover{border-color:var(--accent);color:var(--accent)}
    .col__add.visible{display:block}

    /* карточки задач */
    .task-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px;transition:border-color .2s;position:relative}
    .task-card:hover{border-color:var(--border2)}
    .task-card__title{font-size:13px;font-weight:600;margin-bottom:4px;line-height:1.4}
    .task-card__desc{font-size:12px;color:var(--text2);line-height:1.5}
    .task-card__meta{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap}
    .task-card__actions{display:none;position:absolute;top:8px;right:8px;gap:4px}
    .task-card:hover .task-card__actions{display:flex}
    .task-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text2);font-size:11px;cursor:pointer;padding:2px 6px;line-height:1.6;transition:all .15s}
    .task-btn:hover{color:var(--text);border-color:var(--text3)}
    .task-btn--danger:hover{color:var(--danger);border-color:var(--danger)}

    /* приоритеты */
    .priority-high{border-left:3px solid var(--danger)}
    .priority-med{border-left:3px solid var(--warn)}
    .priority-low{border-left:3px solid var(--info)}

    /* статус колонок */
    .col--backlog .col__head{border-top:3px solid var(--text3);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
    .col--todo    .col__head{border-top:3px solid var(--info)}
    .col--doing   .col__head{border-top:3px solid var(--warn)}
    .col--done    .col__head{border-top:3px solid var(--accent)}

    /* форма задачи */
    .task-form{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:12px;margin-bottom:4px}
    .task-form input,.task-form textarea,.task-form select{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-family:var(--font-body);font-size:13px;padding:7px 10px;outline:none;margin-bottom:8px;transition:border-color .2s}
    .task-form input:focus,.task-form textarea:focus,.task-form select:focus{border-color:var(--accent)}
    .task-form textarea{min-height:60px;resize:vertical}
    .task-form__btns{display:flex;gap:6px}
    .tf-btn{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .2s}
    .tf-btn--save{background:var(--accent);color:#000}
    .tf-btn--save:hover{background:var(--accent2)}
    .tf-btn--cancel{background:var(--bg2);border:1px solid var(--border2);color:var(--text2)}
    .tf-btn--cancel:hover{color:var(--text)}

    .empty-col{padding:20px 10px;text-align:center;font-size:12px;color:var(--text3)}

    /* статистика */
    .rm-stats{display:flex;gap:16px;flex-wrap:wrap;margin-top:24px;margin-bottom:4px}
    .rm-stat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 20px;text-align:center}
    .rm-stat__num{font-family:var(--font-head);font-size:24px;font-weight:700}
    .rm-stat__lbl{font-size:11px;color:var(--text3);margin-top:2px}

    /* прогресс бар */
    .progress-bar{height:6px;background:var(--bg3);border-radius:3px;margin-top:20px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .5s ease}
  </style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav__logo">Launch<span>Pad</span></a>
  <div class="nav__user">
    <a id="backToStartup" href="startups.html" class="btn btn--ghost btn--sm">← К стартапу</a>
    <span class="nav__role" id="navRole"></span>
    <img class="nav__avatar" id="navAvatar"
      src="https://ui-avatars.com/api/?background=181c24&color=00e676&name=U"
      onclick="window.location.href='profile.html'"/>
    <button class="btn btn--ghost btn--sm" onclick="auth.signOut().then(function(){window.location.href='index.html'})">Выйти</button>
  </div>
</nav>

<div id="loadingState" style="padding:160px 0;text-align:center">
  <div class="spinner"></div>
  <p style="color:var(--text2);margin-top:14px;font-size:14px">Загрузка дорожной карты...</p>
</div>

<div id="pageContent" style="display:none">
  <div class="roadmap-header">
    <div class="container">
      <div class="roadmap-header__inner">
        <div class="startup-emoji" id="rmEmoji">🚀</div>
        <div>
          <div class="rm-title" id="rmTitle">Дорожная карта</div>
          <div class="rm-sub" id="rmSub"></div>
        </div>
      </div>

      <div class="rm-stats">
        <div class="rm-stat"><div class="rm-stat__num" id="statTotal">0</div><div class="rm-stat__lbl">Всего задач</div></div>
        <div class="rm-stat"><div class="rm-stat__num" id="statDone">0</div><div class="rm-stat__lbl">Выполнено</div></div>
        <div class="rm-stat"><div class="rm-stat__num" id="statDoing">0</div><div class="rm-stat__lbl">В работе</div></div>
        <div class="rm-stat"><div class="rm-stat__num" id="statTodo">0</div><div class="rm-stat__lbl">Запланировано</div></div>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
    </div>
  </div>

  <div class="page" style="padding-top:20px">
    <div class="container">
      <div class="board">
        <!-- Backlog -->
        <div class="col col--backlog">
          <div class="col__head">
            <span>📋</span>
            <span class="col__title">Backlog</span>
            <span class="col__count" id="cnt-backlog">0</span>
          </div>
          <div class="col__body" id="col-backlog"></div>
          <div class="col__add" id="add-backlog" onclick="showForm('backlog')">+ Добавить задачу</div>
        </div>
        <!-- Todo -->
        <div class="col col--todo">
          <div class="col__head">
            <span>📌</span>
            <span class="col__title">To Do</span>
            <span class="col__count" id="cnt-todo">0</span>
          </div>
          <div class="col__body" id="col-todo"></div>
          <div class="col__add" id="add-todo" onclick="showForm('todo')">+ Добавить задачу</div>
        </div>
        <!-- In Progress -->
        <div class="col col--doing">
          <div class="col__head">
            <span>⚡</span>
            <span class="col__title">In Progress</span>
            <span class="col__count" id="cnt-doing">0</span>
          </div>
          <div class="col__body" id="col-doing"></div>
          <div class="col__add" id="add-doing" onclick="showForm('doing')">+ Добавить задачу</div>
        </div>
        <!-- Done -->
        <div class="col col--done">
          <div class="col__head">
            <span>✅</span>
            <span class="col__title">Done</span>
            <span class="col__count" id="cnt-done">0</span>
          </div>
          <div class="col__body" id="col-done"></div>
          <div class="col__add" id="add-done" onclick="showForm('done')">+ Добавить задачу</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
requireAuth('login.html');

var startupId   = getUrlParam('id');
var startupData = null;
var pageUser    = null;
var pageUserData= null;
var isOwner     = false;
var allTasks    = [];

if (!startupId) window.location.href = 'startups.html';

var COLS = {
  backlog: { label:'Backlog', icon:'📋' },
  todo:    { label:'To Do',   icon:'📌' },
  doing:   { label:'In Progress', icon:'⚡' },
  done:    { label:'Done',    icon:'✅' }
};

var PRIORITY = {
  high: { label:'Высокий', class:'priority-high', badge:'badge--red' },
  med:  { label:'Средний', class:'priority-med',  badge:'badge--warn' },
  low:  { label:'Низкий',  class:'priority-low',  badge:'badge--blue' }
};

onAuthReady(async function(user, userData) {
  if (!user) return;
  pageUser     = user;
  pageUserData = userData;
  renderNav(userData);

  try {
    var snap = await db.collection('startups').doc(startupId).get();
    if (!snap.exists) { window.location.href = 'startups.html'; return; }
    startupData = Object.assign({id:snap.id}, snap.data());

    isOwner = user.uid === startupData.ownerUid || (userData && userData.role === 'admin');

    document.getElementById('rmEmoji').textContent = startupData.emoji || '🚀';
    document.getElementById('rmTitle').textContent = startupData.name + ' — Дорожная карта';
    document.getElementById('rmSub').textContent   = startupData.tagline || '';
    document.getElementById('backToStartup').href  = 'startup.html?id=' + startupId;
    document.title = startupData.name + ' — Roadmap';

    // Показываем кнопки добавления только владельцу
    if (isOwner) {
      document.querySelectorAll('.col__add').forEach(function(el){ el.classList.add('visible'); });
    }

    // Слушаем задачи
    db.collection('startups').doc(startupId).collection('tasks')
      .orderBy('createdAt','asc')
      .onSnapshot(function(snap) {
        allTasks = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
        renderBoard();
      }, function() {
        // без индекса
        db.collection('startups').doc(startupId).collection('tasks').get()
          .then(function(snap){
            allTasks = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
            renderBoard();
          });
      });

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('pageContent').style.display  = 'block';
  } catch(e) {
    document.getElementById('loadingState').innerHTML =
      '<div class="empty-state"><div class="empty-state__icon">⚠️</div>'+
      '<div class="empty-state__title">Ошибка загрузки</div>'+
      '<p style="font-size:14px">'+esc(e.message)+'</p></div>';
  }
});

// ── RENDER BOARD ──────────────────────────────────────
function renderBoard() {
  var byCol = { backlog:[], todo:[], doing:[], done:[] };
  allTasks.forEach(function(t){
    if (byCol[t.status]) byCol[t.status].push(t);
  });

  Object.keys(byCol).forEach(function(col) {
    var el  = document.getElementById('col-'+col);
    var cnt = document.getElementById('cnt-'+col);
    var tasks = byCol[col];
    cnt.textContent = tasks.length;
    if (!tasks.length) {
      el.innerHTML = '<div class="empty-col">Нет задач</div>';
      return;
    }
    el.innerHTML = tasks.map(function(t) {
      var pr  = PRIORITY[t.priority] || PRIORITY.med;
      var prLabel = pr ? '<span class="badge '+pr.badge+'" style="font-size:11px">'+pr.label+'</span>' : '';
      return '<div class="task-card '+pr.class+'" id="task-'+t.id+'">'+
        (isOwner ? '<div class="task-card__actions">'+
          '<select class="task-btn" onchange="moveTask(\''+t.id+'\',this.value)" title="Переместить">'+
            Object.keys(COLS).map(function(c){
              return '<option value="'+c+'"'+(c===t.status?' selected':'')+'>'+COLS[c].icon+' '+COLS[c].label+'</option>';
            }).join('')+
          '</select>'+
          '<button class="task-btn task-btn--danger" onclick="deleteTask(\''+t.id+'\')" title="Удалить">✕</button>'+
        '</div>' : '')+
        '<div class="task-card__title">'+esc(t.title||'')+'</div>'+
        (t.description?'<div class="task-card__desc">'+esc(t.description)+'</div>':'')+
        '<div class="task-card__meta">'+
          prLabel+
          (t.assignee?'<span class="badge badge--gray" style="font-size:11px">👤 '+esc(t.assignee)+'</span>':'')+
        '</div>'+
      '</div>';
    }).join('');
  });

  // Статистика
  var total = allTasks.length;
  var done  = byCol.done.length;
  var doing = byCol.doing.length;
  var todo  = byCol.todo.length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent  = done;
  document.getElementById('statDoing').textContent = doing;
  document.getElementById('statTodo').textContent  = todo;
  document.getElementById('progressFill').style.width = total ? Math.round(done/total*100)+'%' : '0%';
}

// ── TASK FORM ─────────────────────────────────────────
var formCol = null;

function showForm(col) {
  // Убираем предыдущую форму если есть
  var prev = document.getElementById('active-task-form');
  if (prev) prev.remove();
  if (formCol === col) { formCol = null; return; }
  formCol = col;

  var form = document.createElement('div');
  form.className = 'task-form';
  form.id        = 'active-task-form';
  form.innerHTML =
    '<input id="tf-title" placeholder="Название задачи *" maxlength="120"/>'+
    '<textarea id="tf-desc" placeholder="Описание (необязательно)"></textarea>'+
    '<select id="tf-priority">'+
      '<option value="med">Приоритет: Средний</option>'+
      '<option value="high">Приоритет: Высокий</option>'+
      '<option value="low">Приоритет: Низкий</option>'+
    '</select>'+
    '<input id="tf-assignee" placeholder="Ответственный (необязательно)" maxlength="60"/>'+
    '<div class="task-form__btns">'+
      '<button class="tf-btn tf-btn--save" onclick="saveTask()">Добавить</button>'+
      '<button class="tf-btn tf-btn--cancel" onclick="cancelForm()">Отмена</button>'+
    '</div>';

  var colBody = document.getElementById('col-'+col);
  colBody.insertBefore(form, colBody.firstChild);
  document.getElementById('tf-title').focus();
}

function cancelForm() {
  var f = document.getElementById('active-task-form');
  if (f) f.remove();
  formCol = null;
}

async function saveTask() {
  if (!isOwner) return;
  var title = (document.getElementById('tf-title').value||'').trim();
  if (!title) { showToast('Введи название задачи','error'); return; }
  var data = {
    title,
    description: (document.getElementById('tf-desc').value||'').trim(),
    priority:    document.getElementById('tf-priority').value,
    assignee:    (document.getElementById('tf-assignee').value||'').trim(),
    status:      formCol,
    createdAt:   firebase.firestore.FieldValue.serverTimestamp(),
    updatedAt:   firebase.firestore.FieldValue.serverTimestamp()
  };
  try {
    await db.collection('startups').doc(startupId).collection('tasks').add(data);
    cancelForm();
    showToast('Задача добавлена!','success');
  } catch(e) { showToast('Ошибка: '+e.message,'error'); }
}

async function moveTask(taskId, newStatus) {
  if (!isOwner) return;
  try {
    await db.collection('startups').doc(startupId).collection('tasks').doc(taskId).update({
      status: newStatus,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) { showToast('Ошибка: '+e.message,'error'); }
}

async function deleteTask(taskId) {
  if (!isOwner) return;
  if (!confirm('Удалить задачу?')) return;
  try {
    await db.collection('startups').doc(startupId).collection('tasks').doc(taskId).delete();
    showToast('Задача удалена','success');
  } catch(e) { showToast('Ошибка: '+e.message,'error'); }
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
</body>
</html>
