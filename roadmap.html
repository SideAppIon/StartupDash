<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Дорожная карта — Атриум</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="stylesheet" href="styles.css?v=8"/>
  <style>
    .roadmap-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:calc(var(--nav-h) + 32px) 0 28px}
    .rm-title{font-family:var(--font-head);font-size:24px;font-weight:800;letter-spacing:-.5px}
    .rm-sub{font-size:14px;color:var(--text2);margin-top:4px}
    .rm-stats{display:flex;gap:14px;flex-wrap:wrap;margin-top:20px}
    .rm-stat{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 18px;text-align:center}
    .rm-stat__num{font-family:var(--font-head);font-size:22px;font-weight:700}
    .rm-stat__lbl{font-size:11px;color:var(--text3);margin-top:2px}
    .progress-bar{height:5px;background:var(--bg3);border-radius:3px;margin-top:16px;overflow:hidden}
    .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .5s}
    /* Board */
    .board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:24px}
    @media(max-width:900px){.board{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:500px){.board{grid-template-columns:1fr}}
    .col{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column}
    .col__head{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
    .col--backlog .col__head{border-top:3px solid var(--text3);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
    .col--todo    .col__head{border-top:3px solid var(--info)}
    .col--doing   .col__head{border-top:3px solid var(--warn)}
    .col--done    .col__head{border-top:3px solid var(--accent)}
    .col--archive .col__head{border-top:3px solid var(--text3);opacity:.7}
    .deadline-badge{font-size:11px;padding:2px 8px;border-radius:12px}
    .deadline-ok   {background:rgba(0,230,118,.1);color:var(--accent)}
    .deadline-soon {background:rgba(255,165,0,.15);color:var(--warn)}
    .deadline-over {background:rgba(255,71,87,.15);color:var(--danger)}
    .archive-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--text2);padding:10px 0;border-top:1px solid var(--border);margin-top:8px;user-select:none}
    .archive-toggle:hover{color:var(--text)}
    .col__title{font-family:var(--font-head);font-size:13px;font-weight:700;flex:1}
    .col__count{font-size:12px;color:var(--text3);background:var(--bg3);border-radius:10px;padding:1px 7px}
    .col__toggle{font-size:12px;color:var(--text3);transition:transform .2s}
    .col__body{padding:8px;display:flex;flex-direction:column;gap:7px}
    .col__body.collapsed{display:none}
    /* Перетаскивание задач между колонками */
    .task-card[draggable="true"]{cursor:grab}
    .task-card[draggable="true"]:active{cursor:grabbing}
    .task-card.dragging{opacity:.4}
    .col.drop-target{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-dim)}
    .col__add{margin:0 8px 8px;border:1px dashed var(--border2);border-radius:var(--radius);padding:7px;text-align:center;font-size:12px;color:var(--text3);cursor:pointer;transition:all .2s;display:none}
    .col__add:hover{border-color:var(--accent);color:var(--accent)}
    .col__add.visible{display:block}
    /* Предложенные задачи (эксперты и менторы) */
    .sug-panel{background:var(--bg2);border:1px solid var(--border);border-top:3px solid var(--expert);border-radius:var(--radius-lg);padding:14px 16px;margin-top:4px}
    .sug-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .sug-title{font-weight:700;font-size:15px}
    .sug-hint{font-size:12px;color:var(--text3);margin:4px 0 0}
    .sug-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-top:12px}
    .sug-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
    .sug-card__by{font-size:11px;color:var(--text3)}
    .sug-card__actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
    /* Task card */
    .task-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;position:relative;transition:border-color .2s}
    .task-card:hover{border-color:var(--border2)}
    .task-card.private-task{border-left:3px solid var(--text3);opacity:.85}
    /* Задача в Done — зелёная */
    .task-card--done{background:var(--accent-dim);border-color:var(--accent)}
    .task-card--done .task-card__title{color:var(--accent)}
    .task-card__title{font-size:13px;font-weight:600;margin-bottom:4px;line-height:1.4;padding-right:52px}
    .task-card__desc{font-size:12px;color:var(--text2);line-height:1.5;margin-bottom:6px}
    .task-card__meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .task-card__assignee{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px}
    .task-card__actions{position:absolute;top:8px;right:8px;display:none;gap:3px}
    .task-card:hover .task-card__actions{display:flex}
    .task-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:5px;color:var(--text2);font-size:11px;cursor:pointer;padding:2px 6px;line-height:1.6;transition:all .15s}
    .task-btn:hover{color:var(--text);border-color:var(--text3)}
    .task-btn--danger:hover{color:var(--danger);border-color:var(--danger)}
    /* Priority */
    .priority-high{border-left:3px solid var(--danger)}
    .priority-med {border-left:3px solid var(--warn)}
    .priority-low {border-left:3px solid var(--info)}
    /* Task form */
    .task-form{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:10px;margin-bottom:4px}
    .task-form input,.task-form textarea,.task-form select{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-family:var(--font-body);font-size:12px;padding:6px 9px;outline:none;margin-bottom:7px;transition:border-color .2s}
    .task-form input:focus,.task-form textarea:focus,.task-form select:focus{border-color:var(--accent)}
    .task-form textarea{min-height:54px;resize:vertical}
    .task-form__btns{display:flex;gap:6px}
    .tf-btn{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;transition:all .2s}
    .tf-btn--save{background:var(--accent);color:#000}.tf-btn--save:hover{background:var(--accent2)}
    .tf-btn--cancel{background:var(--bg2);border:1px solid var(--border2);color:var(--text2)}.tf-btn--cancel:hover{color:var(--text)}
    .tf-check{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);margin-bottom:7px;cursor:pointer}
    .tf-check input{width:14px;height:14px;accent-color:var(--accent);margin:0}
    .empty-col{padding:16px 10px;text-align:center;font-size:12px;color:var(--text3)}
    /* Done collapsed */
    .done-compact{padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
    .done-compact:last-child{border-bottom:none}
    .done-compact__title{font-size:12px;color:var(--text2);flex:1;text-decoration:line-through}
    /* My invites collapsible */
    .collapsible-header{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:12px 0;user-select:none}
    .collapsible-header:hover .section-title{color:var(--accent)}
    .collapsible-body{overflow:hidden;transition:max-height .3s}
    /* Комментарии задачи (правят все) */
    .task-cmt{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border2)}
    .task-cmt__text{font-size:12px;color:var(--text2);line-height:1.5;white-space:pre-wrap;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 9px;margin-bottom:6px}
    .task-cmt__btn{font-size:11px;color:var(--text3);background:none;border:none;cursor:pointer;padding:2px 0}
    .task-cmt__btn:hover{color:var(--accent)}
    .task-cmt__input{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:12px;padding:7px 9px;outline:none;resize:vertical;min-height:52px;font-family:inherit}
    .task-cmt__input:focus{border-color:var(--accent)}
  </style>
</head>
<body>
<nav class="nav">
  <a href="dashboard.html" class="nav__logo"><img src="assets/atrium-logo.png" alt="Атриум"/></a>
  <a href="startups.html">Стартапы</a>
  <a href="feed.html">Лента</a>
  <a href="forum.html">Форум</a>
  <a href="ideas.html">Идеи</a>
  <a href="members.html">Участники</a>
  <div class="nav__user">
    <a id="backBtn" href="startups.html" class="btn btn--ghost btn--sm">← К стартапу</a>
    <a href="messages.html" class="btn btn--ghost btn--sm">💬 Сообщения</a>
    <span class="nav__role" id="navRole"></span>
    <img class="nav__avatar" id="navAvatar" src="https://ui-avatars.com/api/?background=181c24&color=00e676&name=U" onclick="goProfile()"/>
    <button class="btn btn--ghost btn--sm" onclick="auth.signOut().then(function(){window.location.href='index.html'})">Выйти</button>
  </div>
</nav>

<div id="loadingState" style="padding:160px 0;text-align:center">
  <div class="spinner"></div>
  <p style="color:var(--text2);margin-top:14px;font-size:14px">Загрузка...</p>
</div>

<div id="pageContent" style="display:none">
  <div class="roadmap-header">
    <div class="container">
      <div style="display:flex;align-items:flex-start;gap:16px">
        <div style="font-size:44px" id="rmEmoji">🚀</div>
        <div style="flex:1">
          <div class="rm-title" id="rmTitle">Дорожная карта</div>
          <div class="rm-sub" id="rmSub"></div>
          <div class="rm-stats">
            <div class="rm-stat"><div class="rm-stat__num" id="statTotal">0</div><div class="rm-stat__lbl">Всего</div></div>
            <div class="rm-stat"><div class="rm-stat__num" id="statDone">0</div><div class="rm-stat__lbl">Готово</div></div>
            <div class="rm-stat"><div class="rm-stat__num" id="statDoing">0</div><div class="rm-stat__lbl">В работе</div></div>
            <div class="rm-stat"><div class="rm-stat__num" id="statTodo">0</div><div class="rm-stat__lbl">Запланировано</div></div>
          </div>
          <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="page" style="padding-top:20px">
    <div class="container">
      <div style="display:flex;justify-content:flex-end;margin-bottom:14px">
        <button class="btn btn--outline btn--sm" onclick="shareRoadmap()">🔗 Поделиться</button>
      </div>
      <!-- Предложенные задачи: эксперты и менторы предлагают, команда принимает в Backlog или отклоняет -->
      <div class="sug-panel" id="sugPanel" style="display:none">
        <div class="sug-head">
          <span class="sug-title">💡 Предложенные задачи <span class="col__count" id="sugCount">0</span></span>
          <button class="btn btn--expert btn--sm" id="sugAddBtn" style="display:none;margin-left:auto" onclick="openSuggestForm()">+ Предложить задачу</button>
        </div>
        <p class="sug-hint" id="sugHint"></p>
        <div id="sugFormSlot"></div>
        <div class="sug-list" id="sugList"></div>
      </div>
      <div class="board">
        <div class="col col--backlog" id="colWrap-backlog">
          <div class="col__head" onclick="toggleCol('backlog')">
            <span>📋</span><span class="col__title">Backlog</span>
            <span class="col__count" id="cnt-backlog">0</span>
            <span class="col__toggle" id="toggle-backlog">▾</span>
          </div>
          <div class="col__body" id="col-backlog"></div>
          <div class="col__add visible" id="add-backlog" onclick="showForm('backlog')">+ Добавить</div>
        </div>
        <div class="col col--todo" id="colWrap-todo">
          <div class="col__head" onclick="toggleCol('todo')">
            <span>📌</span><span class="col__title">To Do</span>
            <span class="col__count" id="cnt-todo">0</span>
            <span class="col__toggle" id="toggle-todo">▾</span>
          </div>
          <div class="col__body" id="col-todo"></div>
          <div class="col__add visible" id="add-todo" onclick="showForm('todo')">+ Добавить</div>
        </div>
        <div class="col col--doing" id="colWrap-doing">
          <div class="col__head" onclick="toggleCol('doing')">
            <span>⚡</span><span class="col__title">In Progress</span>
            <span class="col__count" id="cnt-doing">0</span>
            <span class="col__toggle" id="toggle-doing">▾</span>
          </div>
          <div class="col__body" id="col-doing"></div>
          <div class="col__add visible" id="add-doing" onclick="showForm('doing')">+ Добавить</div>
        </div>
        <div class="col col--done" id="colWrap-done">
          <div class="col__head" onclick="toggleCol('done')">
            <span>✅</span><span class="col__title">Done</span>
            <span class="col__count" id="cnt-done">0</span>
            <span class="col__toggle" id="toggle-done">▾</span>
          </div>
          <div class="col__body" id="col-done"></div>
          <div class="col__add visible" id="add-done" onclick="showForm('done')">+ Добавить</div>
        </div>
      </div>
      <!-- Archive toggle -->
      <div class="archive-toggle" onclick="toggleArchive()" id="archiveToggle" style="display:none">
        <span id="archiveArrow">▸</span>
        <span>📦 Архив (<span id="archiveCount">0</span>)</span>
      </div>
      <div id="archiveList" style="display:none;margin-top:8px"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="api-config.js?v=13"></script>
<script>
requireAuth('login.html');

var startupId   = getUrlParam('id');
var startupData = null;
var pageUser    = null;
var pageUserData= null;
var isOwner     = false;
var isMember    = false;
var memberPerms = {}; // {kanban, updates, team}
var allTasks    = [];
var showArchive = false;
var teamMembers = []; // [{uid, name}]
var colCollapsed = { backlog:false, todo:false, doing:false, done:false };
var formCol     = null;

if (!startupId) window.location.href = 'startups.html';

// Поделиться ссылкой на дорожную карту
async function shareRoadmap() {
  var url = window.location.href;
  try {
    await navigator.clipboard.writeText(url);
    showToast('🔗 Ссылка скопирована', 'success');
  } catch(e) {
    var ta = document.createElement('textarea');
    ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); showToast('🔗 Ссылка скопирована', 'success'); }
    catch(e2) { showToast(tv('Скопируй ссылку из адресной строки','Скопируйте ссылку из адресной строки'), 'warn'); }
    document.body.removeChild(ta);
  }
}

var COLS = { backlog:'Backlog', todo:'To Do', doing:'In Progress', done:'Done' };
var PRIORITY = { high:{label:'🔴 Высокий',cls:'priority-high',badge:'badge--red'}, med:{label:'🟡 Средний',cls:'priority-med',badge:'badge--warn'}, low:{label:'🔵 Низкий',cls:'priority-low',badge:'badge--blue'} };

onAuthReady(async function(user, userData) {
  if (!user) return;
  pageUser = user; pageUserData = userData;
  renderNav(userData);

  try {
    var snap = await db.collection('startups').doc(startupId).get();
    if (!snap.exists) { window.location.href = 'startups.html'; return; }
    startupData = Object.assign({id:snap.id}, snap.data());
    isOwner = user.uid === startupData.ownerUid || (userData && userData.role === 'admin');

    document.getElementById('rmEmoji').textContent = startupData.emoji || '🚀';
    document.getElementById('rmTitle').textContent = startupData.name + ' — Roadmap';
    document.getElementById('rmSub').textContent   = startupData.tagline || '';
    document.getElementById('backBtn').href        = 'startup.html?id=' + startupId;
    document.title = startupData.name + ' — Roadmap';

    // Проверяем участие и permissions
    try {
      var invCheck = await db.collection('invites')
        .where('fromUid','==',user.uid).where('startupId','==',startupId).where('status','==','accepted').get();
      if (!invCheck.empty) {
        isMember = true;
        var inv = invCheck.docs[0].data();
        memberPerms = inv.permissions || {};
      }
    } catch(e) {}
    // Также проверяем team subcollection.
    // ВАЖНО: бэкенд отдаёт всю команду и игнорирует фильтр по uid,
    // поэтому находим запись текущего пользователя на клиенте.
    try {
      var teamCheck = await db.collection('startups').doc(startupId).collection('team').get();
      var myTeam = teamCheck.docs.map(function(d){ return d.data(); }).find(function(m){
        return (m.userUid || m.user_uid || m.uid) === user.uid;
      });
      if (myTeam) {
        isMember = true;
        memberPerms = myTeam.permissions || {};
      }
    } catch(e) {}

    var canEdit = isOwner || memberPerms.kanban === true;

    // Кнопки добавления — только владельцу
    if (!canEdit) {
      document.querySelectorAll('.col__add').forEach(function(el){ el.classList.remove('visible'); });
    }

    // Загружаем команду для выбора исполнителя
    await loadTeamMembers();

    // Слушаем задачи
    db.collection('startups').doc(startupId).collection('tasks')
      .orderBy('createdAt','asc')
      .onSnapshot(function(snap) {
        allTasks = snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
        if (!isOwner && !isMember) {
          // Приватные задачи прячем, но свои предложения автор видит (сервер отдаёт только их)
          allTasks = allTasks.filter(function(t){ return t.isPublic !== false || t.status === 'suggested'; });
        }
        // Показываем кнопку архива
        var archivedCount = allTasks.filter(function(t){return t.archived;}).length;
        var archBtn = document.getElementById('archiveToggle');
        if (archBtn) {
          archBtn.style.display = archivedCount > 0 ? 'flex' : 'none';
          document.getElementById('archiveCount').textContent = archivedCount;
        }
        // Не перерисовываем доску пока открыта форма задачи или редактор комментария
        if (!dragTaskId && !formCol && !document.getElementById('active-task-form') && !document.querySelector('.task-cmt__input')) {
          renderBoard(canEdit);
        }
      }, function() {
        db.collection('startups').doc(startupId).collection('tasks').get().then(function(snap){
          allTasks = snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });
          if (!isOwner && !isMember) allTasks = allTasks.filter(function(t){ return t.isPublic !== false || t.status === 'suggested'; });
          if (!dragTaskId && !formCol && !document.getElementById('active-task-form') && !document.querySelector('.task-cmt__input')) renderBoard(canEdit);
        });
      });

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('pageContent').style.display  = 'block';
  } catch(e) {
    document.getElementById('loadingState').innerHTML =
      '<div class="empty-state"><div class="empty-state__icon">⚠️</div><div class="empty-state__title">Ошибка</div><p>' + e.message + '</p></div>';
  }
});

async function loadTeamMembers() {
  teamMembers = [];
  // Владелец
  teamMembers.push({ uid: startupData.ownerUid, name: startupData.ownerName || 'Основатель' });
  // Из subcollection team
  try {
    var ts = await db.collection('startups').doc(startupId).collection('team').get();
    ts.docs.forEach(function(d){
      var td = d.data();
      var tuid = td.userUid || td.user_uid || td.uid || '';
      if (tuid && !teamMembers.find(function(m){ return m.uid===tuid; })) {
        teamMembers.push({ uid: tuid, name: td.name || tuid });
      }
    });
  } catch(e) {}
  // Из accepted invites
  try {
    var invs = await db.collection('invites').where('startupId','==',startupId).where('status','==','accepted').get();
    invs.docs.forEach(function(d){
      var inv = d.data();
      var muid = (inv.type==='from_startup' && inv.toUid) ? inv.toUid : inv.fromUid;
      var mname = (inv.type==='from_startup') ? '' : (inv.fromName||'');
      if (muid && !teamMembers.find(function(m){ return m.uid===muid; })) {
        teamMembers.push({ uid: muid, name: mname || muid });
      }
    });
  } catch(e) {}
}

// ── BOARD RENDER ──────────────────────────────────────
function renderBoard(canEdit) {
  var byCol = { backlog:[], todo:[], doing:[], done:[] };
  allTasks.forEach(function(t){ if (!t.archived && byCol[t.status]) byCol[t.status].push(t); });

  Object.keys(byCol).forEach(function(col) {
    var tasks = byCol[col];
    document.getElementById('cnt-'+col).textContent = tasks.length;
    var el = document.getElementById('col-'+col);
    if (!tasks.length) { el.innerHTML = '<div class="empty-col">Нет задач</div>'; return; }

    // Done — компактный вид если свернут
    if (col === 'done' && colCollapsed[col]) {
      el.innerHTML = tasks.map(function(t) {
        return '<div class="done-compact">' +
          '<span style="color:var(--accent)">✓</span>' +
          '<span class="done-compact__title">' + esc(t.title||'') + '</span>' +
          (t.isPublic===false ? '<span title="Приватная" style="font-size:11px;color:var(--text3)">🔒</span>' : '') +
        '</div>';
      }).join('');
      return;
    }

    el.innerHTML = tasks.map(function(t) {
      var pr    = PRIORITY[t.priority] || PRIORITY.med;
      var priv  = t.isPublic === false;
      var asgn  = t.assigneeUid ? teamMembers.find(function(m){ return m.uid===t.assigneeUid; }) : null;
      var moveOpts = Object.keys(COLS).map(function(c){
        return '<option value="'+c+'"'+(c===t.status?' selected':'')+'>'+COLS[c]+'</option>';
      }).join('');

      // Заблокированную задачу может редактировать только основатель
      var showActions = canEdit && (isOwner || !t.locked);
      return '<div class="task-card '+pr.cls+(priv?' private-task':'')+(col==='done'?' task-card--done':'')+'" id="tc-'+t.id+'"' +
        (showActions ? ' draggable="true" data-id="'+esc(t.id)+'" ondragstart="onTaskDragStart(event)" ondragend="onTaskDragEnd(event)"' : '') + '>' +
        (showActions ? '<div class="task-card__actions">'+
          '<select class="task-btn" onchange="moveTask(this)" data-id="'+esc(t.id)+'" title="Переместить">'+moveOpts+'</select>'+
          '<button class="task-btn" data-id="'+esc(t.id)+'" onclick="editTask(this)" title="Редактировать">✏️</button>'+
          '<button class="task-btn task-btn--danger" data-id="'+esc(t.id)+'" onclick="deleteTask(this)" title="Удалить">✕</button>'+
        '</div>' : '') +
        '<div class="task-card__title">' + (t.locked ? '🔒 ' : '') + esc(t.title||'') + '</div>' +
        (t.description ? '<div class="task-card__desc">' + esc(t.description) + '</div>' : '') +
        '<div class="task-card__meta">' +
          '<span class="badge '+pr.badge+'" style="font-size:11px">'+pr.label+'</span>' +
          (asgn ? '<span class="task-card__assignee">👤 '+esc(asgn.name)+'</span>' : '') +
          (t.deadline ? deadlineBadge(t.deadline) : '') +
          (priv ? '<span class="badge badge--gray" style="font-size:10px">🔒</span>' : '') +
        '</div>' +
        '<div class="task-cmt" id="cm-'+esc(t.id)+'">' + commentsView(t) + '</div>' +
      '</div>';
    }).join('');
  });

  updateStats(byCol);
  renderSuggestions();
}

// ── ПРЕДЛОЖЕННЫЕ ЗАДАЧИ ───────────────────────────────
// Предлагают эксперты и менторы из команды без доступа к канбану; принимает или отклоняет основатель / участник с правом «канбан»
function canReviewSuggestions() { return isOwner || memberPerms.kanban === true; }
function canSuggestTask() {
  var r = pageUserData && pageUserData.role;
  return !canReviewSuggestions() && isMember && (r === 'expert' || r === 'mentor');
}

function renderSuggestions() {
  var panel = document.getElementById('sugPanel');
  if (!panel || !pageUser) return;
  var list = allTasks.filter(function(t){ return t.status === 'suggested'; });
  var review = canReviewSuggestions(), suggest = canSuggestTask();
  if (!list.length && !suggest) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  document.getElementById('sugCount').textContent = list.length;
  document.getElementById('sugAddBtn').style.display = suggest ? '' : 'none';
  document.getElementById('sugHint').textContent = review
    ? tv('Эксперты и менторы предлагают задачи — прими их в Backlog или отклони.',
         'Эксперты и менторы предлагают задачи — примите их в Backlog или отклоните.')
    : 'Предложите задачу команде — основатель примет её в роадмап или отклонит. Ваши предложения видны только вам и команде.';
  if (!list.length) {
    document.getElementById('sugList').innerHTML = '<div class="empty-col" style="grid-column:1/-1">Пока нет предложений</div>';
    return;
  }
  document.getElementById('sugList').innerHTML = list.map(function(t) {
    var pr = PRIORITY[t.priority] || PRIORITY.med;
    var mine = t.suggestedBy === pageUser.uid;
    var actions = '';
    if (review) {
      actions = '<button class="tf-btn tf-btn--save" data-id="'+esc(t.id)+'" onclick="acceptSuggestion(this)">✓ Принять в Backlog</button>' +
                '<button class="tf-btn tf-btn--cancel" data-id="'+esc(t.id)+'" onclick="rejectSuggestion(this)">Отклонить</button>';
    } else if (mine) {
      actions = '<button class="tf-btn tf-btn--cancel" data-id="'+esc(t.id)+'" onclick="openSuggestForm(this.getAttribute(\'data-id\'))">✏️ Изменить</button>' +
                '<button class="tf-btn tf-btn--cancel" data-id="'+esc(t.id)+'" onclick="rejectSuggestion(this)">Отозвать</button>';
    }
    return '<div class="sug-card">' +
      '<div class="task-card__title">'+esc(t.title||'')+'</div>' +
      (t.description ? '<div class="task-card__desc">'+esc(t.description)+'</div>' : '') +
      '<div class="task-card__meta"><span class="badge '+pr.badge+'" style="font-size:11px">'+pr.label+'</span></div>' +
      '<div class="sug-card__by">💡 '+(mine ? 'Ваше предложение' : 'Предложил(а) '+esc(t.suggestedByName||'эксперт'))+
        (t.createdAt ? ' · '+formatDate(t.createdAt) : '')+'</div>' +
      (actions ? '<div class="sug-card__actions">'+actions+'</div>' : '') +
    '</div>';
  }).join('');
}

function openSuggestForm(taskId) {
  var t = taskId ? allTasks.find(function(x){ return x.id === taskId; }) : null;
  var slot = document.getElementById('sugFormSlot');
  slot.innerHTML = '<div class="task-form" style="margin-top:12px;max-width:520px">' +
    '<input id="sf-title" placeholder="Название задачи *" maxlength="120" value="'+esc(t ? t.title : '')+'"/>' +
    '<textarea id="sf-desc" placeholder="Что сделать и зачем (необязательно)" maxlength="2000">'+esc(t ? t.description || '' : '')+'</textarea>' +
    '<select id="sf-priority">' +
      ['med','high','low'].map(function(p){ return '<option value="'+p+'"'+((t ? t.priority : 'med')===p?' selected':'')+'>'+
        ({med:'🟡 Приоритет: Средний', high:'🔴 Высокий', low:'🔵 Низкий'})[p]+'</option>'; }).join('') +
    '</select>' +
    '<div class="task-form__btns">' +
      '<button class="tf-btn tf-btn--save" data-id="'+esc(taskId||'')+'" onclick="saveSuggestion(this)">'+(t ? 'Сохранить' : 'Предложить')+'</button>' +
      '<button class="tf-btn tf-btn--cancel" onclick="document.getElementById(\'sugFormSlot\').innerHTML=\'\'">Отмена</button>' +
    '</div></div>';
  document.getElementById('sf-title').focus();
}

async function saveSuggestion(btn) {
  var id = btn.getAttribute('data-id');
  var data = {
    title:       document.getElementById('sf-title').value.trim(),
    description: document.getElementById('sf-desc').value.trim(),
    priority:    document.getElementById('sf-priority').value,
  };
  if (!data.title) { showToast('Введите название задачи','error'); return; }
  btn.disabled = true;
  try {
    if (id) {
      var upd = (await api.patch('/startups/'+startupId+'/tasks/'+id, data)).task;
      var i = allTasks.findIndex(function(x){ return x.id === id; });
      if (i !== -1) allTasks[i] = Object.assign({}, allTasks[i], _toCamel(upd));
    } else {
      var created = (await api.post('/startups/'+startupId+'/tasks', data)).task;
      allTasks.push(Object.assign({ id: created.id }, _toCamel(created)));
    }
    document.getElementById('sugFormSlot').innerHTML = '';
    renderSuggestions();
    showToast(id ? 'Предложение обновлено' : '💡 Задача предложена — основатель получил уведомление','success');
  } catch(e) { btn.disabled = false; showToast('Ошибка: '+e.message,'error'); }
}

async function acceptSuggestion(btn) {
  var id = btn.getAttribute('data-id');
  try {
    await api.patch('/startups/'+startupId+'/tasks/'+id, { status: 'backlog', is_public: true });
    var t = allTasks.find(function(x){ return x.id === id; });
    if (t) { t.status = 'backlog'; t.isPublic = true; t.is_public = true; }
    renderBoard(isOwner || memberPerms.kanban === true);
    showToast('Задача принята в Backlog','success');
  } catch(e) { showToast('Ошибка: '+e.message,'error'); }
}

async function rejectSuggestion(btn) {
  var id = btn.getAttribute('data-id');
  var t = allTasks.find(function(x){ return x.id === id; });
  var mine = t && t.suggestedBy === pageUser.uid;
  if (!confirm(mine ? 'Отозвать предложение?' : 'Отклонить предложенную задачу? Автор получит уведомление.')) return;
  try {
    await api.delete('/startups/'+startupId+'/tasks/'+id);
    allTasks = allTasks.filter(function(x){ return x.id !== id; });
    renderSuggestions();
    showToast(mine ? 'Предложение отозвано' : 'Предложение отклонено','success');
  } catch(e) { showToast('Ошибка: '+e.message,'error'); }
}

function updateStats(byCol) {
  var total = allTasks.filter(function(t){ return t.status !== 'suggested'; }).length;
  var done  = (byCol&&byCol.done) ? byCol.done.length : allTasks.filter(function(t){return t.status==='done';}).length;
  var doing = allTasks.filter(function(t){return t.status==='doing';}).length;
  var todo  = allTasks.filter(function(t){return t.status==='todo';}).length;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent  = done;
  document.getElementById('statDoing').textContent = doing;
  document.getElementById('statTodo').textContent  = todo;
  document.getElementById('progressFill').style.width = total ? Math.round(done/total*100)+'%' : '0%';
}

// ── COLLAPSE ──────────────────────────────────────────
function toggleCol(col) {

  var canEdit = isOwner || (memberPerms && memberPerms.kanban === true);
  renderBoard(canEdit);
}

async function saveTask(btn) {
  var existingId = btn ? btn.getAttribute('data-id') : null;
  var canEdit = isOwner || (memberPerms && memberPerms.kanban === true);
  if (!canEdit) return;
  var title = (document.getElementById('tf-title').value||'').trim();
  if (!title) { showToast(tv('Введи название','Введите название'),'error'); return; }

  var assigneeUid  = document.getElementById('tf-assignee').value || '';
  var assigneeName = '';
  if (assigneeUid) {
    var m = teamMembers.find(function(m){ return m.uid===assigneeUid; });
    if (m) assigneeName = m.name;
  }

  var taskStatus = existingId ? undefined : formCol;
  var data = {
    title:        title,
    description:  (document.getElementById('tf-desc').value||'').trim(),
    priority:     document.getElementById('tf-priority').value,
    assigned_to:  assigneeUid || null,
    assigneeName: assigneeName,
    is_public:    document.getElementById('tf-public').checked,
  };
  var lockedEl = document.getElementById('tf-locked');
  if (lockedEl) data.locked = lockedEl.checked;   // только основатель видит этот чекбокс
  var deadlineEl = document.getElementById('tf-deadline');
  if (deadlineEl) data.deadline = deadlineEl.value || null;   // пусто → снять дедлайн
  var archiveEl = document.getElementById('tf-archive');
  if (archiveEl) data.archived = archiveEl.checked;
  if (taskStatus !== undefined) data.status = taskStatus;

  try {
    var result;
    if (existingId) {
      await db.collection('startups').doc(startupId).collection('tasks').doc(existingId).update(data);
      // Обновляем локально
      var idx = allTasks.findIndex(function(t){ return t.id===existingId; });
      if (idx !== -1) allTasks[idx] = Object.assign({}, allTasks[idx], data, { isPublic: data.is_public, assigneeUid: assigneeUid });
    } else {
      result = await db.collection('startups').doc(startupId).collection('tasks').add(data);
      // Добавляем локально для немедленного отображения
      allTasks.push(Object.assign({ id: result.id || String(Math.random()) }, data, {
        isPublic: data.is_public, assigneeUid: assigneeUid, archived: false
      }));
    }
    cancelForm();
    renderBoard(canEdit);
    showToast(existingId ? 'Задача обновлена' : 'Задача добавлена','success');
  } catch(e) { showToast('Ошибка: '+e.message,'error'); }
}

function editTask(btn) { var taskId=btn.getAttribute("data-id");
  var t = allTasks.find(function(t){ return t.id===taskId; });
  if (!t) return;
  var prev = document.getElementById('active-task-form'); if (prev) prev.remove();
  formCol = t.status;

  var assigneeOpts = '<option value="">Не назначен</option>' +
    teamMembers.map(function(m){
      return '<option value="'+esc(m.uid)+'"'+(m.uid===t.assigneeUid?' selected':'')+'>'+esc(m.name)+'</option>';
    }).join('');

  var form = document.createElement('div');
  form.id = 'active-task-form';
  form.className = 'task-form';
  form.innerHTML =
    '<input id="tf-title" value="'+esc(t.title||'')+'" placeholder="Название *" maxlength="120"/>' +
    '<textarea id="tf-desc" placeholder="Описание">'+esc(t.description||'')+'</textarea>' +
    '<select id="tf-priority"><option value="med"'+(t.priority==='med'?' selected':'')+'>🟡 Средний</option><option value="high"'+(t.priority==='high'?' selected':'')+'>🔴 Высокий</option><option value="low"'+(t.priority==='low'?' selected':'')+'>🔵 Низкий</option></select>' +
    '<select id="tf-assignee">'+assigneeOpts+'</select>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
      '<div><label style="font-size:11px;color:var(--text3);display:block;margin-bottom:4px">Дедлайн</label><input type="date" id="tf-deadline" value="'+esc((t.deadline||'').slice(0,10))+'" style="width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-size:12px;padding:6px 9px;outline:none"/></div>' +
      '<div style="display:flex;align-items:flex-end;padding-bottom:2px"><label class="tf-check" style="margin:0"><input type="checkbox" id="tf-archive"'+(t.archived?' checked':'')+'/> В архив</label></div>' +
    '</div>' +
    '<label class="tf-check"><input type="checkbox" id="tf-public"'+(t.isPublic!==false?' checked':'')+'/> Публичная (видна всем)</label>' +
    (isOwner ? '<label class="tf-check"><input type="checkbox" id="tf-locked"'+(t.locked?' checked':'')+'/> 🔒 Только основатель может редактировать</label>' : '') +
    '<div class="task-form__btns">' +
      '<button class="tf-btn tf-btn--save" data-id="'+taskId+'" onclick="saveTask(this)">Сохранить</button>' +
      '<button class="tf-btn tf-btn--cancel" onclick="cancelForm()">Отмена</button>' +
    '</div>';

  var tc = document.getElementById('tc-'+taskId);
  if (tc) { tc.parentNode.insertBefore(form, tc); tc.style.display = 'none'; }  // прячем карточку — форма встаёт на её место
  else document.getElementById('col-'+t.status).insertBefore(form, document.getElementById('col-'+t.status).firstChild);
  document.getElementById('tf-title').focus();
}

async function moveTask(sel) { await moveTaskTo(sel.getAttribute("data-id"), sel.value); }

// Перенос задачи в колонку (выпадающий список или перетаскивание).
// Двигать может основатель / админ и участник с правом «канбан»; заблокированную — только основатель.
function canMoveTask(t) {
  var canEdit = isOwner || memberPerms.kanban === true;
  return !!t && canEdit && (isOwner || !t.locked);
}
async function moveTaskTo(taskId, newStatus) {
  var t = allTasks.find(function(x){ return x.id === taskId; });
  if (!canMoveTask(t) || !COLS[newStatus] || t.status === newStatus) return;
  var prevStatus = t.status;
  t.status = newStatus;                              // сразу показываем на новом месте
  renderBoard(isOwner || memberPerms.kanban === true);
  try {
    await db.collection('startups').doc(startupId).collection('tasks').doc(taskId).update({
      status: newStatus, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) {
    t.status = prevStatus;                           // откат, если сервер отказал
    renderBoard(isOwner || memberPerms.kanban === true);
    showToast('Ошибка: '+e.message,'error');
  }
}

// ── ПЕРЕТАСКИВАНИЕ (drag & drop) ──────────────────────
var dragTaskId = null;
function onTaskDragStart(e) {
  // Не начинаем drag с элементов управления внутри карточки
  if (e.target.closest && e.target.closest('select,button,textarea,input,a')) { e.preventDefault(); return; }
  dragTaskId = e.currentTarget.getAttribute('data-id');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', dragTaskId);
  e.currentTarget.classList.add('dragging');
}
function onTaskDragEnd(e) {
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.col.drop-target').forEach(function(c){ c.classList.remove('drop-target'); });
  dragTaskId = null;
}
// Колонка целиком (вместе с заголовком) принимает задачу — можно бросить и в свёрнутую
function initColumnDrop() {
  Object.keys(COLS).forEach(function(col) {
    var wrap = document.getElementById('colWrap-'+col);
    if (!wrap) return;
    wrap.addEventListener('dragover', function(e) {
      if (!dragTaskId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      wrap.classList.add('drop-target');
    });
    wrap.addEventListener('dragleave', function(e) {
      if (!wrap.contains(e.relatedTarget)) wrap.classList.remove('drop-target');
    });
    wrap.addEventListener('drop', function(e) {
      e.preventDefault();
      wrap.classList.remove('drop-target');
      var id = dragTaskId || e.dataTransfer.getData('text/plain');
      dragTaskId = null;
      if (id) moveTaskTo(id, col);
    });
  });
}
initColumnDrop();

async function deleteTask(btn) { var taskId=btn.getAttribute("data-id");
  if (!isOwner || !confirm('Удалить задачу?')) return;
  try {
    await db.collection('startups').doc(startupId).collection('tasks').doc(taskId).delete();
    showToast('Задача удалена','success');
  } catch(e) { showToast('Ошибка: '+e.message,'error'); }
}

// ── КОММЕНТАРИИ (правят все участники) ────────────────
function commentsView(t) {
  var c = t.comments || '';
  // Править комментарий может только команда (владелец или участник)
  var canComment = isOwner || isMember;
  return (c ? '<div class="task-cmt__text">'+esc(c)+'</div>' : '') +
    (canComment
      ? '<button class="task-cmt__btn" onclick="editComments(\''+esc(t.id)+'\')">'+(c?'✏️ Изменить комментарий':'💬 Добавить комментарий')+'</button>'
      : '');
}
function editComments(taskId) {
  var t = allTasks.find(function(x){ return x.id===taskId; });
  if (!t) return;
  var box = document.getElementById('cm-'+taskId);
  if (!box) return;
  box.innerHTML = '<textarea class="task-cmt__input" id="cmt-input-'+taskId+'" placeholder="Комментарий (виден команде, править может каждый)">'+esc(t.comments||'')+'</textarea>'+
    '<div style="display:flex;gap:6px;margin-top:6px">'+
      '<button class="tf-btn tf-btn--save" onclick="saveComments(\''+taskId+'\')">Сохранить</button>'+
      '<button class="tf-btn tf-btn--cancel" onclick="cancelComments(\''+taskId+'\')">Отмена</button>'+
    '</div>';
  document.getElementById('cmt-input-'+taskId).focus();
}
async function saveComments(taskId) {
  var input = document.getElementById('cmt-input-'+taskId);
  if (!input) return;
  var val = (input.value||'').trim();
  try {
    await api.patch('/startups/'+startupId+'/tasks/'+taskId+'/comments', { comments: val });
    var t = allTasks.find(function(x){ return x.id===taskId; });
    if (t) t.comments = val;
    var box = document.getElementById('cm-'+taskId);
    if (box && t) box.innerHTML = commentsView(t);
    showToast('Комментарий сохранён','success');
  } catch(e) { showToast('Ошибка: '+(e.message||'не удалось'),'error'); }
}
function cancelComments(taskId) {
  var t = allTasks.find(function(x){ return x.id===taskId; });
  var box = document.getElementById('cm-'+taskId);
  if (box && t) box.innerHTML = commentsView(t);
}

function deadlineBadge(dateStr) {
  if (!dateStr) return '';
  var d    = new Date(dateStr);
  var now  = new Date();
  now.setHours(0,0,0,0);
  var diff = Math.ceil((d-now)/(1000*60*60*24));
  var cls  = diff < 0 ? 'deadline-over' : diff <= 3 ? 'deadline-soon' : 'deadline-ok';
  var lbl  = diff < 0 ? '⚠ Просрочено' : diff === 0 ? '⚡ Сегодня' : diff <= 3 ? '⏰ '+diff+'д' : '📅 '+String(dateStr).slice(0,10);
  return '<span class="deadline-badge '+cls+'">'+lbl+'</span>';
}

function toggleArchive() {
  showArchive = !showArchive;
  document.getElementById('archiveArrow').textContent = showArchive ? '▾' : '▸';
  document.getElementById('archiveList').style.display = showArchive ? 'block' : 'none';
  if (showArchive) renderArchive();
}

function renderArchive() {
  var archived = allTasks.filter(function(t){ return t.archived; });
  var el = document.getElementById('archiveList');
  if (!archived.length) { el.innerHTML='<p style="font-size:13px;color:var(--text3);padding:8px 0">Архив пуст</p>'; return; }
  el.innerHTML = '<div class="card" style="padding:0;overflow:hidden">' +
    archived.map(function(t) {
      var asgn = t.assigneeUid ? teamMembers.find(function(m){return m.uid===t.assigneeUid;}) : null;
      return '<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)">' +
        '<span style="color:var(--accent)">✓</span>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-size:13px;text-decoration:line-through;color:var(--text2)">'+esc(t.title||'')+'</div>' +
          (asgn?'<div style="font-size:11px;color:var(--text3)">👤 '+esc(asgn.name)+'</div>':'') +
        '</div>' +
        (t.deadline?'<span style="font-size:11px;color:var(--text3)">📅 '+String(t.deadline).slice(0,10)+'</span>':'')+
        (isOwner?'<button class="btn btn--ghost btn--sm" style="font-size:11px" data-id="'+t.id+'" onclick="unarchiveTask(this)">↩ Вернуть</button>':'') +
      '</div>';
    }).join('') + '</div>';
}

async function unarchiveTask(btn) {
  var id = btn.getAttribute('data-id');
  await db.collection('startups').doc(startupId).collection('tasks').doc(id).update({
    archived: false, status: 'todo', updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  showToast('Задача возвращена','success');
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
