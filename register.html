<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Регистрация — LaunchPad</title>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .auth-box {
      width:100%; max-width:460px; padding:24px;
    }
    .auth-logo {
      font-family:var(--font-head); font-size:26px; font-weight:800;
      color:var(--accent); text-decoration:none; display:block;
      text-align:center; margin-bottom:32px;
    }
    .auth-logo span{color:var(--text);}
    .auth-title {
      font-family:var(--font-head); font-size:28px; font-weight:800;
      letter-spacing:-1px; margin-bottom:6px; text-align:center;
    }
    .auth-sub { color:var(--text2); font-size:14px; text-align:center; margin-bottom:32px; }
    .role-selector { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:24px; }
    .role-btn {
      border:2px solid var(--border2); border-radius:var(--radius);
      padding:16px 10px; text-align:center; cursor:pointer;
      transition:all .2s; background:var(--bg3);
    }
    .role-btn:hover { border-color:var(--border2); transform:translateY(-2px); }
    .role-btn.selected-startup  { border-color:var(--accent); background:var(--accent-dim); }
    .role-btn.selected-investor { border-color:var(--investor); background:var(--investor-dim); }
    .role-btn.selected-user     { border-color:var(--info); background:rgba(61,142,245,.12); }
    .role-btn__icon { font-size:28px; margin-bottom:6px; }
    .role-btn__name { font-size:13px; font-weight:600; }
    .auth-link { text-align:center; font-size:14px; color:var(--text2); margin-top:20px; }
    .auth-link a { color:var(--accent); text-decoration:none; font-weight:500; }
    .divider-text {
      display:flex; align-items:center; gap:12px;
      color:var(--text3); font-size:13px; margin:16px 0;
    }
    .divider-text::before,.divider-text::after {
      content:''; flex:1; border-top:1px solid var(--border);
    }
  </style>
</head>
<body>

<div class="auth-box">
  <a href="index.html" class="auth-logo">Launch<span>Pad</span></a>
  <h1 class="auth-title">Создать аккаунт</h1>
  <p class="auth-sub">Выбери роль и начни работу</p>

  <!-- Роль -->
  <div class="role-selector" id="roleSelector">
    <div class="role-btn" data-role="startup" onclick="selectRole(this,'startup')">
      <div class="role-btn__icon">🚀</div>
      <div class="role-btn__name">Стартапер</div>
    </div>
    <div class="role-btn" data-role="investor" onclick="selectRole(this,'investor')">
      <div class="role-btn__icon">💼</div>
      <div class="role-btn__name">Инвестор</div>
    </div>
    <div class="role-btn" data-role="user" onclick="selectRole(this,'user')">
      <div class="role-btn__icon">👤</div>
      <div class="role-btn__name">Специалист</div>
    </div>
  </div>

  <div class="card">
    <div class="form-group">
      <label class="form-label">Имя и фамилия</label>
      <input type="text" class="form-input" id="nameInput" placeholder="Иван Петров"/>
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" id="emailInput" placeholder="ivan@example.com"/>
    </div>
    <div class="form-group">
      <label class="form-label">Пароль</label>
      <input type="password" class="form-input" id="passInput" placeholder="Минимум 6 символов"/>
    </div>
    <div class="form-group" style="margin-bottom:0">
      <label class="form-label">Подтверди пароль</label>
      <input type="password" class="form-input" id="pass2Input" placeholder="Повтори пароль"/>
    </div>
    <div id="formError" class="form-error" style="margin-top:12px;display:none;"></div>
    <button class="btn btn--primary" style="width:100%;margin-top:20px;justify-content:center;" id="submitBtn" onclick="doRegister()">
      Зарегистрироваться
    </button>
  </div>

  <p class="auth-link">Уже есть аккаунт? <a href="login.html">Войти</a></p>
</div>

<div id="toast" class="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="firebase-config.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    redirectIfAuth('dashboard.html');
  });

  let selectedRole = null;

  function selectRole(el, role) {
    document.querySelectorAll('.role-btn').forEach(b => b.className = 'role-btn');
    el.classList.add(`selected-${role}`);
    selectedRole = role;
  }

  async function doRegister() {
    const name  = document.getElementById('nameInput').value.trim();
    const email = document.getElementById('emailInput').value.trim();
    const pass  = document.getElementById('passInput').value;
    const pass2 = document.getElementById('pass2Input').value;
    const err   = document.getElementById('formError');
    const btn   = document.getElementById('submitBtn');

    err.style.display = 'none';

    if (!selectedRole) { showErr('Выбери роль'); return; }
    if (!name)  { showErr('Введи имя'); return; }
    if (!email) { showErr('Введи email'); return; }
    if (pass.length < 6) { showErr('Пароль минимум 6 символов'); return; }
    if (pass !== pass2)  { showErr('Пароли не совпадают'); return; }

    btn.disabled = true; btn.textContent = 'Регистрация...';

    try {
      const cred = await auth.createUserWithEmailAndPassword(email, pass);
      await db.collection('users').doc(cred.user.uid).set({
        uid: cred.user.uid,
        name,
        email,
        role: selectedRole,
        bio: '',
        avatar: '',
        skills: [],
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      window.location.href = 'dashboard.html';
    } catch(e) {
      showErr(getFirebaseError(e.code));
      btn.disabled = false; btn.textContent = 'Зарегистрироваться';
    }
  }

  function showErr(msg) {
    const el = document.getElementById('formError');
    el.textContent = msg; el.style.display = 'block';
  }

  function getFirebaseError(code) {
    const map = {
      'auth/email-already-in-use': 'Этот email уже используется',
      'auth/invalid-email': 'Неверный формат email',
      'auth/weak-password': 'Пароль слишком простой'
    };
    return map[code] || 'Произошла ошибка. Попробуй снова.';
  }
</script>
</body>
</html>
