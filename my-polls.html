<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Мои опросы — Атриум</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="stylesheet" href="styles.css?v=3"/>
</head>
<body>
<nav class="nav">
  <a href="dashboard.html" class="nav__logo"><img src="assets/atrium-logo.png" alt="Атриум"/></a>
  <a href="startups.html">Стартапы</a>
  <a href="feed.html">Лента</a>
  <a href="forum.html">Форум</a>
  <a href="members.html">Участники</a>
  <div class="nav__user">
    <a href="messages.html" class="btn btn--ghost btn--sm">💬 Сообщения</a>
    <span class="nav__role" id="navRole"></span>
    <img class="nav__avatar" id="navAvatar" src="https://ui-avatars.com/api/?background=181c24&color=00e676&name=U" onclick="window.location='profile.html'"/>
    <a href="dashboard.html" class="btn btn--ghost btn--sm">← Дашборд</a>
  </div>
</nav>

<div class="page">
  <div class="container--md">
    <div class="section-header" style="margin-bottom:24px">
      <div>
        <h1 class="page-title">📊 Мои опросы</h1>
        <p class="page-subtitle">Создавай опросы и делись ссылкой для сбора мнений</p>
      </div>
      <button class="btn btn--primary" onclick="openPollModal()">+ Создать опрос</button>
    </div>
    <div id="pollsList"><div class="spinner" style="margin:40px auto"></div></div>
  </div>
</div>

<!-- Модалка создания опроса -->
<div class="modal-overlay" id="pollModal">
  <div class="modal" style="max-width:500px">
    <div class="modal__header">
      <div class="modal__title">📊 Новый опрос</div>
      <button class="modal__close" onclick="closePollModal()">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">Вопросы (можно несколько, у каждого 2–4 варианта)</label>
      <div id="pollQuestions"></div>
      <button class="btn btn--outline btn--sm" type="button" onclick="addQuestionBlock()">+ Добавить вопрос</button>
    </div>
    <div class="form-group">
      <label class="form-label">Кто может голосовать</label>
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);margin-bottom:6px;cursor:pointer"><input type="radio" name="pollAud" value="all" checked/> Все (по ссылке, без регистрации)</label>
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);cursor:pointer"><input type="radio" name="pollAud" value="registered"/> Только зарегистрированные пользователи</label>
    </div>
    <div class="form-group" style="margin-bottom:20px">
      <label style="display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text2);cursor:pointer"><input type="checkbox" id="pollShowResults" checked style="width:16px;height:16px;accent-color:var(--accent)"/> Показывать результаты голосующим (иначе видит только автор)</label>
    </div>
    <button class="btn btn--primary" style="width:100%;justify-content:center" onclick="createPoll()">Создать опрос</button>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="api-config.js?v=3"></script>
<script>
requireAuth('login.html');

onAuthReady(function(user, userData) {
  if (!user) return;
  renderNav(userData);
  var canPolls = userData && ['startup', 'expert', 'user', 'admin'].indexOf(userData.role) !== -1;
  if (!canPolls) {
    document.getElementById('pollsList').innerHTML =
      '<div class="empty-state"><div class="empty-state__icon">📊</div>'+
      '<div class="empty-state__title">Опросы недоступны</div>'+
      '<p style="font-size:14px">Создавать опросы могут стартаперы, эксперты и специалисты.</p></div>';
    document.querySelector('.section-header button').style.display = 'none';
    return;
  }
  loadMyPolls();
});

// ── СОЗДАНИЕ ──────────────────────────────────────────
function questionBlockHtml() {
  return '<div class="qblock" style="border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:12px;background:var(--bg3)">'+
    '<div style="display:flex;gap:8px;margin-bottom:8px">'+
      '<input type="text" class="form-input qtext" maxlength="200" placeholder="Текст вопроса" style="flex:1"/>'+
      '<button class="btn btn--ghost btn--sm qremove" type="button" onclick="removeQuestionBlock(this)" title="Удалить вопрос">✕</button>'+
    '</div>'+
    '<input type="text" class="form-input qdesc" maxlength="500" placeholder="Описание вопроса (необязательно)" style="margin-bottom:8px;font-size:13px"/>'+
    '<input type="text" class="form-input qopt" maxlength="120" placeholder="Вариант 1" style="margin-bottom:6px"/>'+
    '<input type="text" class="form-input qopt" maxlength="120" placeholder="Вариант 2" style="margin-bottom:6px"/>'+
    '<input type="text" class="form-input qopt" maxlength="120" placeholder="Вариант 3 (необяз.)" style="margin-bottom:6px"/>'+
    '<input type="text" class="form-input qopt" maxlength="120" placeholder="Вариант 4 (необяз.)"/>'+
  '</div>';
}
function addQuestionBlock() {
  document.getElementById('pollQuestions').insertAdjacentHTML('beforeend', questionBlockHtml());
  updateQRemoveBtns();
}
function removeQuestionBlock(btn) {
  var blk = btn.closest('.qblock'); if (blk) blk.remove();
  updateQRemoveBtns();
}
function updateQRemoveBtns() {
  var blocks = document.querySelectorAll('#pollQuestions .qblock');
  document.querySelectorAll('#pollQuestions .qremove').forEach(function(b){ b.style.visibility = blocks.length > 1 ? 'visible' : 'hidden'; });
}
function openPollModal() {
  document.getElementById('pollQuestions').innerHTML = '';
  addQuestionBlock();
  document.querySelector('input[name="pollAud"][value="all"]').checked = true;
  document.getElementById('pollModal').classList.add('open');
}
function closePollModal() { document.getElementById('pollModal').classList.remove('open'); }

async function createPoll() {
  var questions = [];
  document.querySelectorAll('#pollQuestions .qblock').forEach(function(blk){
    var q = blk.querySelector('.qtext').value.trim();
    var desc = blk.querySelector('.qdesc').value.trim();
    var opts = Array.prototype.map.call(blk.querySelectorAll('.qopt'), function(i){ return i.value.trim(); }).filter(Boolean);
    if (q && opts.length >= 2) questions.push({ question: q, desc: desc, options: opts });
  });
  var aud = document.querySelector('input[name="pollAud"]:checked').value;
  var showRes = document.getElementById('pollShowResults').checked;
  if (!questions.length) { showToast('Заполни хотя бы один вопрос с 2 вариантами','error'); return; }
  try {
    await api.post('/polls', { questions: questions, audience: aud, show_results: showRes });
    closePollModal();
    showToast('Опрос создан!','success');
    loadMyPolls();
  } catch(e) { showToast('Ошибка: '+(e.message||'не удалось'),'error'); }
}

// ── СПИСОК ────────────────────────────────────────────
async function loadMyPolls() {
  var el = document.getElementById('pollsList');
  try {
    var data = await api.get('/polls');
    renderMyPolls(data.polls || []);
  } catch(e) { el.innerHTML = '<p style="font-size:14px;color:var(--text3)">Не удалось загрузить опросы</p>'; }
}
function renderMyPolls(polls) {
  var el = document.getElementById('pollsList');
  if (!polls.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-state__icon">📊</div><div class="empty-state__title">Опросов пока нет</div><p style="font-size:14px">Создай первый опрос и поделись ссылкой.</p></div>';
    return;
  }
  el.innerHTML = polls.map(function(p){
    var closed = p.status === 'closed';
    var firstQ = (p.questions && p.questions[0]) ? p.questions[0].question : (p.question||'');
    var qcnt = p.questionCount || (p.questions ? p.questions.length : 1);
    return '<div class="card" style="margin-bottom:12px;padding:18px">'+
      '<div style="font-size:15px;font-weight:600">'+esc(firstQ)+(qcnt>1?' <span style="font-size:12px;color:var(--text3);font-weight:400">+ ещё '+(qcnt-1)+'</span>':'')+'</div>'+
      '<div style="font-size:12px;color:var(--text3);margin-top:4px">'+
        (closed?'🔒 Закрыт':'🟢 Открыт')+' · '+(p.audience==='registered'?'зарегистрированные':'все')+' · '+qcnt+' вопр. · голосов: '+(p.total||0)+'</div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">'+
        '<a href="poll.html?id='+esc(p.id)+'" class="btn btn--outline btn--sm">📊 Результаты</a>'+
        '<button class="btn btn--ghost btn--sm" onclick="copyPollLink(\''+esc(p.id)+'\')">🔗 Ссылка</button>'+
        (closed
          ? '<button class="btn btn--ghost btn--sm" onclick="setPollStatus(\''+esc(p.id)+'\',\'open\')">Открыть</button>'
          : '<button class="btn btn--ghost btn--sm" onclick="setPollStatus(\''+esc(p.id)+'\',\'closed\')">Закрыть</button>')+
        '<button class="btn btn--danger btn--sm" onclick="deletePollById(\''+esc(p.id)+'\')">🗑 Удалить</button>'+
      '</div>'+
    '</div>';
  }).join('');
}
function copyPollLink(id) {
  var url = window.location.origin + window.location.pathname.replace(/[^/]*$/, '') + 'poll.html?id=' + id;
  navigator.clipboard.writeText(url).then(function(){ showToast('🔗 Ссылка скопирована','success'); },
    function(){ showToast(url,'info'); });
}
async function setPollStatus(id, status) {
  try { await api.patch('/polls/'+id, { status: status }); showToast(status==='closed'?'Опрос закрыт':'Опрос открыт','success'); loadMyPolls(); }
  catch(e){ showToast('Ошибка: '+e.message,'error'); }
}
async function deletePollById(id) {
  if (!confirm('Удалить опрос?')) return;
  try { await api.delete('/polls/'+id); showToast('Опрос удалён','success'); loadMyPolls(); }
  catch(e){ showToast('Ошибка: '+e.message,'error'); }
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
