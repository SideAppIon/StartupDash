<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Жалобы — Атриум</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="stylesheet" href="styles.css?v=3"/>
  <style>
    .cmp-tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
    .cmp-tab{padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;border:1px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;transition:all .2s}
    .cmp-tab.active{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}
    .cmp-card{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--danger);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:14px}
    .cmp-card--resolved{border-left-color:var(--accent);opacity:.75}
    .cmp-card--dismissed{border-left-color:var(--text3);opacity:.6}
    .cmp-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
    .cmp-ava{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--bg3);border:1px solid var(--border2)}
    .cmp-link{text-decoration:none;color:inherit;font-weight:600;font-size:14px}
    .cmp-link:hover{color:var(--accent)}
    .cmp-text{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 14px;font-size:14px;color:var(--text);line-height:1.6;white-space:pre-wrap;word-break:break-word;margin-bottom:12px}
    .cmp-meta{font-size:12px;color:var(--text3);display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
    .cmp-actions{display:flex;gap:8px;flex-wrap:wrap}
  </style>
</head>
<body>
<nav class="nav">
  <a href="dashboard.html" class="nav__logo"><img src="assets/atrium-logo.png" alt="Атриум"/></a>
  <a href="startups.html">Стартапы</a>
  <a href="feed.html">Лента</a>
  <a href="forum.html">Форум</a>
  <a href="members.html">Участники</a>
  <div class="nav__user">
    <a href="messages.html" class="btn btn--ghost btn--sm">💬 Сообщения</a>
    <span class="nav__role" id="navRole"></span>
    <img class="nav__avatar" id="navAvatar" src="https://ui-avatars.com/api/?background=181c24&color=00e676&name=U" onclick="goProfile()"/>
    <button class="btn btn--ghost btn--sm" onclick="auth.signOut().then(function(){window.location.href='index.html'})">Выйти</button>
  </div>
</nav>

<div class="page">
  <div class="container--md">
    <div class="section-header" style="margin-bottom:24px">
      <div>
        <h1 class="page-title">🛡 Жалобы</h1>
        <p class="page-subtitle">Кабинет модератора — жалобы пользователей</p>
      </div>
    </div>
    <div class="cmp-tabs">
      <button class="cmp-tab active" data-st="open" onclick="setTab('open')">Открытые</button>
      <button class="cmp-tab" data-st="" onclick="setTab('')">Все</button>
    </div>
    <div id="content"><div class="spinner"></div></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="api-config.js?v=3"></script>
<script>
requireAuth('login.html');

var allComplaints = [];
var curTab = 'open';

onAuthReady(async function(user, userData) {
  if (!user) return;
  renderNav(userData);
  // Только модератор / администратор
  if (!userData || (userData.role !== 'moderator' && userData.role !== 'admin')) {
    window.location.href = 'dashboard.html';
    return;
  }
  await loadComplaints();
});

async function loadComplaints() {
  var el = document.getElementById('content');
  el.innerHTML = '<div class="spinner"></div>';
  try {
    var data = await api.get('/complaints');
    // API отдает snake_case — приводим к camelCase
    allComplaints = (data.complaints || []).map(_toCamel);
    render();
  } catch(e) {
    el.innerHTML = '<div class="empty-state"><div class="empty-state__icon">⚠️</div>' +
      '<div class="empty-state__title">Ошибка загрузки</div><p>'+esc(e.message)+'</p></div>';
  }
}

function setTab(st) {
  curTab = st;
  document.querySelectorAll('.cmp-tab').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-st')===st); });
  render();
}

function render() {
  var el = document.getElementById('content');
  var list = curTab ? allComplaints.filter(function(c){ return c.status===curTab; }) : allComplaints;
  if (!list.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-state__icon">✅</div>' +
      '<div class="empty-state__title">' + (curTab==='open'?'Нет открытых жалоб':'Жалоб нет') + '</div>' +
      '<p style="font-size:14px">Здесь появятся жалобы пользователей</p></div>';
    return;
  }
  el.innerHTML = list.map(buildCard).join('');
}

function buildCard(c) {
  var repAv = c.reporterAvatar || 'https://ui-avatars.com/api/?background=181c24&color=00e676&name=' + encodeURIComponent(c.reporterName||'U');
  var tgtAv = c.targetAvatar   || 'https://ui-avatars.com/api/?background=181c24&color=00e676&name=' + encodeURIComponent(c.targetName||'U');
  var banned = c.targetForumBanned === true || c.targetForumBanned === 'true';
  var targetIsMod = c.targetRole === 'admin' || c.targetRole === 'moderator';

  // Ссылка на контекст
  var ctxLink = '';
  if (c.context === 'forum' && c.topicId) {
    ctxLink = '<a href="forum.html?topic='+esc(c.topicId)+'" class="cmp-link" style="font-weight:500;color:var(--info)">↗ Открыть на форуме</a>';
  } else if (c.targetUid) {
    ctxLink = '<a href="member.html?uid='+esc(c.targetUid)+'" class="cmp-link" style="font-weight:500;color:var(--info)">↗ Профиль</a>';
  }

  var statusBadge = c.status==='open'
    ? '<span class="badge badge--red" style="font-size:11px">Открыта</span>'
    : c.status==='resolved'
    ? '<span class="badge badge--green" style="font-size:11px">✅ Решена</span>'
    : '<span class="badge badge--gray" style="font-size:11px">Отклонена</span>';

  var cardCls = 'cmp-card' + (c.status==='resolved'?' cmp-card--resolved':c.status==='dismissed'?' cmp-card--dismissed':'');

  // Действия
  var actions = '';
  if (c.targetUid && !targetIsMod) {
    actions += banned
      ? '<button class="btn btn--outline btn--sm" style="color:var(--accent)" data-uid="'+esc(c.targetUid)+'" data-banned="1" onclick="toggleBan(this)">✓ Разрешить общение</button>'
      : '<button class="btn btn--danger btn--sm" data-uid="'+esc(c.targetUid)+'" data-banned="0" onclick="toggleBan(this)">🔇 Замутить</button>';
    actions += '<button class="btn btn--outline btn--sm" data-uid="'+esc(c.targetUid)+'" onclick="resetAvatar(this)">🖼 Сбросить аватар</button>';
  }
  if (c.status==='open') {
    actions += '<button class="btn btn--ghost btn--sm" data-id="'+esc(c.id)+'" data-st="resolved" onclick="setStatus(this)">Пометить решенной</button>';
    actions += '<button class="btn btn--ghost btn--sm" data-id="'+esc(c.id)+'" data-st="dismissed" onclick="setStatus(this)">Отклонить</button>';
  } else {
    actions += '<button class="btn btn--ghost btn--sm" data-id="'+esc(c.id)+'" data-st="open" onclick="setStatus(this)">Вернуть в работу</button>';
  }

  return '<div class="'+cardCls+'">' +
    '<div class="cmp-head">' +
      '<img class="cmp-ava" src="'+esc(repAv)+'"/>' +
      '<a class="cmp-link" href="member.html?uid='+esc(c.reporterUid||'')+'">'+esc(c.reporterName||'Аноним')+'</a>' +
      '<span style="color:var(--text3)">пожаловался(ась) на</span>' +
      '<img class="cmp-ava" src="'+esc(tgtAv)+'"/>' +
      '<a class="cmp-link" href="member.html?uid='+esc(c.targetUid||'')+'">'+esc(c.targetName||'—')+'</a>' +
      (banned?'<span class="badge badge--red" style="font-size:10px;padding:1px 6px">🚫 Бан</span>':'') +
      '<span style="margin-left:auto">'+statusBadge+'</span>' +
    '</div>' +
    '<div class="cmp-text">'+esc(c.text||'')+'</div>' +
    '<div class="cmp-meta">' +
      '<span>'+(c.context==='forum'?'💬 Форум':'👤 Профиль')+'</span>' +
      '<span>'+formatDate(c.createdAt)+'</span>' +
      ctxLink +
    '</div>' +
    '<div class="cmp-actions">'+actions+'</div>' +
  '</div>';
}

async function toggleBan(btn) {
  var uid = btn.getAttribute('data-uid');
  var banned = btn.getAttribute('data-banned') === '1';
  var next = !banned;
  if (!uid) return;
  if (!confirm(next ? 'Запретить пользователю общение на форуме? Он сможет только просматривать.' : 'Снова разрешить общение на форуме?')) return;
  try {
    await api.patch('/users/'+uid+'/forum-ban', { banned: next });
    showToast(next ? 'Общение запрещено' : 'Общение разрешено', 'success');
    await loadComplaints();
  } catch(e) { showToast('Ошибка: '+(e.message||'не удалось'),'error'); }
}

async function resetAvatar(btn) {
  var uid = btn.getAttribute('data-uid');
  if (!uid) return;
  if (!confirm('Сбросить аватар этого пользователя на дефолтный?')) return;
  try {
    await api.patch('/users/'+uid+'/reset-avatar', {});
    showToast('Аватар сброшен','success');
    await loadComplaints();
  } catch(e) { showToast('Ошибка: '+(e.message||'не удалось'),'error'); }
}

async function setStatus(btn) {
  var id = btn.getAttribute('data-id');
  var st = btn.getAttribute('data-st');
  if (!id) return;
  try {
    await api.patch('/complaints/'+id, { status: st });
    showToast('Статус обновлен','success');
    await loadComplaints();
  } catch(e) { showToast('Ошибка: '+(e.message||'не удалось'),'error'); }
}
</script>
</body>
</html>
