<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Стартап — LaunchPad</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .startup-hero{background:var(--bg2);border-bottom:1px solid var(--border);padding:calc(var(--nav-h) + 40px) 0 32px}
    .startup-hero__inner{display:flex;gap:24px;align-items:flex-start}
    .startup-logo{width:88px;height:88px;border-radius:20px;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:46px;flex-shrink:0}
    .startup-name{font-family:var(--font-head);font-size:32px;font-weight:800;letter-spacing:-1px;margin-bottom:6px}
    .startup-tagline{font-size:16px;color:var(--text2);margin-bottom:14px}
    .startup-meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .startup-layout{display:grid;grid-template-columns:1fr 300px;gap:24px;margin-top:28px}
    @media(max-width:900px){.startup-layout{grid-template-columns:1fr}.startup-hero__inner{flex-wrap:wrap}}
    .team-member{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
    .team-member:last-child{border-bottom:none}
    .update-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:14px}
    .update-card__title{font-family:var(--font-head);font-size:17px;font-weight:700;margin-bottom:4px}
    .update-card__date{font-size:12px;color:var(--text3);margin-bottom:12px}
    .update-card__body{font-size:14px;color:var(--text2);line-height:1.75;white-space:pre-wrap}
      .privacy-opt{border:2px solid var(--border2);border-radius:var(--radius);background:var(--bg3);transition:all .2s}
    .privacy-opt.selected{border-color:var(--accent);background:var(--accent-dim)}
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav__logo">Launch<span>Pad</span></a>
  <a href="startups.html">Стартапы</a>
  <div class="nav__user" id="navUser">
    <a href="login.html" class="btn btn--outline btn--sm">Войти</a>
    <a href="register.html" class="btn btn--primary btn--sm">Регистрация</a>
  </div>
</nav>

<div id="loadingState" style="padding:calc(var(--nav-h) + 80px) 0 80px;text-align:center">
  <div class="spinner"></div>
  <p style="color:var(--text2);margin-top:14px;font-size:14px">Загрузка стартапа...</p>
</div>

<div id="pageContent" style="display:none">
  <div class="startup-hero">
    <div class="container">
      <div class="startup-hero__inner">
        <div class="startup-logo" id="sLogo">🚀</div>
        <div style="flex:1;min-width:0">
          <h1 class="startup-name" id="sName"></h1>
          <p class="startup-tagline" id="sTagline"></p>
          <div class="startup-meta">
            <span class="badge badge--green" id="sStage"></span>
            <span class="badge badge--gray" id="sCategory"></span>
            <span id="sWebsite"></span>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-self:flex-start" id="actionBtns"></div>
      </div>
    </div>
  </div>

  <div class="page" style="padding-top:0">
    <div class="container">
      <div class="startup-layout">
        <!-- LEFT -->
        <div>
          <div class="tabs">
            <button class="tab active" onclick="switchTab(0,this)">О проекте</button>
            <button class="tab" onclick="switchTab(1,this)">Обновления</button>
            <button class="tab" onclick="switchTab(2,this)">Команда</button>
          </div>

          <!-- О проекте -->
          <div class="tab-panel active" id="panel0">
            <div class="card">
              <h3 style="font-family:var(--font-head);font-size:16px;margin-bottom:12px">Описание</h3>
              <p id="sDesc" style="color:var(--text2);font-size:14px;line-height:1.8;white-space:pre-wrap"></p>
              <div id="sLookingFor" style="display:none;margin-top:20px">
                <hr class="divider" style="margin:16px 0">
                <h4 style="font-family:var(--font-head);font-size:14px;margin-bottom:8px">🔍 Ищем в команду</h4>
                <p id="sLookingForText" style="color:var(--text2);font-size:14px"></p>
              </div>
            </div>
          </div>

          <!-- Обновления -->
          <div class="tab-panel" id="panel1">
            <div id="ownerUpdateBtn" style="display:none;margin-bottom:14px">
              <a id="addUpdateLink" href="#" class="btn btn--primary">+ Добавить обновление</a>
            </div>
            <div id="updatesList"><div class="spinner" style="margin:32px auto"></div></div>
          </div>

          <!-- Команда -->
          <div class="tab-panel" id="panel2">
            <div id="teamList"><div class="spinner" style="margin:32px auto"></div></div>
          </div>
        </div>

        <!-- RIGHT -->
        <div>
          <div class="card" style="margin-bottom:18px">
            <h3 style="font-family:var(--font-head);font-size:15px;margin-bottom:14px">Основатель</h3>
            <div id="ownerBlock"></div>
          </div>
          <div class="card" id="tagsCard" style="display:none">
            <h3 style="font-family:var(--font-head);font-size:15px;margin-bottom:12px">Теги</h3>
            <div id="tagsList" style="display:flex;flex-wrap:wrap;gap:8px"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Invite modal -->
<div class="modal-overlay" id="inviteModal">
  <div class="modal" style="max-width:560px">
    <div class="modal__header">
      <div class="modal__title">Подать заявку в команду</div>
      <button class="modal__close" onclick="closeModal()">×</button>
    </div>


    <div class="form-group">
      <label class="form-label">Кем откликаешься</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px">
        <div id="typeSpecBtn" class="privacy-opt selected" style="padding:12px;text-align:center;cursor:pointer" onclick="setApplyType('specialist')">
          <div style="font-size:22px;margin-bottom:4px">👤</div>
          <div style="font-size:13px;font-weight:600">Как специалист</div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px">от себя лично</div>
        </div>
        <div id="typeRoleBtn" class="privacy-opt" style="padding:12px;text-align:center;cursor:pointer" onclick="setApplyType('role')">
          <div style="font-size:22px;margin-bottom:4px">🏷️</div>
          <div style="font-size:13px;font-weight:600">По роли</div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px">например: Дизайнер из ООО</div>
        </div>
      </div>
    </div>

    <div id="roleNameRow" style="display:none" class="form-group">
      <label class="form-label">Роль из вашего стартапа</label>
      <select class="form-select" id="applyRole">
        <option value="">Загрузка...</option>
      </select>
      <div class="form-hint">Выберите роль из проектов, где вы участвуете или владеете</div>
    </div>

    <div class="form-group" style="margin-bottom:0">
      <label class="form-label">Сообщение / мини-резюме *</label>
      <textarea class="form-textarea" id="applyMsg" style="min-height:110px"
        placeholder="Расскажи о себе: опыт, что умеешь, почему хочешь в этот проект..."></textarea>
    </div>

    <button class="btn btn--primary" style="width:100%;justify-content:center;margin-top:16px" onclick="sendAllInvites()">Отправить заявку</button>
    <div id="inviteError" class="form-error" style="display:none;margin-top:10px"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
var startupId = getUrlParam('id');
if (!startupId) window.location.href = 'startups.html';

var startupData = null;
// Сохраняем пользователя глобально для всех функций
var pageUser     = null;
var pageUserData = null;

// ── TABS ──────────────────────────────────────────────
function switchTab(idx, btn) {
  document.querySelectorAll('.tab').forEach(function(t,i){ t.classList.toggle('active', i===idx); });
  document.querySelectorAll('.tab-panel').forEach(function(p,i){ p.classList.toggle('active', i===idx); });
}

function openInviteModal() { document.getElementById('inviteModal').classList.add('open'); }
function closeModal() { document.getElementById('inviteModal').classList.remove('open'); }

// ── INIT ──────────────────────────────────────────────
onAuthReady(async function(user, userData) {
  // Сохраняем глобально — все вложенные функции смогут использовать
  pageUser     = user;
  pageUserData = userData;

  try {
    // Загружаем стартап
    var snap = await db.collection('startups').doc(startupId).get();
    if (!snap.exists) { window.location.href = 'startups.html'; return; }
    startupData = Object.assign({ id: snap.id }, snap.data());

    // Обновляем nav
    var navUser = document.getElementById('navUser');
    if (user && userData) {
      var av = userData.avatar ||
        'https://ui-avatars.com/api/?background=181c24&color=00e676&name=' + encodeURIComponent(userData.name||'U');
      navUser.innerHTML =
        '<span class="nav__role nav__role--' + userData.role + '">' + (ROLE_LABELS[userData.role]||userData.role) + '</span>' +
        '<img class="nav__avatar" src="' + esc(av) + '" onclick="window.location.href='profile.html'"/>' +
        '<a href="dashboard.html" class="btn btn--ghost btn--sm">Дашборд</a>';
    }

    // Заполняем hero
    var logoEl = document.getElementById('sLogo');
    if (startupData.iconImage) {
      logoEl.innerHTML = '<img src="'+esc(startupData.iconImage)+'" style="width:100%;height:100%;object-fit:cover;border-radius:18px" onerror="this.style.display=&quot;none&quot;"/>';
    } else {
      logoEl.textContent = startupData.emoji || '🚀';
    }
    document.getElementById('sName').textContent    = startupData.name  || '';
    document.getElementById('sTagline').textContent = startupData.tagline || '';
    document.getElementById('sStage').textContent   = startupData.stage || 'Идея';
    document.getElementById('sCategory').textContent= startupData.category || '';
    document.title = (startupData.name || 'Стартап') + ' — LaunchPad';

    if (startupData.website) {
      document.getElementById('sWebsite').innerHTML =
        '<a href="' + esc(startupData.website) + '" target="_blank" style="color:var(--accent);font-size:13px">🔗 Сайт</a>';
    }

    // Описание — либо contentBlocks либо простой текст
    var descEl = document.getElementById('sDesc');
    var cBlocks = safeArray(startupData.contentBlocks).filter(function(b){ return b && b.content && b.content.trim(); });
    if (cBlocks.length) {
      descEl.innerHTML = cBlocks.map(function(b) {
        if (b.type === 'text') {
          return '<p style="color:var(--text2);font-size:14px;line-height:1.8;white-space:pre-wrap;margin-bottom:16px">' + esc(b.content||'') + '</p>';
        } else if (b.type === 'image' && b.content) {
          return '<img src="' + esc(b.content) + '" style="width:100%;border-radius:var(--radius);margin-bottom:16px;display:block" onerror="this.style.display=&quot;none&quot;"/>';
        } else if (b.type === 'video' && b.content) {
          return '<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:var(--radius);margin-bottom:16px">' +
            '<iframe src="' + esc(b.content) + '" style="position:absolute;top:0;left:0;width:100%;height:100%;border:0" allowfullscreen></iframe></div>';
        }
        return '';
      }).join('');
    } else {
      descEl.textContent = startupData.description || '';
    }

    // Обложка стартапа
    if (startupData.coverImage) {
      var coverEl = document.createElement('img');
      coverEl.src = startupData.coverImage;
      coverEl.style.cssText = 'width:100%;max-height:320px;object-fit:cover;border-radius:var(--radius-lg);margin-bottom:20px;display:block';
      coverEl.onerror = function(){ coverEl.remove(); };
      document.getElementById('panel0').querySelector('.card').insertBefore(coverEl, document.getElementById('sDesc'));
    }

    if (startupData.lookingFor) {
      document.getElementById('sLookingFor').style.display = 'block';
      document.getElementById('sLookingForText').textContent = startupData.lookingFor;
    }

    var tags = safeArray(startupData.tags);
    if (tags.length) {
      document.getElementById('tagsCard').style.display = 'block';
      document.getElementById('tagsList').innerHTML =
        tags.map(function(t){ return '<span class="badge badge--gray">' + esc(t) + '</span>'; }).join('');
    }

    // Проверка приватности
    var privacy   = startupData.privacy || 'public';
    var isTeamMember = false;
    if (user) {
      // Проверяем принят ли в команду
      try {
        var myInvSnap = await db.collection('invites')
          .where('fromUid','==', user.uid)
          .where('startupId','==', startupId)
          .where('status','==','accepted').get();
        isTeamMember = !myInvSnap.empty;
      } catch(e) {}
    }
    var isOwnerOrAdmin = user && (user.uid === startupData.ownerUid || (userData && userData.role === 'admin'));
    var hasFullAccess  = isOwnerOrAdmin || isTeamMember;

    if (privacy === 'private' && !hasFullAccess) {
      // Скрываем вкладки обновлений и команды
      document.querySelectorAll('.tab')[1].style.display = 'none';
      document.querySelectorAll('.tab')[2].style.display = 'none';
      // Показываем плашку
      var lockBanner = document.createElement('div');
      lockBanner.style.cssText = 'background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:14px 18px;font-size:13px;color:var(--text2);margin-bottom:16px;display:flex;align-items:center;gap:10px';
      lockBanner.innerHTML = '<span style="font-size:20px">🔒</span><span>Детали проекта доступны только участникам команды</span>';
      document.getElementById('panel0').querySelector('.card').appendChild(lockBanner);
    }

    // Кнопки действий — проверяем статус заявки текущего пользователя
    var userInviteStatus = null;
    if (user && userData && userData.role === 'user') {
      try {
        var invSnap = await db.collection('invites')
          .where('fromUid','==', user.uid)
          .where('startupId','==', startupId).get();
        if (!invSnap.empty) {
          // берём последнюю заявку
          userInviteStatus = invSnap.docs[invSnap.docs.length-1].data().status;
        }
      } catch(e) { /* игнорируем */ }
    }
    renderActions(user, userData, userInviteStatus);

    // Основатель
    await loadOwner();

    // Обновления и команда
    await loadUpdates();
    await loadTeam();

    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('pageContent').style.display  = 'block';

  } catch(e) {
    document.getElementById('loadingState').innerHTML =
      '<div class="empty-state"><div class="empty-state__icon">⚠️</div>' +
      '<div class="empty-state__title">Ошибка загрузки</div>' +
      '<p style="font-size:14px;color:var(--text2)">' + esc(e.message) + '</p>' +
      '<a href="startups.html" class="btn btn--outline" style="margin-top:16px">← Назад</a></div>';
  }
});

// ── ACTIONS ───────────────────────────────────────────
function renderActions(user, userData, inviteStatus) {
  var el      = document.getElementById('actionBtns');
  var isOwner = user && startupData && user.uid === startupData.ownerUid;
  var isAdmin = userData && userData.role === 'admin';
  var role    = userData && userData.role;

  if (isOwner || isAdmin) {
    el.innerHTML =
      '<a href="roadmap.html?id=' + startupId + '" class="btn btn--outline">🗺 Roadmap</a>' +
      '<a href="create-startup.html?edit=' + startupId + '" class="btn btn--outline">✏️ Редактировать</a>' +
      '<a href="update-startup.html?id='   + startupId + '" class="btn btn--primary">+ Обновление</a>';
    document.getElementById('ownerUpdateBtn').style.display = 'block';
    document.getElementById('addUpdateLink').href = 'update-startup.html?id=' + startupId;

  } else if (role === 'investor') {
    el.innerHTML =
      '<a href="roadmap.html?id=' + startupId + '" class="btn btn--ghost btn--sm">🗺 Roadmap</a>' +
      '<button class="btn btn--investor" onclick="writeToFounder()">💬 Написать основателю</button>';

  } else if (role === 'user') {
    if (inviteStatus === 'accepted') {
      el.innerHTML = '<span class="badge badge--green" style="padding:8px 16px;font-size:13px">✅ Ты в команде</span>';
    } else if (inviteStatus === 'pending') {
      el.innerHTML = '<span class="badge badge--gray" style="padding:8px 16px;font-size:13px">⏳ Заявка на рассмотрении</span>';
    } else if (inviteStatus === 'rejected') {
      el.innerHTML = '<span class="badge badge--red" style="padding:8px 16px;font-size:13px">❌ Заявка отклонена</span>';
    } else {
      el.innerHTML =
        '<a href="roadmap.html?id=' + startupId + '" class="btn btn--ghost btn--sm">🗺 Roadmap</a>' +
        '<button class="btn btn--primary" onclick="openInviteModal()">👋 Подать заявку</button>';
    }

  } else if (!user) {
    el.innerHTML =
      '<a href="login.html" class="btn btn--outline">Войти чтобы взаимодействовать</a>';
  }
}

// ── OWNER ─────────────────────────────────────────────
async function loadOwner() {
  if (!startupData) return;
  var snap  = await db.collection('users').doc(startupData.ownerUid).get();
  var owner = snap.exists ? snap.data() : { name: startupData.ownerName || 'Основатель', uid: startupData.ownerUid };
  var av    = owner.avatar ||
    'https://ui-avatars.com/api/?background=181c24&color=00e676&name=' + encodeURIComponent(owner.name||'U');

  document.getElementById('ownerBlock').innerHTML =
    '<a href="member.html?uid=' + esc(startupData.ownerUid) + '" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit">' +
      '<img src="' + esc(av) + '" class="avatar avatar--md"/>' +
      '<div>' +
        '<div style="font-size:14px;font-weight:600">' + esc(owner.name||'') + '</div>' +
        '<div style="font-size:12px;color:var(--accent);font-weight:600">Основатель</div>' +
      '</div>' +
    '</a>';
}

// ── UPDATES ───────────────────────────────────────────
async function loadUpdates() {
  var el = document.getElementById('updatesList');
  try {
    var snap = await db.collection('startups').doc(startupId)
      .collection('updates').orderBy('createdAt','desc').get();

    if (snap.empty) {
      el.innerHTML = '<div class="empty-state" style="padding:40px 0">' +
        '<div class="empty-state__icon">📢</div>' +
        '<div class="empty-state__title">Нет обновлений</div>' +
        '<p style="font-size:14px">Основатель ещё не публиковал новости</p></div>';
      return;
    }

    el.innerHTML = snap.docs.map(function(d) {
      var u = d.data();
      return '<div class="update-card">' +
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px">' +
          '<div class="update-card__title">' + esc(u.title||'') + '</div>' +
          (u.type ? '<span class="badge badge--green" style="flex-shrink:0">' + esc(u.type) + '</span>' : '') +
        '</div>' +
        '<div class="update-card__date">' + formatDate(u.createdAt) + '</div>' +
        '<div class="update-card__body">' + esc(u.body||'') + '</div>' +
        (u.imageUrl ? '<img src="' + esc(u.imageUrl) + '" style="width:100%;max-height:300px;object-fit:cover;border-radius:var(--radius);margin-top:12px;display:block" onerror="this.style.display=&quot;none&quot;"/>' : '') +
      '</div>';
    }).join('');
  } catch(e) {
    el.innerHTML = '<p style="color:var(--text3);font-size:14px;padding:20px 0">' + esc(e.message) + '</p>';
  }
}

// ── TEAM ──────────────────────────────────────────────
async function loadTeam() {
  var el = document.getElementById('teamList');
  try {
    var members = [];

    // Основатель всегда первый
    var ownerSnap = await db.collection('users').doc(startupData.ownerUid).get();
    if (ownerSnap.exists) {
      members.push(Object.assign({ _teamRole: 'Основатель', _isOwner: true }, ownerSnap.data()));
    } else {
      members.push({ name: startupData.ownerName||'Основатель', uid: startupData.ownerUid, _teamRole: 'Основатель', _isOwner: true });
    }

    // Участники из коллекции team
    var teamSnap = await db.collection('startups').doc(startupId).collection('team').get();
    var teamUids = [];
    for (var i = 0; i < teamSnap.docs.length; i++) {
      var t = teamSnap.docs[i].data();
      if (!t.uid) continue;
      teamUids.push(t.uid);
      try {
        var uSnap = await db.collection('users').doc(t.uid).get();
        if (uSnap.exists) {
          members.push(Object.assign({ _teamRole: t.role || 'Участник' }, uSnap.data()));
        }
      } catch(e) { /* пропускаем */ }
    }

    // Также показываем принятые invites (accepted) если ещё не в team
    try {
      var accSnap = await db.collection('invites')
        .where('startupId','==', startupId)
        .where('status','==','accepted').get();
      for (var j = 0; j < accSnap.docs.length; j++) {
        var inv = accSnap.docs[j].data();
        if (!inv.fromUid || inv.fromUid === startupData.ownerUid) continue;
        if (teamUids.indexOf(inv.fromUid) !== -1) continue;
        // Определяем роль из applications или поля role
        var invRole = 'Участник';
        if (inv.applications && inv.applications.length && inv.applications[0].role) {
          invRole = inv.applications[0].role;
        } else if (inv.role) {
          invRole = inv.role;
        }
        try {
          var iUsnap = await db.collection('users').doc(inv.fromUid).get();
          if (iUsnap.exists) {
            members.push(Object.assign({ _teamRole: invRole }, iUsnap.data()));
          }
        } catch(e) { /* пропускаем */ }
      }
    } catch(e) { /* invites недоступны */ }

    el.innerHTML = '<div class="card">' +
      members.map(function(m) {
        var av = m.avatar ||
          'https://ui-avatars.com/api/?background=181c24&color=00e676&name=' + encodeURIComponent(m.name||'U');
        // Используем pageUser — НЕ user из замыкания
        var isMe = pageUser && m.uid === pageUser.uid;
        var removeBtn = '';
        var editRoleBtn = '';
        if (!m._isOwner && pageUser && startupData &&
            (pageUser.uid === startupData.ownerUid || (pageUserData && pageUserData.role === 'admin'))) {
          removeBtn = '<button class="btn btn--danger btn--sm" onclick="removeFromTeam(this)" data-uid="' + esc(m.uid||'') + '" data-name="' + esc(m.name||'') + '">✕</button>';
          editRoleBtn = '<button class="btn btn--ghost btn--sm" onclick="editMemberRole(this)" data-uid="' + esc(m.uid||'') + '" data-name="' + esc(m.name||'') + '" data-role="' + esc(m._teamRole||'Участник') + '" title="Изменить должность">✏️</button>';
        }
        return '<div class="team-member">' +
          '<a href="member.html?uid=' + esc(m.uid||'') + '" style="display:contents">' +
            '<img src="' + esc(av) + '" class="avatar avatar--sm"/>' +
          '</a>' +
          '<div style="flex:1">' +
            '<div style="font-size:14px;font-weight:500">' + esc(m.name||'—') + (isMe?' <span style="font-size:11px;color:var(--text3)">(вы)</span>':'') + '</div>' +
            '<div style="font-size:12px;color:var(--text2)">' + esc(m._teamRole||'') + '</div>' +
          '</div>' +
          (m._isOwner ? '<span style="font-size:16px">👑</span>' : '<div style="display:flex;gap:4px">'+editRoleBtn+removeBtn+'</div>') +
        '</div>';
      }).join('') +
    '</div>';

  } catch(e) {
    el.innerHTML = '<p style="color:var(--text3);font-size:14px;padding:20px 0">' + esc(e.message) + '</p>';
  }
}

// ── INVITE ────────────────────────────────────────────
var currentApplyType = 'specialist';

function setApplyType(type) {
  currentApplyType = type;
  var specBtn = document.getElementById('typeSpecBtn');
  var roleBtn = document.getElementById('typeRoleBtn');
  var roleRow = document.getElementById('roleNameRow');
  if (type === 'specialist') {
    specBtn.className = 'privacy-opt selected';
    roleBtn.className = 'privacy-opt';
    roleRow.style.display = 'none';
  } else {
    specBtn.className = 'privacy-opt';
    roleBtn.className = 'privacy-opt selected';
    roleRow.style.display = 'block';
  }
}

function openInviteModal() {
  currentApplyType = 'specialist';
  setApplyType('specialist');
  document.getElementById('applyMsg').value = '';
  document.getElementById('inviteError').style.display = 'none';
  document.getElementById('inviteModal').classList.add('open');
  loadUserRoles();
}

async function loadUserRoles() {
  if (!pageUser) return;
  var sel = document.getElementById('applyRole');
  sel.innerHTML = '<option value="">Выберите роль...</option>';
  try {
    var roles = [];
    // Роли из стартапов где владелец
    var ownSnap = await db.collection('startups').where('ownerUid','==',pageUser.uid).get();
    ownSnap.docs.forEach(function(d) {
      var s = d.data();
      roles.push({ label: 'Основатель · ' + (s.name||''), value: 'Основатель · ' + (s.name||'') });
    });
    // Роли из принятых invites
    var invSnap = await db.collection('invites')
      .where('fromUid','==',pageUser.uid).where('status','==','accepted').get();
    invSnap.docs.forEach(function(d) {
      var inv = d.data();
      var role = '';
      if (inv.applications && inv.applications.length && inv.applications[0].role) {
        role = inv.applications[0].role;
      } else if (inv.role && inv.role !== 'Специалист') {
        role = inv.role;
      }
      if (role) {
        roles.push({ label: role + ' · ' + (inv.startupName||''), value: role + ' · ' + (inv.startupName||'') });
      }
    });
    if (!roles.length) {
      sel.innerHTML = '<option value="">Нет ролей (вступите в команду)</option>';
      return;
    }
    sel.innerHTML = '<option value="">Выберите роль...</option>' +
      roles.map(function(r){ return '<option value="'+esc(r.value)+'">'+esc(r.label)+'</option>'; }).join('');
  } catch(e) {
    sel.innerHTML = '<option value="">Ошибка загрузки</option>';
  }
}

function showInviteErr(msg) {
  var el = document.getElementById('inviteError');
  el.textContent = msg; el.style.display = 'block';
}

async function sendAllInvites() {
  if (!pageUser) { window.location.href = 'login.html'; return; }
  document.getElementById('inviteError').style.display = 'none';

  var msg  = document.getElementById('applyMsg').value.trim();
  var role = document.getElementById('applyRole').value || '';
  if (!msg) { showInviteErr('Напиши сообщение / мини-резюме'); return; }
  if (currentApplyType === 'role' && !role) { showInviteErr('Выбери роль из списка'); return; }

  try {
    // Проверяем дубль
    var existing = await db.collection('invites')
      .where('fromUid','==', pageUser.uid)
      .where('startupId','==', startupId).get();
    var alreadyApplied = existing.docs.some(function(d){
      var s = d.data().status;
      return s === 'pending' || s === 'accepted';
    });
    if (alreadyApplied) {
      var isAccepted = existing.docs.some(function(d){ return d.data().status === 'accepted'; });
      showToast(isAccepted ? '✅ Ты уже в команде этого стартапа' : '⏳ Заявка уже отправлена', 'warn');
      closeModal(); return;
    }

    var application = {
      type:    currentApplyType,  // 'specialist' или 'role'
      role:    role,              // роль если type=role
      message: msg
    };

    await db.collection('invites').add({
      fromUid:      pageUser.uid,
      fromName:     pageUserData ? pageUserData.name : '',
      fromAvatar:   pageUserData ? (pageUserData.avatar||'') : '',
      fromSkills:   pageUserData ? safeArray(pageUserData.skills) : [],
      startupId:    startupId,
      startupName:  startupData.name,
      startupOwner: startupData.ownerUid,
      applications: [application],
      role:         role || 'Специалист',
      message:      msg,
      status:       'pending',
      createdAt:    firebase.firestore.FieldValue.serverTimestamp()
    });

    closeModal();
    showToast('✅ Заявка отправлена!', 'success');
  } catch(e) {
    showInviteErr('Ошибка: ' + e.message);
  }
}

// ── INVESTOR: написать основателю ─────────────────────
async function writeToFounder() {
  if (!pageUser) { window.location.href = 'login.html'; return; }
  window.location.href = 'messages.html?to=' + startupData.ownerUid;
}

// ── HELPERS ───────────────────────────────────────────

// ── EDIT MEMBER ROLE ─────────────────────────────────
async function editMemberRole(btn) {
  var uid  = btn.getAttribute('data-uid');
  var name = btn.getAttribute('data-name');
  var cur  = btn.getAttribute('data-role') || 'Участник';
  var newRole = prompt('Должность для ' + name + ':', cur);
  if (!newRole || newRole.trim() === cur) return;
  newRole = newRole.trim();
  try {
    // Обновляем в subcollection team
    var teamSnap = await db.collection('startups').doc(startupId)
      .collection('team').where('uid','==',uid).get();
    if (!teamSnap.empty) {
      await teamSnap.docs[0].ref.update({ role: newRole });
    } else {
      // Участник через invite — обновляем invite.role и applications[0].role
      var invSnap = await db.collection('invites')
        .where('fromUid','==',uid).where('startupId','==',startupId)
        .where('status','==','accepted').get();
      if (!invSnap.empty) {
        var upd = { role: newRole };
        var inv = invSnap.docs[0].data();
        if (inv.applications && inv.applications.length) {
          var apps = inv.applications.slice();
          apps[0] = Object.assign({}, apps[0], { role: newRole });
          upd.applications = apps;
        }
        await invSnap.docs[0].ref.update(upd);
      }
    }
    showToast('Должность обновлена: ' + newRole, 'success');
    await loadTeam(); // перезагружаем команду
  } catch(e) { showToast('Ошибка: ' + e.message, 'error'); }
}

// ── REMOVE FROM TEAM ─────────────────────────────────
async function removeFromTeam(btn) {
  var uid  = btn.getAttribute('data-uid');
  var name = btn.getAttribute('data-name');
  if (!uid) return;
  if (!confirm('Удалить ' + name + ' из команды?')) return;
  try {
    // Удаляем из subcollection team
    var teamSnap = await db.collection('startups').doc(startupId)
      .collection('team').where('uid','==',uid).get();
    for (var i = 0; i < teamSnap.docs.length; i++) {
      await teamSnap.docs[i].ref.delete();
    }
    // Также меняем статус invite на removed
    var invSnap = await db.collection('invites')
      .where('fromUid','==',uid)
      .where('startupId','==',startupId).get();
    for (var j = 0; j < invSnap.docs.length; j++) {
      await invSnap.docs[j].ref.update({ status: 'removed' });
    }
    showToast(name + ' удалён из команды', 'success');
    await loadTeam();
  } catch(e) { showToast('Ошибка: ' + e.message, 'error'); }
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
