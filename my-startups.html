<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Мои стартапы — LaunchPad</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .s-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;display:flex;gap:20px;align-items:flex-start;margin-bottom:16px;transition:border-color .2s}
    .s-row:hover{border-color:var(--border2)}
    .s-logo{width:64px;height:64px;border-radius:16px;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0}
    .s-name{font-family:var(--font-head);font-size:18px;font-weight:700;margin-bottom:4px}
    .s-tagline{font-size:13px;color:var(--text2);margin-bottom:10px}
    .s-actions{margin-left:auto;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
    .s-stats{display:flex;gap:24px;margin-left:16px;padding-left:16px;border-left:1px solid var(--border);flex-shrink:0}
    .stat-mini{text-align:center}
    .stat-mini__num{font-family:var(--font-head);font-size:22px;font-weight:700;color:var(--accent)}
    .stat-mini__lbl{font-size:11px;color:var(--text3)}
    @media(max-width:700px){.s-row{flex-wrap:wrap}.s-stats{display:none}.s-actions{flex-direction:row;margin-left:0}}
  </style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav__logo">Launch<span>Pad</span></a>
  <div class="nav__user">
    <a href="dashboard.html" class="btn btn--ghost btn--sm">← Дашборд</a>
    <span class="nav__role nav__role--startup" id="navRole">Стартапер</span>
    <img class="nav__avatar" id="navAvatar" src="https://ui-avatars.com/api/?background=181c24&color=00e676&name=U" onclick="window.location.href='profile.html'"/>
    <button class="btn btn--ghost btn--sm" onclick="auth.signOut().then(function(){window.location.href='index.html'})">Выйти</button>
  </div>
</nav>

<div class="page">
  <div class="container--md">
    <div class="section-header" style="margin-bottom:32px">
      <div>
        <h1 class="page-title">Мои стартапы</h1>
        <p class="page-subtitle">Управляй своими проектами</p>
      </div>
      <a href="create-startup.html" class="btn btn--primary">+ Создать стартап</a>
    </div>
    <div id="content"><div class="spinner"></div><p style="text-align:center;color:var(--text2);margin-top:12px;font-size:14px">Загрузка...</p></div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
requireAuth('login.html');

onAuthReady(async function(user, userData) {
  if (!user) return;
  if (userData && userData.role !== 'startup' && userData.role !== 'admin') {
    window.location.href = 'dashboard.html'; return;
  }
  renderNav(userData);

  var el = document.getElementById('content');
  try {
    // Загружаем без сортировки (избегаем составного индекса)
    var snap = await db.collection('startups').where('ownerUid','==',user.uid).get();
    var startups = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    // Сортируем на клиенте
    startups.sort(function(a,b){
      var ta = a.createdAt && a.createdAt.seconds ? a.createdAt.seconds : 0;
      var tb = b.createdAt && b.createdAt.seconds ? b.createdAt.seconds : 0;
      return tb - ta;
    });

    if (!startups.length) {
      el.innerHTML = '<div class="empty-state"><div class="empty-state__icon">🚀</div><div class="empty-state__title">Ещё нет стартапов</div><p style="font-size:14px;margin-bottom:24px">Создай первый проект и начни привлекать команду</p><a href="create-startup.html" class="btn btn--primary btn--lg">Создать первый стартап</a></div>';
      return;
    }

    var html = '';
    for (var i = 0; i < startups.length; i++) {
      var s = startups[i];
      // Параллельно грузим статистику
      var teamSnap, updSnap, invSnap;
      try {
        var results = await Promise.all([
          db.collection('startups').doc(s.id).collection('team').get(),
          db.collection('startups').doc(s.id).collection('updates').get(),
          db.collection('invites').where('startupOwner','==',user.uid).get()
        ]);
        teamSnap = results[0]; updSnap = results[1]; invSnap = results[2];
      } catch(e) {
        teamSnap = {size:0}; updSnap = {size:0}; invSnap = {docs:[]};
      }
      var pendingInvites = invSnap.docs
        ? invSnap.docs.filter(function(d){ return d.data().startupId===s.id && d.data().status==='pending'; }).length
        : 0;

      html += '<div class="s-row">' +
        '<div class="s-logo">' + (s.emoji||'🚀') + '</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div class="s-name">' + esc(s.name||'') + '</div>' +
          '<div class="s-tagline">' + esc(s.tagline||'') + '</div>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
            '<span class="badge badge--green">' + esc(s.stage||'Идея') + '</span>' +
            '<span class="badge badge--gray">' + esc(s.category||'') + '</span>' +
            (pendingInvites > 0 ? '<span class="badge badge--red">📩 '+pendingInvites+' заявок</span>' : '') +
          '</div>' +
        '</div>' +
        '<div class="s-stats">' +
          '<div class="stat-mini"><div class="stat-mini__num">' + ((teamSnap.size||0)+1) + '</div><div class="stat-mini__lbl">В команде</div></div>' +
          '<div class="stat-mini"><div class="stat-mini__num">' + (updSnap.size||0) + '</div><div class="stat-mini__lbl">Обновлений</div></div>' +
        '</div>' +
        '<div class="s-actions">' +
          '<a href="startup.html?id=' + s.id + '" class="btn btn--outline btn--sm">👁 Открыть</a>' +
          '<a href="update-startup.html?id=' + s.id + '" class="btn btn--primary btn--sm">+ Обновление</a>' +
          '<a href="create-startup.html?edit=' + s.id + '" class="btn btn--ghost btn--sm">✏️ Редактировать</a>' +
          '<button class="btn btn--danger btn--sm" onclick="del(\'' + s.id + '\',\'' + esc(s.name||'') + '\')">✕ Удалить</button>' +
        '</div>' +
      '</div>';
    }
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div class="empty-state"><div class="empty-state__icon">⚠️</div><div class="empty-state__title">Ошибка загрузки</div><p style="font-size:14px">' + e.message + '</p></div>';
  }
});

async function del(id, name) {
  if (!confirm('Удалить стартап "' + name + '"? Это действие нельзя отменить.')) return;
  try {
    await db.collection('startups').doc(id).delete();
    showToast('Стартап удалён', 'success');
    setTimeout(function(){ location.reload(); }, 800);
  } catch(e) {
    showToast('Ошибка: ' + e.message, 'error');
  }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
