<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Мои стартапы — LaunchPad</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .s-row{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:14px;transition:border-color .2s}
    .s-row:hover{border-color:var(--border2)}
    .s-row__top{display:flex;gap:16px;align-items:flex-start}
    .s-logo{width:60px;height:60px;border-radius:14px;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;overflow:hidden}
    .s-logo img{width:100%;height:100%;object-fit:cover}
    .s-name{font-family:var(--font-head);font-size:18px;font-weight:700;margin-bottom:4px}
    .s-tagline{font-size:13px;color:var(--text2);margin-bottom:10px}
    .s-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    /* Invite cards */
    .inv-incoming{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
    .inv-incoming__body{flex:1;min-width:0}
    .inv-incoming__name{font-size:14px;font-weight:600;margin-bottom:2px}
    .inv-incoming__type{font-size:12px;color:var(--text2);margin-bottom:4px}
    .inv-incoming__msg{font-size:12px;color:var(--text3);line-height:1.5}
    .inv-incoming__btns{display:flex;gap:6px;margin-top:8px}
    /* Team member row */
    .team-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
    .team-row:last-child{border-bottom:none}
    .team-row__role{font-size:12px;color:var(--accent);cursor:pointer}
    .team-row__role:hover{text-decoration:underline}
    /* Collapsible sections */
    .section-toggle{display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:8px 0;margin-bottom:8px;user-select:none}
    .section-toggle__arrow{color:var(--text3);font-size:13px;transition:transform .2s}
    .mini-stat{text-align:center}
    .mini-stat__num{font-family:var(--font-head);font-size:22px;font-weight:700;color:var(--accent)}
    .mini-stat__lbl{font-size:11px;color:var(--text3)}
    .stats-sep{display:flex;gap:20px;border-left:1px solid var(--border);padding-left:16px;margin-left:8px}
  </style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav__logo">Launch<span>Pad</span></a>
  <a href="forum.html">Форум</a>
  <div class="nav__user">
    <span class="nav__role" id="navRole"></span>
    <img class="nav__avatar" id="navAvatar" src="https://ui-avatars.com/api/?background=181c24&color=00e676&name=U" onclick="goProfile()"/>
    <a href="dashboard.html" class="btn btn--ghost btn--sm">← Дашборд</a>
    <button class="btn btn--ghost btn--sm" onclick="auth.signOut().then(function(){window.location.href='index.html'})">Выйти</button>
  </div>
</nav>

<div class="page">
  <div class="container--md">
    <div class="section-header" style="margin-bottom:28px">
      <div>
        <h1 class="page-title">Мои стартапы</h1>
        <p class="page-subtitle">Управляй проектами и командой</p>
      </div>
      <a href="create-startup.html" class="btn btn--primary" id="createStartupBtn" style="display:none">+ Создать стартап</a>
    </div>
    <div id="content"><div class="spinner"></div></div>
  </div>
</div>

<!-- Accept invite modal -->
<div class="modal-overlay" id="acceptModal">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title" id="acceptModalName">Принять в команду</div>
      <button class="modal__close" onclick="document.getElementById('acceptModal').classList.remove('open')">×</button>
    </div>
    <div class="form-group" style="margin-bottom:0">
      <label class="form-label">Роль в команде *</label>
      <input type="text" class="form-input" id="acceptRoleInput" placeholder="Разработчик, Дизайнер, CTO..."/>
      <div class="form-hint">Укажите должность участника в проекте</div>
    </div>
    <button class="btn btn--primary" style="width:100%;justify-content:center;margin-top:16px" onclick="confirmAccept()">✅ Принять</button>
  </div>
</div>

<!-- Edit role modal -->
<div class="modal-overlay" id="editRoleModal">
  <div class="modal">
    <div class="modal__header">
      <div class="modal__title">Изменить роль</div>
      <button class="modal__close" onclick="document.getElementById('editRoleModal').classList.remove('open')">×</button>
    </div>
    <p id="editRoleName" style="color:var(--text2);font-size:14px;margin-bottom:16px"></p>
    <div class="form-group">
      <label class="form-label">Роль / должность</label>
      <input type="text" class="form-input" id="editRoleInput" placeholder="Дизайнер, Разработчик, CTO..."/>
    </div>
    <div class="form-group" style="margin-bottom:0">
      <label class="form-label">Доступ к функциям</label>
      <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px">
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer">
          <input type="checkbox" id="permKanban" style="accent-color:var(--accent);width:16px;height:16px"/>
          🗺 Доступ к Kanban / Roadmap
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer">
          <input type="checkbox" id="permUpdates" style="accent-color:var(--accent);width:16px;height:16px"/>
          📢 Публикация обновлений
        </label>
        <label style="display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer">
          <input type="checkbox" id="permTeam" style="accent-color:var(--accent);width:16px;height:16px"/>
          👥 Управление командой
        </label>
      </div>
    </div>
    <button class="btn btn--primary" style="width:100%;justify-content:center;margin-top:16px" onclick="saveEditRole()">Сохранить</button>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="api-config.js"></script>
<script>
requireAuth('login.html');

var editRoleCtx = null; // {startupId, uid, inviteId, currentRole}

var myRole = 'user'; // глобально для использования в empty state

onAuthReady(async function(user, userData) {
  if (!user) return;
  renderNav(userData);
  myRole = userData ? userData.role : 'user';
  // Кнопка "Создать" — только для стартапера и эксперта
  var cb = document.getElementById('createStartupBtn');
  if (cb && (myRole === 'startup' || myRole === 'expert' || myRole === 'admin')) {
    cb.style.display = '';
  }

  var el = document.getElementById('content');
  try {
    // Мои стартапы (владелец)
    var snap = await db.collection('startups').where('ownerUid','==',user.uid).get();
    var myStartups = snap.docs.map(function(d){ return Object.assign({id:d.id, _isOwner:true}, d.data()); });
    myStartups.sort(function(a,b){
      return ((b.createdAt&&b.createdAt.seconds)||0) - ((a.createdAt&&a.createdAt.seconds)||0);
    });

    // Стартапы где участвую (accepted invites)
    var participatingStartups = [];
    try {
      var invSnap = await db.collection('invites')
        .where('fromUid','==',user.uid).where('status','==','accepted').get();
      for (var ii = 0; ii < invSnap.docs.length; ii++) {
        var inv = invSnap.docs[ii].data();
        if (!inv.startupId) continue;
        // Не дублируем свои стартапы
        if (myStartups.find(function(s){ return s.id===inv.startupId; })) continue;
        try {
          var sSnap = await db.collection('startups').doc(inv.startupId).get();
          if (sSnap.exists) {
            var role = 'Участник';
            if (inv.applications&&inv.applications.length&&inv.applications[0].role) role=inv.applications[0].role;
            else if (inv.role&&inv.role!=='Специалист') role=inv.role;
            participatingStartups.push(Object.assign({id:sSnap.id,_isOwner:false,_myRole:role}, sSnap.data()));
          }
        } catch(e3){}
      }
    } catch(e2){ console.warn('invites:', e2.message); }

    var allVisible = myStartups.concat(participatingStartups);

    if (!allVisible.length) {
      var canCreate = myRole === 'startup' || myRole === 'expert' || myRole === 'admin';
      el.innerHTML = '<div class="empty-state"><div class="empty-state__icon">🚀</div>' +
        '<div class="empty-state__title">Нет стартапов</div>' +
        '<p style="font-size:14px;margin-bottom:24px">' +
          (canCreate ? 'Создай первый проект или подай заявку' : 'Подай заявку в команду стартапа') +
        '</p>' +
        (canCreate ? '<a href="create-startup.html" class="btn btn--primary btn--lg">Создать стартап</a>' : '') +
        '<a href="startups.html" class="btn btn--outline btn--lg" style="margin-left:12px">Найти стартап</a>' +
        '</div>';
      return;
    }

    var html = '';
    // Мои стартапы — полная карточка
    for (var i = 0; i < myStartups.length; i++) {
      html += await buildStartupCard(myStartups[i], user.uid);
    }
    // Участие — компактная карточка
    if (participatingStartups.length) {
      html += '<h3 class="section-title" style="margin:24px 0 14px">Участвую в проектах</h3>';
      participatingStartups.forEach(function(s) {
        var logo = s.iconImage
          ? '<img src="'+esc(s.iconImage)+'" style="width:100%;height:100%;object-fit:cover;border-radius:inherit" onerror="this.style.display=&quot;none&quot;"/>'
          : esc(s.emoji||'🚀');
        html += '<div class="s-row" style="display:flex;gap:16px;align-items:center">'+
          '<div class="s-logo">'+logo+'</div>'+
          '<div style="flex:1">'+
            '<div class="s-name">'+esc(s.name||'')+'</div>'+
            '<div style="font-size:13px;color:var(--accent);font-weight:500">'+esc(s._myRole)+'</div>'+
            '<div style="display:flex;gap:8px;margin-top:6px">'+
              '<span class="badge badge--green">'+esc(s.stage||'Идея')+'</span>'+
            '</div>'+
          '</div>'+
          '<div style="display:flex;gap:8px">'+
            '<a href="startup.html?id='+s.id+'" class="btn btn--outline btn--sm">👁 Открыть</a>'+
          '</div>'+
        '</div>';
      });
    }
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = '<div class="empty-state"><div class="empty-state__icon">⚠️</div><div class="empty-state__title">Ошибка</div><p>'+esc(e.message)+'</p></div>';
  }
});

async function buildStartupCard(s, uid) {
  var logo = s.iconImage
    ? '<img src="'+esc(s.iconImage)+'" onerror="this.style.display=&quot;none&quot;"/>'
    : esc(s.emoji||'🚀');
  var privBadge = s.privacy==='private'?'<span class="badge badge--gray" style="font-size:11px">🔒 Частный</span>'
    : s.privacy==='closed'?'<span class="badge badge--gray" style="font-size:11px">🔐 Закрытый</span>':'';

  // Статистика
  var teamSnap, updSnap, pendInvSnap;
  try {
    var results = await Promise.all([
      db.collection('startups').doc(s.id).collection('team').get(),
      db.collection('startups').doc(s.id).collection('updates').get(),
      db.collection('invites').where('startupOwner','==',uid).get()
    ]);
    teamSnap = results[0]; updSnap = results[1]; pendInvSnap = results[2];
  } catch(e) { teamSnap={size:0,docs:[]}; updSnap={size:0}; pendInvSnap={docs:[]}; }

  var pendingInvites = pendInvSnap.docs
    ? pendInvSnap.docs.filter(function(d){ return d.data().startupId===s.id && d.data().status==='pending' && d.data().type!=='from_startup'; })
    : [];

  // Команда (владелец + участники через team + через accepted invites)
  var teamMembers = [];
  if (teamSnap.docs) {
    teamSnap.docs.forEach(function(d){
      var td = d.data();
      // После _toCamel: user_uid → userUid; name приходит из JOIN с users
      var memberUid = td.userUid || td.user_uid || td.uid || '';
      if (!memberUid) return;
      teamMembers.push({
        uid:    memberUid,
        name:   td.name || '',
        role:   td.role || 'Участник',
        src:    'team',
        docId:  memberUid  // используем uid пользователя как docId для DELETE
      });
    });
  }
  try {
    var accInvs = await db.collection('invites').where('startupId','==',s.id).where('status','==','accepted').get();
    accInvs.docs.forEach(function(d){
      var inv=d.data();
      if (!inv.fromUid) return;
      if (teamMembers.find(function(m){return m.uid===inv.fromUid;})) return;
      var role='Участник';
      if (inv.applications&&inv.applications.length&&inv.applications[0].role) role=inv.applications[0].role;
      else if (inv.role&&inv.role!=='Специалист') role=inv.role;
      teamMembers.push({uid:inv.fromUid,name:inv.fromName||'',role:role,src:'invite',inviteId:d.id});
    });
  } catch(e){}

  // HTML
  var teamHtml = teamMembers.length ? teamMembers.map(function(m){
    var av = 'https://ui-avatars.com/api/?background=181c24&color=00e676&name='+encodeURIComponent(m.name||'U');
    return '<div class="team-row">'+
      '<img src="'+av+'" class="avatar avatar--sm"/>'+
      '<div style="flex:1;min-width:0"><div style="font-size:13px;font-weight:500">'+esc(m.name||'—')+'</div>'+
      '<div class="team-row__role" data-action="editrole" data-sid="'+esc(s.id)+'" data-uid="'+esc(m.uid)+'" data-name="'+esc(m.name)+'" data-role="'+esc(m.role)+'" data-src="'+esc(m.src)+'" data-docid="'+esc(m.inviteId||m.docId||'')+'">'+esc(m.role)+' ✏️</div></div>'+
      '<button class="btn btn--danger btn--sm" data-action="remove" data-sid="'+esc(s.id)+'" data-uid="'+esc(m.uid)+'" data-src="'+esc(m.src)+'" data-docid="'+esc(m.inviteId||m.docId||'')+'">✕</button>'+
    '</div>';
  }).join('') : '<p style="font-size:13px;color:var(--text3)">Пока нет участников</p>';

  var pendHtml = pendingInvites.length ? pendingInvites.map(function(d){
    var inv=d.data();
    var typeMap={specialist:'👤 Специалист',role:'🏷️ По роли',company:'🏢 Компания',freelance:'💻 Фрилансер',partner:'🤝 Партнёр'};
    var apps = inv.applications&&inv.applications.length ? inv.applications : null;
    var appsHtml = apps ? apps.map(function(app){
      return '<div style="background:var(--bg);border-radius:6px;padding:6px 10px;margin-bottom:4px">'+
        '<div style="font-size:12px;font-weight:600;color:var(--text2)">'+(typeMap[app.type]||app.type)+(app.role?' · '+esc(app.role):'')+'</div>'+
        '<div style="font-size:12px;color:var(--text3)">'+esc((app.message||'').substring(0,100))+'</div>'+
      '</div>';
    }).join('') : '<div style="font-size:12px;color:var(--text3)">'+esc(inv.message||'')+'</div>';

    var av = inv.fromAvatar || 'https://ui-avatars.com/api/?background=181c24&color=00e676&name='+encodeURIComponent(inv.fromName||'U');
    return '<div class="inv-incoming">'+
      '<img src="'+esc(av)+'" class="avatar avatar--sm"/>'+
      '<div class="inv-incoming__body">'+
        '<div class="inv-incoming__name"><a href="member.html?uid='+esc(inv.fromUid||'')+'" style="color:inherit;text-decoration:none">'+esc(inv.fromName||'—')+'</a></div>'+
        appsHtml+
        '<div class="inv-incoming__btns">'+
          '<button class="btn btn--primary btn--sm" data-action="accept" data-iid="'+esc(d.id)+'" data-sid="'+esc(s.id)+'">✓ Принять</button>'+
          '<button class="btn btn--outline btn--sm" data-action="reject" data-iid="'+esc(d.id)+'" data-sid="'+esc(s.id)+'">✕ Отклонить</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('') : '';

  var pendSection = pendingInvites.length
    ? '<div style="margin-top:16px">'+
        '<div class="section-toggle" onclick="toggleSection(this)">'+
          '<div style="font-size:14px;font-weight:600;font-family:var(--font-head)">📩 Заявки ('+pendingInvites.length+')</div>'+
          '<span class="section-toggle__arrow">▾</span>'+
        '</div>'+
        '<div>'+pendHtml+'</div>'+
      '</div>'
    : '';

  var teamSection =
    '<div style="margin-top:14px">'+
      '<div class="section-toggle" onclick="toggleSection(this)">'+
        '<div style="font-size:14px;font-weight:600;font-family:var(--font-head)">👥 Команда ('+teamMembers.length+')</div>'+
        '<span class="section-toggle__arrow">▾</span>'+
      '</div>'+
      '<div class="card" style="padding:14px">'+teamHtml+'</div>'+
    '</div>';

  return '<div class="s-row" id="srow-'+s.id+'">'+
    '<div class="s-row__top">'+
      '<div class="s-logo">'+logo+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div class="s-name">'+esc(s.name||'')+'</div>'+
        '<div class="s-tagline">'+esc(s.tagline||'')+'</div>'+
        '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
          '<span class="badge badge--green">'+esc(s.stage||'Идея')+'</span>'+
          '<span class="badge badge--gray">'+esc(s.category||'')+'</span>'+
          privBadge+
          (pendingInvites.length?'<span class="badge badge--red">'+pendingInvites.length+' заявок</span>':'')+
        '</div>'+
      '</div>'+
      '<div class="stats-sep">'+
        '<div class="mini-stat"><div class="mini-stat__num">'+(teamMembers.length+1)+'</div><div class="mini-stat__lbl">В команде</div></div>'+
        '<div class="mini-stat"><div class="mini-stat__num">'+(updSnap.size||0)+'</div><div class="mini-stat__lbl">Обновлений</div></div>'+
      '</div>'+
    '</div>'+
    '<div class="s-actions">'+
      '<a href="startup.html?id='+s.id+'" class="btn btn--outline btn--sm">👁 Открыть</a>'+
      '<a href="update-startup.html?id='+s.id+'" class="btn btn--primary btn--sm">+ Обновление</a>'+
      '<a href="roadmap.html?id='+s.id+'" class="btn btn--ghost btn--sm">🗺 Roadmap</a>'+
      '<a href="create-startup.html?edit='+s.id+'" class="btn btn--ghost btn--sm">✏️ Редактировать</a>'+
      '<button class="btn btn--danger btn--sm" data-action="delstartup" data-sid="'+esc(s.id)+'" data-name="'+esc(s.name||'')+'">✕ Удалить</button>'+
    '</div>'+
    pendSection+
    teamSection+
  '</div>';
}

// ── TOGGLE SECTION ────────────────────────────────────
function toggleSection(header) {
  var body   = header.nextElementSibling;
  var arrow  = header.querySelector('.section-toggle__arrow');
  var hidden = body.style.display === 'none';
  body.style.display = hidden ? '' : 'none';
  if (arrow) arrow.textContent = hidden ? '▾' : '▸';
}

// ── ANSWER INVITE ─────────────────────────────────────
// Контекст для модального принятия
var acceptCtx = null;

function openAcceptModal(inviteId, startupId, fromName, suggestedRole, fromUid) {
  acceptCtx = { inviteId, startupId, fromName: fromName || '', fromUid: fromUid || '' };
  document.getElementById('acceptModalName').textContent = 'Принять ' + fromName + ' в команду';
  document.getElementById('acceptRoleInput').value = suggestedRole || '';
  document.getElementById('acceptModal').classList.add('open');
}

async function confirmAccept() {
  if (!acceptCtx) return;
  var role = document.getElementById('acceptRoleInput').value.trim() || 'Участник';
  try {
    // PATCH /invites/:id с status=accepted автоматически добавляет человека в команду
    await api.patch('/invites/' + acceptCtx.inviteId, { status: 'accepted', role: role });
    document.getElementById('acceptModal').classList.remove('open');
    showToast('✅ ' + acceptCtx.fromName + ' принят как «' + role + '»', 'success');
    setTimeout(function(){ location.reload(); }, 700);
  } catch(e) { showToast('Ошибка: ' + e.message, 'error'); }
}

async function answerInvite(inviteId, status, startupId) {
  if (status === 'accepted') {
    try {
      // Получаем данные заявки через API
      var invData = await api.get('/invites/' + inviteId);
      var inv = invData.invite || invData;
      var suggestedRole = '';
      if (inv.applications && inv.applications.length && inv.applications[0].role) {
        suggestedRole = inv.applications[0].role;
      } else if (inv.role && inv.role !== 'Специалист') {
        suggestedRole = inv.role;
      }
      var fromUid  = inv.fromUid  || inv.from_uid  || '';
      var fromName = inv.fromName || inv.from_name || 'участника';
      openAcceptModal(inviteId, startupId, fromName, suggestedRole, fromUid);
    } catch(e) { showToast('Ошибка: ' + e.message, 'error'); }
    return;
  }
  try {
    await api.patch('/invites/' + inviteId, { status: status });
    showToast('❌ Отклонено', 'success');
    setTimeout(function(){ location.reload(); }, 700);
  } catch(e) { showToast('Ошибка: ' + e.message, 'error'); }
}

// ── EDIT ROLE ─────────────────────────────────────────
function openEditRole(startupId, uid, name, role, src, docId) {
  editRoleCtx = { startupId, uid, name, role, src, docId };
  document.getElementById('editRoleName').textContent = 'Участник: ' + name;
  document.getElementById('editRoleInput').value = role;
  // Загружаем текущие разрешения
  loadMemberPerms(src, docId);
  document.getElementById('editRoleModal').classList.add('open');
}

async function loadMemberPerms(src, docId) {
  var perms = {};
  try {
    var snap = src === 'team'
      ? await db.collection('startups').doc(editRoleCtx.startupId).collection('team').doc(docId).get()
      : await db.collection('invites').doc(docId).get();
    if (snap.exists) perms = snap.data().permissions || {};
  } catch(e) {}
  document.getElementById('permKanban').checked  = !!perms.kanban;
  document.getElementById('permUpdates').checked = !!perms.updates;
  document.getElementById('permTeam').checked    = !!perms.team;
}
async function saveEditRole() {
  if (!editRoleCtx) return;
  var newRole = document.getElementById('editRoleInput').value.trim();
  if (!newRole) { showToast('Введи роль','error'); return; }
  var permissions = {
    kanban:  document.getElementById('permKanban').checked,
    updates: document.getElementById('permUpdates').checked,
    team:    document.getElementById('permTeam').checked
  };
  try {
    if (editRoleCtx.src === 'team') {
      await db.collection('startups').doc(editRoleCtx.startupId).collection('team').doc(editRoleCtx.docId).update({ role: newRole, permissions: permissions });
    } else {
      var upd = { role: newRole, permissions: permissions };
      var invSnap = await db.collection('invites').doc(editRoleCtx.docId).get();
      if (invSnap.exists && invSnap.data().applications) {
        var apps = invSnap.data().applications.slice();
        if (apps[0]) apps[0] = Object.assign({},apps[0],{role:newRole});
        upd.applications = apps;
      }
      await db.collection('invites').doc(editRoleCtx.docId).update(upd);
    }
    document.getElementById('editRoleModal').classList.remove('open');
    showToast('Роль и права обновлены','success');
    setTimeout(function(){ location.reload(); }, 700);
  } catch(e) { showToast('Ошибка: '+e.message,'error'); }
}

// ── REMOVE MEMBER ─────────────────────────────────────
async function removeMember(startupId, uid, src, docId) {
  if (!confirm('Удалить участника из команды?')) return;
  try {
    if (src === 'team') {
      // docId = user_uid участника, DELETE /startups/:id/team/:uid
      await api.delete('/startups/' + startupId + '/team/' + (docId || uid));
    } else {
      // Для invite-участников: отклоняем заявку
      await api.patch('/invites/' + docId, { status: 'rejected' });
    }
    showToast('Участник удалён', 'success');
    setTimeout(function(){ location.reload(); }, 700);
  } catch(e) { showToast('Ошибка: ' + e.message, 'error'); }
}

// ── DELETE STARTUP ────────────────────────────────────
async function delStartup(id, name) {
  if (!confirm('Удалить стартап «'+name+'»?')) return;
  try {
    await db.collection('startups').doc(id).delete();
    showToast('Стартап удалён','success');
    setTimeout(function(){ location.reload(); }, 700);
  } catch(e) { showToast('Ошибка: '+e.message,'error'); }
}

// Event delegation для кнопок в карточках
document.addEventListener('click', function(e) {
  var btn = e.target.closest('[data-action]');
  if (!btn) return;
  var action = btn.getAttribute('data-action');
  if (action === 'editrole') {
    openEditRole(btn.getAttribute('data-sid'), btn.getAttribute('data-uid'),
      btn.getAttribute('data-name'), btn.getAttribute('data-role'),
      btn.getAttribute('data-src'), btn.getAttribute('data-docid'));
  } else if (action === 'remove') {
    removeMember(btn.getAttribute('data-sid'), btn.getAttribute('data-uid'),
      btn.getAttribute('data-src'), btn.getAttribute('data-docid'));
  } else if (action === 'accept') {
    answerInvite(btn.getAttribute('data-iid'), 'accepted', btn.getAttribute('data-sid'));
  } else if (action === 'reject') {
    answerInvite(btn.getAttribute('data-iid'), 'rejected', btn.getAttribute('data-sid'));
  } else if (action === 'delstartup') {
    delStartup(btn.getAttribute('data-sid'), btn.getAttribute('data-name'));
  }
});

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
