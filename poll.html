<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Опрос — LaunchPad</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .poll-wrap{max-width:560px;margin:0 auto;padding:0 20px}
    .poll-opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--border2);border-radius:var(--radius);margin-bottom:10px;cursor:pointer;transition:border-color .2s,background .2s;font-size:15px}
    .poll-opt:hover{border-color:var(--accent)}
    .poll-opt.selected{border-color:var(--accent);background:var(--accent-dim)}
    .poll-opt input{width:18px;height:18px;accent-color:var(--accent)}
    .res-row{margin-bottom:12px}
    .res-head{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
    .res-bar{height:12px;background:var(--bg3);border-radius:6px;overflow:hidden}
    .res-fill{height:100%;background:var(--accent);border-radius:6px;transition:width .5s}
    .res-mine{color:var(--accent);font-weight:600}
  </style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav__logo">Launch<span>Pad</span></a>
  <div class="nav__user" id="navUser">
    <a href="login.html" class="btn btn--outline btn--sm">Войти</a>
  </div>
</nav>

<div class="page">
  <div class="poll-wrap">
    <div id="loadingState" style="padding:100px 0;text-align:center"><div class="spinner"></div></div>
    <div id="pollContent" style="display:none">
      <div class="card">
        <div id="pollStatus" style="font-size:12px;color:var(--text3);margin-bottom:8px"></div>
        <h1 style="font-family:var(--font-head);font-size:22px;font-weight:800;line-height:1.3;margin-bottom:6px" id="pollQuestion"></h1>
        <div style="font-size:13px;color:var(--text2);margin-bottom:12px" id="pollBy"></div>
        <div id="pollDesc" style="font-size:14px;color:var(--text2);line-height:1.6;white-space:pre-wrap;margin-bottom:16px"></div>
        <div id="pollArea"></div>
        <div id="pollMsg" style="font-size:13px;color:var(--text3);margin-top:14px"></div>
        <div id="ownerBar" style="display:none;gap:8px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)"></div>
      </div>
    </div>
    <div id="errState" style="display:none;padding:80px 0;text-align:center">
      <div style="font-size:40px;margin-bottom:12px">🗳️</div>
      <div style="font-family:var(--font-head);font-size:18px;font-weight:700" id="errTitle">Опрос не найден</div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="api-config.js"></script>
<script>
var pollId = getUrlParam('id');
var poll = null;
var selectedIdx = -1;

if (!pollId) { showErr('Опрос не найден'); }

onAuthReady(async function(user, userData) {
  var nu = document.getElementById('navUser');
  if (user && userData) {
    var av = userData.avatar || 'https://ui-avatars.com/api/?background=181c24&color=00e676&name='+encodeURIComponent(userData.name||'U');
    nu.innerHTML = '<a href="dashboard.html" class="btn btn--ghost btn--sm">Дашборд</a><img class="nav__avatar" src="'+esc(av)+'"/>';
  }
  if (pollId) await loadPoll();
});

async function loadPoll() {
  try {
    var data = await api.get('/polls/' + pollId);
    poll = data.poll;
    render();
  } catch(e) { showErr(e.code===404 ? 'Опрос не найден' : 'Не удалось загрузить'); }
}

function votedLocally() { try { return localStorage.getItem('poll_voted_'+pollId) === '1'; } catch(e){ return false; } }
function markVotedLocally() { try { localStorage.setItem('poll_voted_'+pollId, '1'); } catch(e){} }

var selected = {}; // qi -> oi

function render() {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('pollContent').style.display = 'block';
  var qs = poll.questions || [];
  document.getElementById('pollQuestion').textContent = qs.length > 1 ? ('🗳️ Опрос · ' + qs.length + ' вопроса') : (qs[0] ? qs[0].question : 'Опрос');
  document.getElementById('pollBy').textContent = 'Автор: ' + (poll.owner_name || '—');
  // Описание одиночного вопроса — под заголовком (у мультивопросов описание рядом с каждым)
  document.getElementById('pollDesc').textContent = (qs.length === 1 && qs[0]) ? (qs[0].desc || '') : '';
  document.getElementById('pollStatus').textContent =
    (poll.status === 'closed' ? '🔒 Опрос закрыт' : '🟢 Опрос открыт') +
    ' · ' + (poll.audience === 'registered' ? 'только для зарегистрированных' : 'для всех');

  var alreadyVoted = poll.voted || votedLocally();
  var canSee = poll.canSeeResults !== false; // автор/админ или разрешён показ

  if (poll.isOwnerOrAdmin) {
    renderResults();
  } else if (poll.status === 'open' && !alreadyVoted) {
    renderVoting();
  } else if (canSee) {
    renderResults();
  } else {
    renderHidden(alreadyVoted);
  }

  if (poll.isOwnerOrAdmin) {
    var bar = document.getElementById('ownerBar');
    bar.style.display = 'flex';
    bar.innerHTML =
      (poll.status === 'open'
        ? '<button class="btn btn--outline btn--sm" onclick="closePoll()">🔒 Закрыть опрос</button>'
        : '<button class="btn btn--outline btn--sm" onclick="openPoll()">🟢 Открыть снова</button>') +
      '<button class="btn btn--ghost btn--sm" onclick="copyLink()">🔗 Скопировать ссылку</button>' +
      '<button class="btn btn--danger btn--sm" onclick="deletePoll()">🗑 Удалить</button>';
  }
}

function qHeading(qi, q) {
  var qs = poll.questions || [];
  if (qs.length <= 1) return '';
  var descHtml = (q && q.desc)
    ? '<div style="font-size:13px;color:var(--text2);line-height:1.5;margin:-6px 0 12px;white-space:pre-wrap">'+esc(q.desc)+'</div>'
    : '';
  return '<div style="font-family:var(--font-head);font-size:16px;font-weight:700;margin:'+(qi?'22px':'4px')+' 0 '+(descHtml?'6px':'12px')+'">'+(qi+1)+'. '+esc(q.question)+'</div>'+descHtml;
}

function renderVoting() {
  if (poll.audience === 'registered' && !currentUser) {
    document.getElementById('pollArea').innerHTML =
      '<div style="font-size:14px;color:var(--text2);margin-bottom:14px">Голосовать могут только зарегистрированные пользователи.</div>'+
      '<a href="login.html" class="btn btn--primary">Войти</a>';
    return;
  }
  var qs = poll.questions || [];
  var html = qs.map(function(q, qi) {
    return qHeading(qi, q) +
      q.options.map(function(o, oi) {
        return '<label class="poll-opt" data-q="'+qi+'" data-o="'+oi+'" onclick="selectQ('+qi+','+oi+')">'+
          '<input type="radio" name="q'+qi+'" value="'+oi+'"/> <span>'+esc(o)+'</span></label>';
      }).join('');
  }).join('');
  html += '<button class="btn btn--primary btn--lg" style="width:100%;justify-content:center;margin-top:12px" onclick="vote()">Проголосовать</button>';
  document.getElementById('pollArea').innerHTML = html;
}

function selectQ(qi, oi) {
  selected[qi] = oi;
  document.querySelectorAll('.poll-opt[data-q="'+qi+'"]').forEach(function(el){
    el.classList.toggle('selected', parseInt(el.getAttribute('data-o'),10) === oi);
  });
  var r = document.querySelector('.poll-opt[data-q="'+qi+'"][data-o="'+oi+'"] input'); if (r) r.checked = true;
}

async function vote() {
  var qs = poll.questions || [];
  var votes = [];
  for (var qi = 0; qi < qs.length; qi++) {
    if (selected[qi] === undefined) { showToast('Ответь на все вопросы','warn'); return; }
    votes.push({ question: qi, option: selected[qi] });
  }
  try {
    var res = await api.post('/polls/'+pollId+'/vote', { votes: votes });
    poll.myVotes = qs.map(function(q, qi){ return selected[qi]; });
    poll.voted = true;
    markVotedLocally();
    showToast('Голос учтён!','success');
    // Показываем результаты, только если автор разрешил
    if (res.canSeeResults !== false && res.results) {
      poll.results = res.results;
      renderResults();
    } else {
      renderHidden(true);
    }
  } catch(e) { showToast(e.message || 'Не удалось проголосовать','error'); }
}

function renderHidden(voted) {
  document.getElementById('pollArea').innerHTML =
    '<div style="text-align:center;padding:24px 0;color:var(--text2)">'+
      '<div style="font-size:38px;margin-bottom:10px">'+(voted?'✅':'🔒')+'</div>'+
      '<div style="font-size:15px;font-weight:600">'+(voted?'Спасибо, голос учтён!':'Голосование недоступно')+'</div>'+
      '<div style="font-size:13px;color:var(--text3);margin-top:6px">Результаты видны только автору опроса.</div>'+
    '</div>';
  document.getElementById('pollMsg').textContent = '';
}

function renderResults() {
  var qs = poll.questions || [];
  var results = poll.results || [];
  var myVotes = poll.myVotes || [];
  var html = qs.map(function(q, qi) {
    var r = results[qi] || { counts: [], total: 0 };
    var total = r.total || 0;
    return qHeading(qi, q) + q.options.map(function(o, oi) {
      var c = (r.counts && r.counts[oi]) || 0;
      var pct = total ? Math.round(c/total*100) : 0;
      var mine = (myVotes[qi] === oi);
      return '<div class="res-row">'+
        '<div class="res-head"><span'+(mine?' class="res-mine"':'')+'>'+esc(o)+(mine?' ✓':'')+'</span>'+
          '<span style="color:var(--text2)">'+pct+'% · '+c+'</span></div>'+
        '<div class="res-bar"><div class="res-fill" style="width:'+pct+'%"></div></div>'+
      '</div>';
    }).join('') + (qs.length>1 ? '<div style="font-size:12px;color:var(--text3);margin-top:2px">Голосов: '+total+'</div>' : '');
  }).join('');
  document.getElementById('pollArea').innerHTML = html;
  var grand = results.reduce(function(a,r){ return Math.max(a, r.total||0); }, 0);
  document.getElementById('pollMsg').textContent = qs.length>1 ? '' : ('Всего голосов: ' + grand);
}

async function closePoll() {
  try { await api.patch('/polls/'+pollId, { status:'closed' }); poll.status='closed'; showToast('Опрос закрыт','success'); render(); }
  catch(e){ showToast('Ошибка: '+e.message,'error'); }
}
async function openPoll() {
  try { await api.patch('/polls/'+pollId, { status:'open' }); poll.status='open'; showToast('Опрос открыт','success'); render(); }
  catch(e){ showToast('Ошибка: '+e.message,'error'); }
}
async function deletePoll() {
  if (!confirm('Удалить опрос? Это действие необратимо.')) return;
  try { await api.delete('/polls/'+pollId); showToast('Опрос удалён','success'); setTimeout(function(){ window.location.href='dashboard.html'; },700); }
  catch(e){ showToast('Ошибка: '+e.message,'error'); }
}
function copyLink() {
  var url = window.location.href;
  navigator.clipboard.writeText(url).then(function(){ showToast('🔗 Ссылка скопирована','success'); },
    function(){ showToast('Скопируй ссылку из адресной строки','warn'); });
}

function showErr(t) {
  document.getElementById('loadingState').style.display = 'none';
  document.getElementById('pollContent').style.display = 'none';
  var e = document.getElementById('errState'); e.style.display='block';
  document.getElementById('errTitle').textContent = t;
}
</script>
</body>
</html>
