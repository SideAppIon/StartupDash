<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Обновление стартапа — LaunchPad</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .img-preview{width:100%;max-height:300px;object-fit:cover;border-radius:var(--radius);border:1px solid var(--border2);margin-top:8px;display:none}
    .img-preview.show{display:block}
    .update-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;margin-bottom:14px}
    .update-card__title{font-family:var(--font-head);font-size:17px;font-weight:700;margin-bottom:4px}
    .update-card__date{font-size:12px;color:var(--text3);margin-bottom:10px}
    .update-card__body{font-size:14px;color:var(--text2);line-height:1.75;white-space:pre-wrap;margin-bottom:10px}
    .update-card__img{width:100%;max-height:300px;object-fit:cover;border-radius:var(--radius);margin-top:8px;display:block}
  </style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav__logo">Launch<span>Pad</span></a>
  <a href="forum.html">Форум</a>
  <div class="nav__user">
    <img class="nav__avatar" id="navAvatar" src="https://ui-avatars.com/api/?background=181c24&color=00e676&name=U"/>
    <button class="btn btn--ghost btn--sm" onclick="auth.signOut().then(function(){window.location.href='index.html'})">Выйти</button>
  </div>
</nav>

<div class="page">
  <div class="container--sm">
    <div style="margin-bottom:28px">
      <a id="backLink" href="dashboard.html" style="color:var(--text2);font-size:14px;text-decoration:none">← К стартапу</a>
      <h1 class="page-title" style="margin-top:12px">Новое обновление</h1>
      <p class="page-subtitle" id="startupNameLabel">Загрузка...</p>
    </div>

    <div class="card">
      <div class="form-group">
        <label class="form-label">Заголовок *</label>
        <input type="text" class="form-input" id="titleInput" placeholder="MVP готов! Первые 100 пользователей" maxlength="120"/>
      </div>

      <div class="form-group">
        <label class="form-label">Тип обновления</label>
        <select class="form-select" id="typeSelect">
          <option value="">Общее</option>
          <option value="Milestone">🏆 Milestone</option>
          <option value="MVP">⚡ MVP</option>
          <option value="Партнёрство">🤝 Партнёрство</option>
          <option value="Финансирование">💰 Финансирование</option>
          <option value="Команда">👥 Команда</option>
          <option value="Запуск">🚀 Запуск</option>
          <option value="Пресса">📰 Пресса</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Содержание *</label>
        <textarea class="form-textarea" id="bodyInput" style="min-height:200px"
          placeholder="Расскажи что произошло, какие результаты, что дальше..."></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">Фото (ссылка на изображение)</label>
        <input type="url" class="form-input" id="imageInput"
          placeholder="https://i.imgur.com/..."
          oninput="previewImage(this.value)"/>
        <div class="form-hint">Загрузи фото на imgur.com и вставь прямую ссылку (.jpg, .png)</div>
        <img id="imgPreview" class="img-preview" alt="Превью"/>
      </div>

      <div id="formError" class="form-error" style="display:none;margin-bottom:12px"></div>

      <div style="display:flex;gap:12px;justify-content:flex-end">
        <a id="cancelLink" href="dashboard.html" class="btn btn--ghost">Отмена</a>
        <button class="btn btn--primary btn--lg" id="submitBtn" onclick="postUpdate()">📢 Опубликовать</button>
      </div>
    </div>

    <div style="margin-top:40px">
      <h2 class="section-title" style="margin-bottom:20px">Предыдущие обновления</h2>
      <div id="prevUpdates"><div class="spinner"></div></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
requireAuth('login.html');

var startupId   = getUrlParam('id');
var startupData = null;
if (!startupId) window.location.href='dashboard.html';

document.getElementById('backLink').href   = 'startup.html?id='+startupId;
document.getElementById('cancelLink').href = 'startup.html?id='+startupId;

function previewImage(url) {
  var img = document.getElementById('imgPreview');
  if (url && url.startsWith('http')) {
    img.src = url;
    img.className = 'img-preview show';
    img.onerror = function(){ img.className='img-preview'; };
  } else {
    img.className = 'img-preview';
  }
}

onAuthReady(async function(user, userData) {
  if (!user) return;
  // Владелец любой роли может постить обновления
  var av = userData&&userData.avatar||'https://ui-avatars.com/api/?background=181c24&color=00e676&name=U';
  document.getElementById('navAvatar').src = av;

  var snap = await db.collection('startups').doc(startupId).get();
  if (!snap.exists){window.location.href='dashboard.html';return;}
  startupData = Object.assign({id:snap.id}, snap.data());

  var isOwner = startupData.ownerUid===user.uid || (userData&&userData.role==='admin');
  var hasUpdatesPermission = false;
  if (!isOwner) {
    // Проверяем permission updates через team или invite
    try {
      var teamSnap = await db.collection('startups').doc(startupId).collection('team').where('uid','==',user.uid).get();
      if (!teamSnap.empty && teamSnap.docs[0].data().permissions && teamSnap.docs[0].data().permissions.updates) hasUpdatesPermission = true;
    } catch(e){}
    try {
      var invSnap2 = await db.collection('invites').where('fromUid','==',user.uid).where('startupId','==',startupId).where('status','==','accepted').get();
      if (!invSnap2.empty && invSnap2.docs[0].data().permissions && invSnap2.docs[0].data().permissions.updates) hasUpdatesPermission = true;
    } catch(e){}
  }
  if (!isOwner && !hasUpdatesPermission){
    window.location.href='startup.html?id='+startupId; return;
  }
  document.getElementById('startupNameLabel').textContent = startupData.name;

  // Предыдущие обновления
  var updSnap = await db.collection('startups').doc(startupId)
    .collection('updates').orderBy('createdAt','desc').limit(5).get();
  var prevEl = document.getElementById('prevUpdates');
  if (updSnap.empty) {
    prevEl.innerHTML='<div class="empty-state" style="padding:32px"><div class="empty-state__icon">📋</div><div class="empty-state__title">Нет обновлений</div></div>';
  } else {
    prevEl.innerHTML = updSnap.docs.map(function(d){
      var u=d.data();
      return '<div class="update-card">'+
        '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px">'+
          '<div class="update-card__title">'+esc(u.title||'')+'</div>'+
          (u.type?'<span class="badge badge--green">'+esc(u.type)+'</span>':'')+
        '</div>'+
        '<div class="update-card__date">'+formatDate(u.createdAt)+'</div>'+
        '<div class="update-card__body">'+esc(u.body||'').substring(0,200)+(u.body&&u.body.length>200?'...':'')+'</div>'+
        (u.imageUrl?'<img src="'+esc(u.imageUrl)+'" class="update-card__img" onerror="this.style.display=&quot;none&quot;"/>':'')+
      '</div>';
    }).join('');
  }
});

async function postUpdate() {
  var title = document.getElementById('titleInput').value.trim();
  var body  = document.getElementById('bodyInput').value.trim();
  var image = document.getElementById('imageInput').value.trim();
  var type  = document.getElementById('typeSelect').value;
  var btn   = document.getElementById('submitBtn');
  var err   = document.getElementById('formError');
  err.style.display='none';
  if (!title){showFormErr('Введи заголовок');return;}
  if (!body) {showFormErr('Напиши содержание');return;}
  btn.disabled=true; btn.textContent='Публикация...';
  try {
    var data = {
      title, body, type,
      authorUid:  currentUser.uid,
      authorName: currentUserData.name,
      createdAt:  firebase.firestore.FieldValue.serverTimestamp()
    };
    if (image&&image.startsWith('http')) data.imageUrl = image;

    await db.collection('startups').doc(startupId).collection('updates').add(data);
    await db.collection('startups').doc(startupId).update({
      lastUpdate: firebase.firestore.FieldValue.serverTimestamp()
    });
    showToast('Обновление опубликовано!','success');
    setTimeout(function(){window.location.href='startup.html?id='+startupId;},800);
  } catch(e){
    showFormErr('Ошибка: '+e.message);
    btn.disabled=false; btn.textContent='📢 Опубликовать';
  }
}

function showFormErr(msg){
  var el=document.getElementById('formError');
  el.textContent=msg; el.style.display='block';
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
</body>
</html>
