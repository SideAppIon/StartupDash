<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Дашборд — LaunchPad</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="stylesheet" href="styles.css"/>
  <style>
    .dash-grid{display:grid;grid-template-columns:280px 1fr;gap:24px}
    @media(max-width:900px){.dash-grid{grid-template-columns:1fr}}
    .sidebar-profile{text-align:center;padding:24px}
    .sidebar-profile img{width:80px;height:80px;border-radius:50%;object-fit:cover;background:var(--bg3);border:3px solid var(--border2);display:block;margin:0 auto 14px}
    .sidebar-profile__name{font-family:var(--font-head);font-size:17px;font-weight:700}
    .sidebar-profile__email{font-size:12px;color:var(--text2);margin-bottom:10px}
    .sidebar-links{border-top:1px solid var(--border)}
    .sidebar-links a{display:flex;align-items:center;gap:10px;padding:12px 20px;color:var(--text2);text-decoration:none;font-size:14px;transition:all .15s;border-left:2px solid transparent}
    .sidebar-links a:hover{color:var(--text);background:var(--bg3);border-left-color:var(--border2)}
    .sidebar-links a.active{color:var(--accent);background:var(--accent-dim);border-left-color:var(--accent)}
    .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
    .stat-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;text-align:center}
    .stat-box__num{font-family:var(--font-head);font-size:30px;font-weight:800;color:var(--accent)}
    .stat-box__lbl{font-size:12px;color:var(--text2);margin-top:4px}
    .s-card{display:flex;gap:14px;align-items:flex-start;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-bottom:12px;text-decoration:none;color:inherit;transition:border-color .2s;cursor:pointer}
    .s-card:hover{border-color:var(--accent)}
    .s-card a[style*="display:contents"]{flex:1;display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:inherit}
    .s-card__logo{width:48px;height:48px;border-radius:12px;background:var(--bg3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
    .s-card__name{font-family:var(--font-head);font-size:15px;font-weight:700;margin-bottom:3px}
    .s-card__tagline{font-size:13px;color:var(--text2)}
    .inv-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 18px;margin-bottom:10px;display:flex;align-items:center;gap:14px}
    .inv-card__info{flex:1;min-width:0}
    .inv-card__name{font-size:14px;font-weight:500}
    .inv-card__sub{font-size:12px;color:var(--text2)}
  </style>
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav__logo">Launch<span>Pad</span></a>
  <a href="startups.html">Стартапы</a>
  <a href="feed.html">Лента</a>
  <a href="forum.html">Форум</a>
  <a href="members.html">Участники</a>
  <div class="nav__user">
    <a href="messages.html" style="font-size:20px;text-decoration:none">💬</a>
    <span class="nav__role" id="navRole"></span>
    <img class="nav__avatar" id="navAvatar" src="https://ui-avatars.com/api/?background=181c24&color=00e676&name=U" onclick="window.location.href='profile.html'"/>
    <button class="btn btn--ghost btn--sm" onclick="auth.signOut().then(function(){window.location.href='index.html'})">Выйти</button>
  </div>
</nav>

<div class="page">
  <div class="container">
    <div class="dash-grid">
      <!-- Sidebar -->
      <div>
        <div class="card" style="padding:0;overflow:hidden">
          <div class="sidebar-profile">
            <img id="sideAvatar" src="https://ui-avatars.com/api/?background=181c24&color=00e676&name=U"/>
            <div class="sidebar-profile__name" id="sideName">—</div>
            <div class="sidebar-profile__email" id="sideEmail">—</div>
            <span class="nav__role" id="sideRole"></span>
          </div>
          <div class="sidebar-links" id="sideLinks"></div>
        </div>
      </div>
      <!-- Main -->
      <div id="main">
        <div class="spinner"></div>
        <p style="text-align:center;color:var(--text2);margin-top:12px;font-size:14px">Загрузка дашборда...</p>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
requireAuth('login.html');

var NAV = {
  startup:  [{i:'🏠',l:'Дашборд',h:'dashboard.html'},{i:'📰',l:'Лента',h:'feed.html'},{i:'🚀',l:'Мои стартапы',h:'my-startups.html'},{i:'➕',l:'Создать стартап',h:'create-startup.html'},{i:'💬',l:'Сообщения',h:'messages.html'},{i:'👤',l:'Мой профиль',h:'profile.html'}],
  investor: [{i:'🏠',l:'Дашборд',h:'dashboard.html'},{i:'📰',l:'Лента',h:'feed.html'},{i:'🔍',l:'Стартапы',h:'startups.html'},{i:'💬',l:'Сообщения',h:'messages.html'},{i:'👤',l:'Мой профиль',h:'profile.html'}],
  user:     [{i:'🏠',l:'Дашборд',h:'dashboard.html'},{i:'📰',l:'Лента',h:'feed.html'},{i:'🚀',l:'Мои стартапы',h:'my-startups.html'},{i:'➕',l:'Создать стартап',h:'create-startup.html'},{i:'🔍',l:'Стартапы',h:'startups.html'},{i:'👥',l:'Участники',h:'members.html'},{i:'💬',l:'Сообщения',h:'messages.html'},{i:'👤',l:'Мой профиль',h:'profile.html'}],
  admin:    [{i:'🏠',l:'Дашборд',h:'dashboard.html'},{i:'📰',l:'Лента',h:'feed.html'},{i:'👥',l:'Все пользователи',h:'admin.html'},{i:'🚀',l:'Все стартапы',h:'startups.html'},{i:'💬',l:'Сообщения',h:'messages.html'}]
};

onAuthReady(async function(user, userData) {
  if (!user) return;

  // Создаём документ если не существует
  if (!userData) {
    await db.collection('users').doc(user.uid).set({
      uid: user.uid, name: user.email.split('@')[0],
      email: user.email, role: 'user',
      bio:'', skills:[], avatar:'',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    var s2 = await db.collection('users').doc(user.uid).get();
    userData = s2.data();
  }

  var role = userData.role || 'user';
  var av   = userData.avatar ||
    'https://ui-avatars.com/api/?background=181c24&color=00e676&name=' + encodeURIComponent(userData.name||'U');

  renderNav(userData);

  document.getElementById('sideName').textContent  = userData.name  || '—';
  document.getElementById('sideEmail').textContent = userData.email || '—';
  document.getElementById('sideAvatar').src = av;
  var sr = document.getElementById('sideRole');
  sr.textContent = ROLE_LABELS[role]||role; sr.className='nav__role nav__role--'+role;

  var links = NAV[role]||NAV.user;
  document.getElementById('sideLinks').innerHTML = links.map(function(l){
    return '<a href="'+l.h+'" '+(l.h==='dashboard.html'?'class="active"':'')+'>'+l.i+' '+l.l+'</a>';
  }).join('');

  var main = document.getElementById('main');
  try {
    if (role==='startup')  await renderStartup(main, user.uid);
    else if (role==='investor') await renderInvestor(main);
    else if (role==='admin')    await renderAdmin(main);
    else                         await renderUser(main, user.uid);
  } catch(e) {
    main.innerHTML = '<div class="empty-state"><div class="empty-state__icon">⚠️</div><div class="empty-state__title">Ошибка загрузки</div><p style="font-size:14px">'+e.message+'</p><button class="btn btn--outline" onclick="location.reload()">Попробовать снова</button></div>';
  }
});

async function renderStartup(el, uid) {
  var snap    = await db.collection('startups').where('ownerUid','==',uid).get();
  var startups = snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });

  var invSnap = await db.collection('invites').where('startupOwner','==',uid).get();
  var invites = invSnap.docs.filter(function(d){ return d.data().status==='pending' && d.data().type !== 'from_startup'; }).map(function(d){ return Object.assign({id:d.id},d.data()); });

  el.innerHTML =
    '<div class="stat-row">' +
      '<div class="stat-box"><div class="stat-box__num">'+startups.length+'</div><div class="stat-box__lbl">Мои стартапы</div></div>' +
      '<div class="stat-box"><div class="stat-box__num" id="teamTotal">...</div><div class="stat-box__lbl">В командах</div></div>' +
      '<div class="stat-box"><div class="stat-box__num">'+invites.length+'</div><div class="stat-box__lbl">Заявок</div></div>' +
    '</div>' +
    '<div class="section-header" style="margin-bottom:16px">' +
      '<div class="section-title">Мои стартапы</div>' +
      '<a href="create-startup.html" class="btn btn--primary btn--sm">+ Создать</a>' +
    '</div>' +
    (startups.length ? startups.map(function(s){
      var privBadge = s.privacy==='private'?'<span class="badge badge--gray" style="font-size:11px">🔒 Частный</span>':s.privacy==='closed'?'<span class="badge badge--gray" style="font-size:11px">🔐 Закрытый</span>':'';
      return '<div class="s-card" style="display:flex;position:relative">' +
        '<a href="startup.html?id='+s.id+'" style="display:contents;text-decoration:none;color:inherit">' +
        '<div class="s-card__logo">'+(s.iconImage?'<img src="'+s.iconImage+'" style="width:100%;height:100%;object-fit:cover;border-radius:inherit" onerror="this.style.display=&quot;none&quot;"/>':'')+(s.iconImage?'':(s.emoji||'🚀'))+'</div>' +
        '<div style="flex:1"><div class="s-card__name">'+esc(s.name||'')+'</div><div class="s-card__tagline">'+esc(s.tagline||'')+'</div>' +
        '<div style="display:flex;gap:6px;margin-top:8px"><span class="badge badge--green">'+esc(s.stage||'Идея')+'</span>'+privBadge+'</div></div>' +
        '</a>' +
        '<a href="create-startup.html?edit='+s.id+'" class="btn btn--ghost btn--sm" style="align-self:flex-start;flex-shrink:0;margin-left:8px" onclick="event.stopPropagation()">✏️</a>' +
      '</div>';
    }).join('') :
      '<div class="empty-state"><div class="empty-state__icon">🚀</div><div class="empty-state__title">Ещё нет стартапов</div><a href="create-startup.html" class="btn btn--primary" style="margin-top:16px">Создать стартап</a></div>'
    ) +
    (invites.length ?
      '<hr class="divider"><div class="section-header" style="margin-bottom:16px"><div class="section-title">Заявки в команду</div></div>' +
      invites.map(function(inv){
        return '<div class="inv-card">' +
          '<img src="'+(inv.fromAvatar||'https://ui-avatars.com/api/?background=181c24&color=00e676&name=U')+'" class="avatar avatar--sm"/>' +
          '<div class="inv-card__info"><div class="inv-card__name">'+esc(inv.fromName||'')+'</div><div class="inv-card__sub">→ '+esc(inv.startupName||'')+'</div>' +
          (inv.applications && inv.applications.length
            ? inv.applications.map(function(app){
                var tl={specialist:'👤 Специалист',company:'🏢 Компания',freelance:'💻 Фрилансер',partner:'🤝 Партнёр'};
                return '<div style="font-size:12px;color:var(--text2);margin-top:4px;padding:6px 10px;background:var(--bg3);border-radius:6px">'+
                  '<strong>'+(tl[app.type]||app.type)+(app.role?' · '+esc(app.role):'')+'</strong><br>'+
                  esc(app.message.substring(0,80))+(app.message.length>80?'...':'')+'</div>';
              }).join('')
            : (inv.message?'<div style="font-size:12px;color:var(--text3);margin-top:2px">'+esc(inv.message)+'</div>':'')
          )+'</div>' +
          '<div style="display:flex;gap:6px">' +
            '<button class="btn btn--primary btn--sm" data-iid="'+inv.id+'" data-st="accepted" onclick="answer(this)">✓</button>' +
            '<button class="btn btn--outline btn--sm" data-iid="'+inv.id+'" data-st="rejected" onclick="answer(this)">✕</button>' +
          '</div></div>';
      }).join('')
    : '');

  // Считаем команды
  var total = 0;
  for (var i=0; i<startups.length; i++) {
    try { var t = await db.collection('startups').doc(startups[i].id).collection('team').get(); total+=t.size; } catch(e){}
  }
  var tt = document.getElementById('teamTotal');
  if (tt) tt.textContent = total;
}

async function renderInvestor(el) {
  var snap = await db.collection('startups').orderBy('createdAt','desc').limit(10).get();
  var list = snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); })
    .filter(function(s){ return s.privacy !== 'closed'; }); // закрытые не показываем
  el.innerHTML = '<div class="section-header" style="margin-bottom:16px"><div class="section-title">Свежие стартапы</div><a href="startups.html" class="btn btn--outline btn--sm">Все</a></div>' +
    list.slice(0,8).map(function(s){
      var privBadge = s.privacy==='private'?'<span class="badge badge--gray" style="font-size:11px">🔒</span>':'';
      return '<a class="s-card" href="startup.html?id='+s.id+'" style="display:flex">' +
        '<div class="s-card__logo">'+(s.iconImage?'<img src="'+s.iconImage+'" style="width:100%;height:100%;object-fit:cover;border-radius:inherit" onerror="this.style.display=&quot;none&quot;"/>':'')+(s.iconImage?'':(s.emoji||'🚀'))+'</div>' +
        '<div><div class="s-card__name">'+esc(s.name||'')+' '+privBadge+'</div><div class="s-card__tagline">'+esc(s.tagline||'')+'</div></div></a>';
    }).join('');
}

async function renderUser(el, uid) {
  var snap = await db.collection('startups').orderBy('createdAt','desc').limit(6).get();
  var list = snap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); })
    .filter(function(s){ return s.privacy !== 'closed'; }).slice(0,4);
  var iSnap = await db.collection('invites').where('fromUid','==',uid).get();
  var invs  = iSnap.docs.map(function(d){ return Object.assign({id:d.id},d.data()); });

  var invitesHtml = '';
  if (invs.length) {
    var invRows = invs.map(function(inv){
      var icon = inv.status==='pending'?'⏳':inv.status==='accepted'?'✅':'❌';
      var apps = inv.applications && inv.applications.length ? inv.applications : null;
      var roleHint = apps && apps[0] && apps[0].role ? ' · <span style="color:var(--accent)">'+esc(apps[0].role)+'</span>' : '';
      return '<div class="inv-card"><div style="font-size:22px">'+icon+'</div>'+
        '<div class="inv-card__info">'+
          '<div class="inv-card__name">'+esc(inv.startupName||'')+roleHint+'</div>'+
          '<div class="inv-card__sub">'+(inv.status==='pending'?'Ожидает рассмотрения':inv.status==='accepted'?'Принята ✅':'Отклонена ❌')+'</div>'+
        '</div></div>';
    }).join('');

    invitesHtml = '<hr class="divider">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:4px 0;margin-bottom:12px" onclick="toggleMyInvites(this)">'+
        '<div class="section-title">Мои заявки ('+invs.length+')</div>'+
        '<span id="myInvitesToggle" style="color:var(--text3);font-size:13px;transition:transform .2s">▾</span>'+
      '</div>'+
      '<div id="myInvitesList">'+invRows+'</div>';
  }

  el.innerHTML =
    '<div class="section-header" style="margin-bottom:16px"><div class="section-title">Стартапы</div>'+
    '<div style="display:flex;gap:8px"><a href="create-startup.html" class="btn btn--primary btn--sm">+ Создать</a><a href="startups.html" class="btn btn--outline btn--sm">Все</a></div></div>' +
    list.map(function(s){
      return '<a class="s-card" href="startup.html?id='+s.id+'" style="display:flex">'+
        '<div class="s-card__logo">'+(s.iconImage?'<img src="'+s.iconImage+'" style="width:100%;height:100%;object-fit:cover;border-radius:inherit" onerror="this.style.display=&quot;none&quot;"/>':'')+(s.iconImage?'':(s.emoji||'🚀'))+'</div>'+
        '<div><div class="s-card__name">'+esc(s.name||'')+'</div><div class="s-card__tagline">'+esc(s.tagline||'')+'</div></div></a>';
    }).join('') + invitesHtml;
}

async function renderAdmin(el) {
  var u = await db.collection('users').get();
  var s = await db.collection('startups').get();
  el.innerHTML = '<div class="stat-row"><div class="stat-box"><div class="stat-box__num">'+u.size+'</div><div class="stat-box__lbl">Пользователей</div></div><div class="stat-box"><div class="stat-box__num">'+s.size+'</div><div class="stat-box__lbl">Стартапов</div></div><div class="stat-box"><div class="stat-box__num">'+(u.docs.filter(function(d){return d.data().role==='investor';}).length)+'</div><div class="stat-box__lbl">Инвесторов</div></div></div>' +
    '<div class="grid-2"><a href="admin.html" class="card card--clickable" style="text-decoration:none"><div style="font-size:32px;margin-bottom:12px">👥</div><div class="section-title" style="font-size:18px">Пользователи</div><p style="font-size:14px;color:var(--text2);margin-top:6px">Роли, блокировка, сброс паролей</p></a><a href="startups.html" class="card card--clickable" style="text-decoration:none"><div style="font-size:32px;margin-bottom:12px">🚀</div><div class="section-title" style="font-size:18px">Стартапы</div><p style="font-size:14px;color:var(--text2);margin-top:6px">Просмотр и удаление</p></a></div>';
}

async function answer(btn) {
  var id = btn.getAttribute('data-iid');
  var status = btn.getAttribute('data-st');
  await db.collection('invites').doc(id).update({ status: status });
  showToast(status==='accepted'?'✅ Принято':'❌ Отклонено');
  setTimeout(function(){ location.reload(); }, 800);
}

function toggleMyInvites(header) {
  var list   = document.getElementById('myInvitesList');
  var toggle = document.getElementById('myInvitesToggle');
  if (!list) return;
  var collapsed = list.style.display === 'none';
  list.style.display = collapsed ? 'block' : 'none';
  if (toggle) toggle.textContent = collapsed ? '▾' : '▸';
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
